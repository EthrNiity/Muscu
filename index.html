function renderCalendarView(){
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + calendarMonthOffset);
  const year = base.getFullYear(), month = base.getMonth();
  const monthLabel = base.toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // Monday=0
  const daysInMonth = new Date(year, month+1, 0).getDate();

  const sessionsByDate = {};
  data.sessions.forEach(s=>{
    if(Object.keys(s.entries).length>0 || Object.keys(s.done||{}).length>0 || s.customName) sessionsByDate[s.date] = s;
  });

  let html = '<div class="card">'
    + '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">'
    + '<button class="btn btn-secondary" style="padding:6px 12px;" onclick="shiftCalendarMonth(-1)">‹</button>'
    + '<b style="text-transform:capitalize;">' + monthLabel + '</b>'
    + '<button class="btn btn-secondary" style="padding:6px 12px;" onclick="shiftCalendarMonth(1)">›</button>'
    + '</div>'
    + '<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; font-size:10px; color:var(--text-faint); margin-bottom:4px;">'
    + ['L','M','M','J','V','S','D'].map(d=>'<div>'+d+'</div>').join('')
    + '</div>'
    + '<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px;">';

  for(let i=0;i<firstDow;i++) html += '<div></div>';
  for(let d=1; d<=daysInMonth; d++){
    const iso = toLocalISO(new Date(year, month, d));
    const has = !!sessionsByDate[iso];
    const isToday = iso === todayISO();
    html += '<div onclick="' + (has ? "jumpToHistoryDate('"+iso+"')" : '') + '" style="aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; font-size:12px; cursor:' + (has?'pointer':'default') + '; background:' + (has?'var(--accent)':'var(--surface-2)') + '; color:' + (has?'#141517':'var(--text-dim)') + '; font-weight:' + (has?'700':'400') + '; border:' + (isToday?'1.5px solid var(--gold)':'1px solid transparent') + ';">' + d + '</div>';
  }
  html += '</div></div>';
  return html;
}

function renderHisto(){
  const el = document.getElementById('view-histo');
  const sorted = data.sessions.filter(s=> Object.keys(s.entries).length>0 || Object.keys(s.done||{}).length>0 || s.customName).slice().sort((a,b)=> a.date<b.date?1:-1);
  const toggleBtn = '<button class="btn btn-ghost" style="margin-bottom:10px;" onclick="toggleHistoView()">' + (historoView==='list' ? '📅 Vue calendrier' : '📋 Vue liste') + '</button>';
  if(sorted.length===0){
    el.innerHTML = toggleBtn + '<div class="card empty"><b>Pas encore d\u2019historique</b>Tes séances passées apparaîtront ici — termine ta première séance depuis l\u2019onglet Séance.</div>';
    return;
  }
  if(historoView==='calendar'){
    el.innerHTML = toggleBtn + renderCalendarView();
    return;
  }
  let html = toggleBtn + '<div class="history-timeline">';
  if(sorted.length > 3){
    html += '<input type="text" id="historySearchInput" placeholder="Rechercher un exercice, une date..." autocomplete="off" oninput="filterHistory(this.value)" style="width:100%; background:var(--surface-3); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:12px; font-size:15px; margin-bottom:12px;">';
  }
  sorted.forEach((s, sIdx) => {
    const groups = sessionMuscleGroups(s);
    const displayName = s.customName || (groups.length ? ('Séance ' + groups.join(', ')) : 'Séance');
    const isOpen = expandedHistorySessions.has(s.id);
    const exoIds = new Set([...Object.keys(s.entries), ...Object.keys(s.done||{})]);
    const exoNames = [...exoIds].map(id=>{ const e = data.exercises.find(x=>x.id===id); return e ? e.name : ''; });
    const hasPR = [...exoIds].some(exoId=>{
      const setList = s.entries[exoId] || [];
      if(!setList.length) return false;
      const best = bestWeight(exoId, s.id);
      return best!==null && setList.some(st=>st.weight>best);
    });
    const blob = normalizeStr(displayName + ' ' + fmtDate(s.date) + ' ' + exoNames.join(' '));
    const histCal = computeSessionCalories(s);
    html += '<div class="hist-session' + (hasPR ? ' hist-pr' : '') + (sIdx===0 ? ' hist-latest' : '') + '" data-search-blob="' + blob + '">'
      + '<div class="hist-date" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleHistorySession(\'' + s.id + '\')">'
      + '<span><b style="color:var(--text); font-family:-apple-system,sans-serif;">' + escapeHtml(displayName) + '</b>' + (hasPR ? ' <span class="hist-pr-ribbon" title="Record battu">🏆</span>' : '') + '<br><span style="color:var(--text-faint);">' + fmtDate(s.date) + ' · ' + exoIds.size + ' exo(s)' + (histCal ? ' · ~' + histCal.total + ' kcal' : '') + '</span></span>'
      + '<span style="display:flex; align-items:center; gap:6px;">'
      + '<button class="edit-btn" onclick="event.stopPropagation(); createTemplateFromSession(\'' + s.id + '\')" title="Enregistrer comme modèle">📋</button>'
      + '<button class="edit-btn" onclick="event.stopPropagation(); renameSession(\'' + s.id + '\')" title="Renommer">✎</button>'
      + '<button class="del-btn" onclick="event.stopPropagation(); deleteSession(\'' + s.id + '\')" title="Supprimer cette séance">✕</button>'
      + '<span style="color:var(--text-faint); font-size:16px;">' + (isOpen?'−':'+') + '</span>'
      + '</span></div>';
    if(isOpen){
      exoIds.forEach(exoId=>{
        const exo = data.exercises.find(e=>e.id===exoId);
        const name = exo ? exo.name : '(exercice supprimé)';
        const setList = s.entries[exoId] || [];
        if(setList.length){
          const best = bestWeight(exoId, s.id);
          const sets = setList.map(st=>{
            if(isCardioExo(exo)) return formatCardioSet(exo, st);
            const isPR = best!==null && st.weight > best;
            return st.weight + "kg×" + st.reps + (isPR ? ' <span style="color:var(--gold);" title="Record à cette date">★</span>' : '');
          }).join(', ');
          html += '<div class="hist-exo" style="margin-top:8px;"><span class="n">' + escapeHtml(name) + '</span> — <span class="s">' + sets + '</span></div>';
        } else if(s.done && s.done[exoId]){
          html += '<div class="hist-exo" style="margin-top:8px;"><span class="n">' + escapeHtml(name) + '</span> — <span class="s">✓ fait (sans détail)</span></div>';
        }
      });
      if(s.note){
        html += '<div class="insight" style="margin-top:10px;">📝 ' + escapeHtml(s.note) + '</div>';
      }
    }
    html += '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

function ancienneteJours(){
  const dates = data.sessions.filter(s=>Object.keys(s.entries).length>0).map(s=>s.date).sort();
  if(!dates.length) return 0;
  const first = new Date(dates[0]+"T12:00:00");
  return (new Date() - first) / 86400000;
}
function totalVolumeAllTime(){
  let v = 0;
  data.sessions.forEach(s=>{ for(const id in s.entries) s.entries[id].forEach(st=> v += setVolume(id, st)); });
  return v;
}
function countAllTimePRs(){
  let count = 0;
  data.exercises.forEach(exo=>{
    const sets = allSetsForExercise(exo.id, null).slice().sort((a,b)=> a.date<b.date?-1:1);
    let best = -1;
    sets.forEach(s=>{ if(s.weight > best){ best = s.weight; count++; } });
  });
  return count;
}
function longestStreak(){
  const dates = [...new Set(data.sessions.filter(s=>Object.keys(s.entries).length>0).map(s=>s.date))].sort();
  if(!dates.length) return 0;
  let max=1, cur=1;
  for(let i=1;i<dates.length;i++){
    const prev = new Date(dates[i-1]+"T12:00:00");
    const curD = new Date(dates[i]+"T12:00:00");
    if((curD-prev)/86400000 === 1){ cur++; max=Math.max(max,cur); } else { cur=1; }
  }
  return max;
}

  el.innerHTML = ACHIEVEMENTS.map(a=>{
    const earned = a.check();
    const wasUnlocked = data.unlockedAchievements.includes(a.label);
    if(earned && !wasUnlocked) newlyUnlocked.push(a.label);

    return '<div class="badge-item' + (isNew ? ' badge-new' : '') + '" style="display:flex; flex-direction:column; align-items:center; gap:4px; width:78px; padding:8px 4px; border-radius:8px; background:' + (earned?'var(--surface-3)':'transparent') + '; opacity:' + (earned?'1':'0.35') + ';" title="' + escapeHtml(a.label) + '">'

      + '</div>';

function loadAvatarImage(){
  return new Promise((resolve)=>{
    const profile = getProfilesList().find(p=>p.id===ACTIVE_PROFILE_ID);
    if(!profile || !profile.avatar){ resolve(null); return; }
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = profile.avatar;
  });
}
function drawAvatarOrInitial(ctx, img, name, cx, cy, r, accentColor){
  const size = r*2;
  const x = cx-r, y = cy-r;
  const radius = size*0.28;
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x, y, size, size, radius);
  ctx.closePath();
  if(img && img.width && img.height){
    ctx.clip();
    // cover-crop: fill the whole square from the image's center, no stretching, no gaps
    const imgRatio = img.width / img.height;
    let sx, sy, sw, sh;
    if(imgRatio > 1){ sh = img.height; sw = sh; sx = (img.width-sw)/2; sy = 0; }
    else { sw = img.width; sh = sw; sx = 0; sy = (img.height-sh)/2; }
    ctx.drawImage(img, sx, sy, sw, sh, x, y, size, size);
    ctx.restore();
  } else {
    ctx.fillStyle = accentColor;
    ctx.globalAlpha = 0.25;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.fillStyle = '#f4f2ee';
    ctx.font = '600 ' + Math.round(r*1.3) + 'px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText((name||'?').charAt(0).toUpperCase(), cx, cy+2);
    ctx.textBaseline = 'alphabetic';
  }
  ctx.beginPath();
  ctx.roundRect(x, y, size, size, radius);
  ctx.strokeStyle = accentColor;
  ctx.lineWidth = 6;
  ctx.stroke();
}
function drawStarIcon(ctx, cx, cy, r, color){
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const outerAngle = -Math.PI/2 + i*(Math.PI*2/5);
    const innerAngle = outerAngle + Math.PI/5;
    const ox = cx + Math.cos(outerAngle)*r;
    const oy = cy + Math.sin(outerAngle)*r;
    const ix = cx + Math.cos(innerAngle)*r*0.42;
    const iy = cy + Math.sin(innerAngle)*r*0.42;
    if(i===0) ctx.moveTo(ox,oy); else ctx.lineTo(ox,oy);
    ctx.lineTo(ix,iy);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function medalImageDataUrl(color){
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
    + MEDAL_ICON_INNER
    + '<circle cx="12" cy="17" r="5.6" fill="' + color + '" fill-opacity="0.18"/>'
    + '</svg>';
  return 'data:image/svg+xml;base64,' + btoa(svg);
}
function loadMedalImage(color){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = medalImageDataUrl(color);
  });
}
function drawMedalBadge(ctx, img, cx, cy, r, color, rankLabel){
  if(img){
    ctx.drawImage(img, cx-r, cy-r, r*2, r*2);
  }
  ctx.fillStyle = color;
  ctx.font = '700 ' + Math.round(r*0.8) + 'px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(rankLabel, cx, cy+r*0.42);
  ctx.textBaseline = 'alphabetic';
}

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  let curY = y;
  const lines = [];
  words.forEach(w=>{
    const test = line ? line+' '+w : w;
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  });
  if(line) lines.push(line);
  const startY = curY - (lines.length-1)*lineHeight/2;
  lines.forEach((l,i)=> ctx.fillText(l, x, startY + i*lineHeight));
}
async function downloadOrShareCanvas(canvas, filename, shareTitle, shareText){
  canvas.toBlob(async (blob)=>{
    if(!blob) return;
    const file = new File([blob], filename, {type:'image/png'});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({ files:[file], title:shareTitle, text:shareText });
        return;
      }catch(e){ /* user cancelled or unsupported, fall through to download */ }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Image téléchargée");
  }, 'image/png');
}
function computeTopRecordsPodium(){
  const rows = [];
  data.exercises.forEach(exo=>{
    const sets = allSetsForExercise(exo.id, null);
    if(!sets.length) return;
    let best = sets[0];
    sets.forEach(s=>{ if(s.weight > best.weight) best = s; });
    rows.push({ name:exo.name, weight:best.weight, reps:best.reps });
  });
  rows.sort((a,b)=> b.weight-a.weight);
  return rows.slice(0,3);
}
async function generateShareCardPodiumCanvas(podium){
  const canvas = document.createElement('canvas');
  canvas.width = 1080;
  canvas.height = 1350;
  const ctx = canvas.getContext('2d');
  const accent = themeColor('accent', '#b39ddb');
  const gold = themeColor('gold', '#e8d48a');

  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#1b1c1f');
  grad.addColorStop(1, '#0e0e10');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = accent;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 3;
  ctx.strokeRect(40, 40, canvas.width-80, canvas.height-80);
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  ctx.fillStyle = accent;
  ctx.font = '600 46px Arial, sans-serif';
  ctx.fillText('ETHRNIITY', canvas.width/2, 100);

  const profile = getProfilesList().find(p=>p.id===ACTIVE_PROFILE_ID);
  const avatarImg = await loadAvatarImage();
  drawAvatarOrInitial(ctx, avatarImg, profile ? profile.name : '', canvas.width/2, 330, 95, accent);

  ctx.fillStyle = '#9c9890';
  ctx.font = '400 36px Arial, sans-serif';
  ctx.fillText(profile ? profile.name : '', canvas.width/2, 470);

  ctx.fillStyle = gold;
  ctx.font = '600 48px Arial, sans-serif';
  ctx.fillText('MES RECORDS', canvas.width/2, 540);

  const slotOrder = podium.length===3 ? [1,0,2] : podium.length===2 ? [1,0] : [0];
  const rankLabels = ['2','1','3'];
  const barColors = ['#b7bcc4','#e8d48a','#c98a5a'];
  const medalImgs = await Promise.all(barColors.map(c=>loadMedalImage(c)));
  const barBaseY = 1200;
  const barHeights = [230, 300, 150];
  const slotWidth = 320;
  const totalWidth = slotOrder.length * slotWidth;
  const startX = (canvas.width - totalWidth) / 2;

  slotOrder.forEach((idx, pos)=>{
    const r = podium[idx];
    const cx = startX + pos*slotWidth + slotWidth/2;
    const barH = barHeights[pos];
    const barY = barBaseY - barH;

    ctx.fillStyle = '#f4f2ee';
    ctx.font = '600 32px Arial, sans-serif';
    wrapCanvasText(ctx, r.name, cx, barY - 130, slotWidth-20, 38);

    drawMedalBadge(ctx, medalImgs[pos], cx, barY - 55, 50, barColors[pos], rankLabels[pos]);

    ctx.fillStyle = barColors[pos];
    ctx.globalAlpha = 0.85;
    const barW = slotWidth - 60;
    ctx.beginPath();
    ctx.roundRect(cx-barW/2, barY, barW, barH, [10,10,0,0]);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#141517';
    ctx.font = '800 54px Arial, sans-serif';
    ctx.fillText(r.weight + 'kg', cx, barY + 72);
  });

  ctx.fillStyle = '#6f6c65';
  ctx.font = '400 24px Arial, sans-serif';
  ctx.fillText(fmtDate(todayISO()), canvas.width/2, canvas.height-70);

  return canvas;
}

function renderTotalVolumeChart(){
  const sessions = data.sessions.filter(s=>Object.keys(s.entries).length>0).slice().sort((a,b)=> a.date<b.date?-1:1);
  const canvas = document.getElementById('totalVolumeCanvas');
  const labels = [], vols = [];
  sessions.forEach(s=>{
    let vol = 0;
    for(const exoId in s.entries) s.entries[exoId].forEach(st=> vol += setVolume(exoId, st));
    if(vol>0){ labels.push(fmtShort(s.date)); vols.push(Math.round(vol)); }
  });
  if(window.totalVolumeChart) window.totalVolumeChart.destroy();
  if(!vols.length){
    document.getElementById('totalVolumeInsight').innerHTML = '<div class="insight">Pas encore assez de séries loggées.</div>';
    return;
  }
  window.totalVolumeChart = new Chart(canvas, {
    type:'bar',
    data:{ labels: labels, datasets:[{ label:'Volume (kg)', data: vols, backgroundColor:themeColor('accent','#b39ddb') }] },
    options:{
      maintainAspectRatio:false,
      animation:{ delay: (ctx) => ctx.type==='data' ? ctx.dataIndex * 45 : 0 },
      transitions: { active: { animation: { duration: 0 } } },
      scales:{
        x:{ ticks:{ color:'#8f8c86', font:{size:9}, maxRotation:0, autoSkip:true }, grid:{ display:false } },
        y:{ ticks:{ color:'#8f8c86', font:{size:10} }, grid:{ color:'#222327' } }
      },
      plugins:{ legend:{ display:false } }
    }
  });
  const totalAllTime = vols.reduce((a,b)=>a+b,0);
  document.getElementById('totalVolumeInsight').innerHTML = '<div class="insight">Volume cumulé depuis le début : <b id="totalVolumeCounter">0 kg</b> soulevés au total, sur ' + vols.length + ' séance(s).</div>';
  animateCounter(document.getElementById('totalVolumeCounter'), totalAllTime, ' kg');
}

function renderRecordsList(){
  const el = document.getElementById('recordsList');
  const rows = [];
  data.exercises.forEach(exo=>{
    const sets = allSetsForExercise(exo.id, null);
    if(!sets.length) return;
    let best = sets[0];
    sets.forEach(s=>{ if(s.weight > best.weight) best = s; });
    rows.push({ name:exo.name, group:exo.muscleGroup, weight:best.weight, reps:best.reps, date:best.date });
  });
  if(!rows.length){
    el.innerHTML = '<div class="insight">Log des séries pour voir apparaître tes records ici.</div>';

  }
  rows.sort((a,b)=> b.weight-a.weight);

  rows.forEach(r=>{ (byGroup[r.group] = byGroup[r.group] || []).push(r); });

    const slotOrder = podium.length===3 ? [1,0,2] : [1,0];
    const heights = ['86px','110px','68px'];

    const r = podium[0];
    html += '<div class="weight-log-row record-top"><span class="d" style="flex:1;">🏆 ' + escapeHtml(r.name) + '</span><span class="w">' + r.weight + 'kg × ' + r.reps + '</span><div class="shine-sweep"></div></div>';
  }

  ALL_GROUPS.forEach(group=>{
    const groupRows = byGroup[group];
    if(!groupRows || !groupRows.length) return;
    html += '<details class="log-dropdown"><summary>' + escapeHtml(group) + ' (' + groupRows.length + ')</summary>'
      + '<div style="margin-top:8px;">' + groupRows.map(r=>
          '<div class="weight-log-row"><span class="d" style="flex:1;">' + escapeHtml(r.name) + '</span><span class="w">' + r.weight + 'kg × ' + r.reps + '</span></div>'
        ).join('') + '</div></details>';
  });

  el.innerHTML = html;
}

function animateCounter(el, target, suffix){
  if(!el) return;
  suffix = suffix || '';
  const dur = 650;
  const start = performance.now();
  function step(now){
    const p = Math.min(1, (now-start)/dur);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(eased*target).toLocaleString('fr-FR') + suffix;
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

let regularityViewYear = null, regularityViewMonth = null;
function renderRegularity(){
  const days = 91;
  const today = new Date();
  today.setHours(12,0,0,0);
  const volumeByDate = {};
  data.sessions.forEach(s=>{
    let vol = 0;
    for(const exoId in s.entries) s.entries[exoId].forEach(st=> vol += setVolume(exoId, st));
    if(vol>0) volumeByDate[s.date] = vol;
  });

  // stats
  const last30 = Object.keys(volumeByDate).filter(d=>{
    const dt = new Date(d+"T12:00:00");
    return (today - dt) / 86400000 <= 30;
  }).length;
  let streak = 0;
  for(let i=0;i<days;i++){
    const dt = new Date(today); dt.setDate(dt.getDate()-i);
    const iso = toLocalISO(dt);
    if(volumeByDate[iso]) streak++;
    else if(i>0 || !volumeByDate[todayISO()]) break;
  }
  document.getElementById('statBoxes').innerHTML =
    '<div class="stat-row">'
    + '<div class="stat-box"><div class="v" id="statLast30">0</div><div class="l">séances / 30j</div></div>'
    + '<div class="stat-box"><div class="v" id="statStreak">0</div><div class="l">jours de suite ' + (streak>0 ? '<span class="flame-flicker">🔥</span>' : '') + '</div></div>'
    + '<div class="stat-box"><div class="v" id="statTotalSessions">0</div><div class="l">séances au total</div></div>'
    + '</div>';
  animateCounter(document.getElementById('statLast30'), last30);
  animateCounter(document.getElementById('statStreak'), streak);
  animateCounter(document.getElementById('statTotalSessions'), data.sessions.filter(s=>Object.keys(s.entries).length>0).length);

  // heatmap: single selectable month grid, defaults to current month/year
  let maxVol = 0;
  Object.values(volumeByDate).forEach(v=>{ if(v>maxVol) maxVol=v; });

  if(regularityViewYear===null){ regularityViewYear = today.getFullYear(); regularityViewMonth = today.getMonth(); }

  const MONTH_NAMES = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const monthSelect = document.getElementById('regularityMonthSelect');
  const yearSelect = document.getElementById('regularityYearSelect');
  monthSelect.innerHTML = MONTH_NAMES.map((name,i)=>'<option value="'+i+'"'+(i===regularityViewMonth?' selected':'')+'>'+name+'</option>').join('');
  const sessionYears = data.sessions.map(s=>parseInt(s.date.slice(0,4))).filter(y=>!isNaN(y));
  const minYear = sessionYears.length ? Math.min(...sessionYears, today.getFullYear()) : today.getFullYear();
  const years = [];
  for(let y=today.getFullYear(); y>=minYear; y--) years.push(y);
  yearSelect.innerHTML = years.map(y=>'<option value="'+y+'"'+(y===regularityViewYear?' selected':'')+'>'+y+'</option>').join('');

  function cellStyleFor(iso){
    if(!iso) return { bg:'transparent', title:'' };
    const dt = new Date(iso+"T12:00:00");
    if(dt > today) return { bg:'transparent', title:'' };
    const v = volumeByDate[iso];
    let bg = 'var(--surface-3)';
    if(v){
      const ratio = maxVol>0 ? v/maxVol : 0;
      bg = hexToRgba(themeColor('accent','#b39ddb'), (0.25+ratio*0.75).toFixed(2));
    }
    return { bg, title: fmtShort(iso) + (v ? (' · '+Math.round(v)+' kg déplacés') : ' · repos') };
  }

  const daysInMonth = new Date(regularityViewYear, regularityViewMonth+1, 0).getDate();
  const firstDow = (new Date(regularityViewYear, regularityViewMonth, 1).getDay() + 6) % 7; // Monday=0
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(toLocalISO(new Date(regularityViewYear, regularityViewMonth, d)));
  while(cells.length % 7 !== 0) cells.push(null);

  let html = '<div style="display:grid; grid-template-columns:repeat(7,26px); gap:4px; margin-bottom:4px; justify-content:center;">'
    + ['L','M','M','J','V','S','D'].map(d=>'<div style="text-align:center; font-size:9px; color:var(--text-faint);">'+d+'</div>').join('')
    + '</div>'
    + '<div style="display:grid; grid-template-columns:repeat(7,26px); gap:4px; justify-content:center;">';
  cells.forEach((iso,i)=>{
    const st = cellStyleFor(iso);
    html += '<div class="heat-cell heat-grow" style="width:26px; height:26px; border-radius:5px; background:' + st.bg + '; animation-delay:' + (i*0.012) + 's;" title="' + st.title + '"></div>';
  });
  html += '</div>';
  document.getElementById('heatmapWrap').innerHTML = html;
}

      }
    }
    insightEl.innerHTML = html;
  }
}

function renderMacroPlate(nutri){
  const C = 2*Math.PI*15.5;
  const p = document.getElementById('segProtein'), c = document.getElementById('segCarb'), f = document.getElementById('segFat');
  if(!p || !c || !f) return;
  const proteinFrac = nutri.proteinPct/100, carbFrac = nutri.carbPct/100, fatFrac = nutri.fatPct/100;
  c.style.strokeDashoffset = -(proteinFrac*C);
  f.style.strokeDashoffset = -((proteinFrac+carbFrac)*C);
  requestAnimationFrame(()=>{
    p.setAttribute('stroke-dasharray', (proteinFrac*C)+' '+C);
    c.setAttribute('stroke-dasharray', (carbFrac*C)+' '+C);
    f.setAttribute('stroke-dasharray', (fatFrac*C)+' '+C);
  });
}

function computeNutrition(){
  const w = latestWeight();
  const h = data.profile.heightCm;
  const age = data.profile.age;
  const sex = data.profile.sex;
  const activity = ACTIVITY_LEVELS.find(a=>a.key===data.profile.activityLevel);
  const goal = data.profile.goal;
  if(!w || !h || !age || !sex || !activity || !goal) return null;

  const bmr = sex==='H' ? (10*w + 6.25*h - 5*age + 5) : (10*w + 6.25*h - 5*age - 161);
  const tdee = bmr * activity.mult;
  let target = tdee;
  if(goal==='perte') target = tdee - 500;
  else if(goal==='prise') target = tdee + 300;
  target = Math.max(1200, target);

  const proteinG = Math.round(w * 1.6);
  const proteinKcal = proteinG * 4;
  const fatKcal = target * 0.25;
  const fatG = Math.round(fatKcal / 9);
  const carbKcal = Math.max(0, target - proteinKcal - fatKcal);
  const carbG = Math.round(carbKcal / 4);

  return {
    bmr: Math.round(bmr), tdee: Math.round(tdee), target: Math.round(target),
    proteinG, fatG, carbG,
    proteinPct: Math.round(proteinKcal/target*100),
    fatPct: Math.round(fatKcal/target*100),
    carbPct: Math.round(carbKcal/target*100)
  };
}

function computeFoodAdvice(totals, nutri){
  const goal = data.profile.goal;
  if(!goal || goal==='maintien' || !nutri) return null;
  const diff = totals.kcal - nutri.target;
  const pct = nutri.target ? Math.round(Math.abs(diff)/nutri.target*100) : 0;
  if(goal==='prise' && diff < -200){
    return { type:'warn', text:'🍽️ Tu es à ' + Math.abs(diff) + ' kcal sous ta cible aujourd\u2019hui (-' + pct + '%) — pour prendre du poids, essaie d\u2019ajouter une collation riche en glucides/protéines.' };
  }
  if(goal==='perte' && diff > 200){
    return { type:'warn', text:'🍽️ Tu dépasses ta cible de ' + diff + ' kcal aujourd\u2019hui (+' + pct + '%) — reste attentif aux prochains repas si tu veux garder le cap sur la perte de poids.' };
  }
  if(totals.protein > 0 && nutri.proteinG && totals.protein < nutri.proteinG*0.6){
    return { type:'protein', text:'🥩 Ton apport en protéines est encore loin de ta cible (' + Math.round(totals.protein) + 'g / ' + nutri.proteinG + 'g) — pense à en ajouter au prochain repas.' };
  }
  return null;
}

function computeGoalCoherenceInsight(log){
  const goal = data.profile.goal;
  if(!goal || goal==='maintien') return null;
  if(!log || log.length < 2) return null;
  const sorted = log.slice().sort((a,b)=> a.date<b.date?1:-1); // newest first
  const latest = sorted[0];
  const latestDate = new Date(latest.date+"T12:00:00");
  // find an entry roughly 14-21 days before the latest one
  let reference = null;
  for(const e of sorted){
    if(e.date===latest.date) continue;
    const diffDays = (latestDate - new Date(e.date+"T12:00:00")) / 86400000;
    if(diffDays >= 10){ reference = e; break; }
  }
  if(!reference) return null;
  const diffDays = Math.round((latestDate - new Date(reference.date+"T12:00:00")) / 86400000);
  const change = latest.weight - reference.weight;
  const goalLabel = GOALS.find(g=>g.key===goal) ? GOALS.find(g=>g.key===goal).label.toLowerCase() : goal;

  if(goal==='prise' && change <= 0.2){
    return "Ton objectif est la <b>" + goalLabel + "</b>, mais ton poids a " + (change<0?"baissé":"stagné") + " (" + change.toFixed(1) + " kg) sur les " + diffDays + " derniers jours. Si c'est voulu tant mieux, sinon vérifie ton apport calorique dans la section \u00ab Besoins estimés \u00bb ci-dessous.";
  }
  if(goal==='perte' && change >= -0.2){
    return "Ton objectif est la <b>" + goalLabel + "</b>, mais ton poids a " + (change>0?"augmenté":"stagné") + " (+" + change.toFixed(1) + " kg) sur les " + diffDays + " derniers jours. Si c'est voulu tant mieux, sinon vérifie ton apport calorique dans la section \u00ab Besoins estimés \u00bb ci-dessous.";
  }
  return null;
}

function renderSymmetry(){
  const el = document.getElementById('symmetryWrap');
  if(!el) return;

  const results = MEASUREMENT_PAIRS.map(pair=>{
    const l = latestValueFor(pair.left);
    const r = latestValueFor(pair.right);
    if(!l || !r) return { pair, l, r, diff:null };
    const diff = r.value - l.value;
    const pct = ((diff) / ((l.value+r.value)/2) * 100);
    return { pair, l, r, diff, pct };
  });

  const armRes = results.find(x=>x.pair.label==='Bras');
  const legRes = results.find(x=>x.pair.label==='Cuisse');

  function sideColor(res, side){
    if(!res || res.diff===null || Math.abs(res.diff) < 0.3) return themeColor('text-faint','#5a5854');
    const strongerIsRight = res.diff > 0;

function latestMeasurementValue(point){
  const entries = data.profile.measurements.filter(e=>e.values[point]!=null).slice().sort((a,b)=> a.date<b.date?1:-1);
  return entries.length ? entries[0].values[point] : null;

function biggestAsymmetryInsight(){
  let worst = null;
  SIDE_PAIRS.forEach(p=>{
    const l = latestMeasurementValue(p.left), r = latestMeasurementValue(p.right);
    if(l==null || r==null) return;
    const diff = Math.abs(l-r);
    if(!worst || diff > worst.diff) worst = { label:p.label, diff, bigger: l>r ? 'gauche' : (r>l ? 'droit' : null) };
  });
  if(!worst || worst.diff < 0.5) return null;
  return 'Écart le plus marqué : <b>' + escapeHtml(worst.label) + '</b> — côté ' + worst.bigger + ' plus développé de ' + worst.diff.toFixed(1) + ' cm.';
}

const BODY_ANCHORS = {
  deltoid_left:[198.75,153.4], deltoid_right:[346.25,153.4],
  bicep_left:[192.95,204.6], bicep_right:[351.9,204.6],
  forearm_left:[181.6,259.4], forearm_right:[363.3,259.4],
  hand_left:[178.0,349.1], hand_right:[364.75,350.1],
  thigh_left:[232.5,331.5], thigh_right:[312.5,331.5],
  calf_left:[221.95,499.45], calf_right:[323.05,499.45],
  shoe_left:[187.45,611.5], shoe_right:[357.35,611.5]
};
const BODY_PARENT = {
  bicep_left:'deltoid_left', bicep_right:'deltoid_right',
  forearm_left:'bicep_left', forearm_right:'bicep_right',
  hand_left:'forearm_left', hand_right:'forearm_right',
  calf_left:'thigh_left', calf_right:'thigh_right',
  shoe_left:'calf_left', shoe_right:'calf_right'
};
function bodyIllustrationScale(leftKey, rightKey){
  const l = latestMeasurementValue(leftKey), r = latestMeasurementValue(rightKey);
  if(l==null && r==null) return { sL:1, sR:1, l, r };
  const avg = (l!=null && r!=null) ? (l+r)/2 : (l!=null ? l : r);
  const clamp = v => Math.max(0.85, Math.min(1.15, v));
  const sL = l!=null ? clamp(1 + ((l/avg)-1)*3) : 1;
  const sR = r!=null ? clamp(1 + ((r/avg)-1)*3) : 1;
  return { sL, sR, l, r };
}
function darkenHex(hex, factor){
  const h = (hex||'#9575c9').replace('#','');
  const r = Math.round(parseInt(h.slice(0,2),16)*factor);
  const g = Math.round(parseInt(h.slice(2,4),16)*factor);
  const b = Math.round(parseInt(h.slice(4,6),16)*factor);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function applyBodyIllustrationScaling(){
  const svgRoot = document.getElementById('bodyIllustrationSvg');
  if(!svgRoot) return;

  const capColor = themeColor('accent','#9575c9');
  svgRoot.querySelectorAll('.cap-accent-fill').forEach(p=> p.setAttribute('fill', capColor));
  svgRoot.querySelectorAll('.cap-accent-dark').forEach(p=> p.setAttribute('fill', darkenHex(capColor, 0.65)));

  const bicep = bodyIllustrationScale('Bras gauche','Bras droit');
  const forearm = bodyIllustrationScale('Avant-bras gauche','Avant-bras droit');
  const thigh = bodyIllustrationScale('Cuisse gauche','Cuisse droite');
  const calf = bodyIllustrationScale('Mollet gauche','Mollet droit');

  const scales = {
    deltoid_left:1, deltoid_right:1,
    bicep_left:bicep.sL, bicep_right:bicep.sR,
    forearm_left:forearm.sL, forearm_right:forearm.sR,
    hand_left:1, hand_right:1,
    thigh_left:thigh.sL, thigh_right:thigh.sR,
    calf_left:calf.sL, calf_right:calf.sR,
    shoe_left:1, shoe_right:1
  };
  function transformedAnchor(id){
    let [x,y] = BODY_ANCHORS[id];
    let chain = []; let p = BODY_PARENT[id];
    while(p){ chain.unshift(p); p = BODY_PARENT[p]; }
    chain.forEach(anc=>{
      const ax = BODY_ANCHORS[anc][0];
      x = ax + scales[anc]*(x-ax);
    });
    return [x,y];
  }
  function relativeScale(id){
    const parent = BODY_PARENT[id];
    return parent ? scales[id]/scales[parent] : scales[id];
  }
  Object.keys(BODY_ANCHORS).forEach(id=>{
    const el = svgRoot.querySelector('#'+id);
    if(!el) return;
    const anchor = transformedAnchor(id);
    const rs = relativeScale(id);
    el.setAttribute('transform', 'translate(' + anchor[0] + ',' + anchor[1] + ') scale(' + rs + ',1) translate(' + (-anchor[0]) + ',' + (-anchor[1]) + ')');
  });

  const INTENSE_RGB = [200,40,40];
  function lerpColor(hex, rgb, t){
    const h = (hex||'#c7b299').replace('#','');
    const r0 = parseInt(h.slice(0,2),16), g0 = parseInt(h.slice(2,4),16), b0 = parseInt(h.slice(4,6),16);
    const r = Math.round(r0+(rgb[0]-r0)*t), g = Math.round(g0+(rgb[1]-g0)*t), b = Math.round(b0+(rgb[2]-b0)*t);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function tintGroup(id, intensity){
    const el = svgRoot.querySelector('#'+id);
    if(!el) return;
    el.querySelectorAll('path').forEach(p=>{
      if(!p.dataset.origFill){
        const f = p.getAttribute('fill');
        p.dataset.origFill = (f && f.startsWith('#')) ? f : '';
      }
      if(!p.dataset.origFill) return;
      p.setAttribute('fill', lerpColor(p.dataset.origFill, INTENSE_RGB, intensity*0.65));
    });
  }
  [['bicep_left','bicep_right',bicep],['forearm_left','forearm_right',forearm],['thigh_left','thigh_right',thigh],['calf_left','calf_right',calf]].forEach(pair=>{
    const lid=pair[0], rid=pair[1], d=pair[2];
    const diff = Math.abs(d.sL - d.sR);
    const intensity = Math.min(1, diff/0.3);
    const biggerId = d.sL > d.sR ? lid : rid;
    const smallerId = d.sL > d.sR ? rid : lid;
    tintGroup(biggerId, intensity);
    tintGroup(smallerId, 0);
  });
}

// ---------- Profil view ----------
function latestWeight(){
  const log = data.profile.weightLog;
  if(!log.length) return null;
  return log.slice().sort((a,b)=> a.date<b.date?1:-1)[0].weight;
}

function computeSessionCalories(session){
  const bw = latestWeight();
  if(!bw) return null;
  let strengthSets = 0;
  let cardioCalories = 0;
  for(const exoId in session.entries){
    const exo = data.exercises.find(e=>e.id===exoId);
    const sets = session.entries[exoId];
    if(!sets || !sets.length) continue;
    if(isCardioExo(exo)){
      sets.forEach(s=>{
        const speed = s.speed||0, incline = s.incline||0, duration = s.duration||0;
        const met = Math.max(2, Math.min(12, 2 + speed*0.6 + incline*0.15));
        cardioCalories += met * bw * 3.5 / 200 * duration;
      });
    } else {
      strengthSets += sets.length;
    }
  }
  const strengthMinutes = strengthSets * 2.75;
  const strengthMet = 5;
  const strengthCalories = strengthMet * bw * 3.5 / 200 * strengthMinutes;
  const total = Math.round(strengthCalories + cardioCalories);
  return { total, strengthCalories: Math.round(strengthCalories), cardioCalories: Math.round(cardioCalories), strengthMinutes: Math.round(strengthMinutes) };
}

const VAPID_PUBLIC_KEY = 'BBGjU8qyFQgEnQmxnzCQ8vLG_KvWaDtGkHLzlfU3WKPXL8GCEdLZw0olOB6Cwu4nUV7mopvnfz_81id2RpRD5lU';
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i=0;i<rawData.length;i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}
function pushNotifStatus(){
  if(!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) return 'unsupported';
  return Notification.permission; // 'default' | 'granted' | 'denied'
}
async function enablePushNotifications(){
  const cfg = loadSyncConfig();
  if(!cfg.url || !cfg.anonKey || !cfg.syncCode){
    showToast("Configure d'abord ton code de synchro (Profil → Synchronisation cloud)");
    return;
  }
  if(pushNotifStatus()==='unsupported'){ showToast("Les notifications ne sont pas supportées sur cet appareil"); return; }
  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){ showToast("Permission refusée"); renderProfil(); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const res = await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/push_subscriptions', {
      method:'POST',
      headers:{ 'apikey':cfg.anonKey, 'Authorization':'Bearer '+cfg.anonKey, 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates' },
      body: JSON.stringify({ profile_key: cfg.syncCode, subscription: sub.toJSON(), activity_level: data.profile.activityLevel || null, updated_at: new Date().toISOString() })
    });
    if(!res.ok){ const t = await res.text(); showToast("Erreur d'enregistrement : " + t.slice(0,80)); return; }
    showToast("Notifications activées ✓");
    renderProfil();
  }catch(e){
    showToast("Erreur : " + e.message);
  }
}
async function disablePushNotifications(){
  const cfg = loadSyncConfig();
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      await sub.unsubscribe();
      if(cfg.url && cfg.anonKey && cfg.syncCode){
        await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/push_subscriptions?profile_key=eq.' + encodeURIComponent(cfg.syncCode), {
          method:'DELETE',
          headers:{ 'apikey':cfg.anonKey, 'Authorization':'Bearer '+cfg.anonKey }
        });
      }
    }
    showToast("Notifications désactivées");
    renderProfil();
  }catch(e){
    showToast("Erreur : " + e.message);
  }
}

async function downloadFromCloud(){

  const client = getSupabaseClient();
  if(!window.confirm("Ça va remplacer tes données locales par celles du cloud. Continuer ?")) return;
  showToast("Récupération...");
  try{
    const { data: rows, error } = await client.from('backups').select('payload,updated_at').eq('sync_key', authSession.user.id);
    if(error){ window.alert("Erreur de récupération cloud\n\n" + error.message); return; }
    if(!rows.length){ showToast("Aucune sauvegarde trouvée pour ce compte"); return; }
    const payload = rows[0].payload;
    const identity = payload._identity;
    delete payload._identity;
    data = payload;
    normalizeData();
    if(identity){
      const list = getProfilesList();
      const p = list.find(pr=>pr.id===ACTIVE_PROFILE_ID);
      if(p){
        if(identity.name) p.name = identity.name;
        if(identity.avatar) p.avatar = identity.avatar;
        saveProfilesList(list);
      }
    }
    saveData();
    render();
    renderProfil();
    window.alert("✅ Données récupérées du cloud\n\nSauvegardée le : " + (rows[0].updated_at ? new Date(rows[0].updated_at).toLocaleString('fr-FR', { timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone }) : '—'));

  }

function importDataFile(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!window.confirm("Importer ce fichier va remplacer toutes tes données actuelles sur ce profil. Continuer ?")){
    event.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const imported = JSON.parse(e.target.result);
      if(!imported || typeof imported !== 'object' || !Array.isArray(imported.exercises) || !Array.isArray(imported.sessions)){
        throw new Error('Format de fichier invalide');
      }
      data = imported;
      normalizeData();
      saveData();
      render();
      renderProfil();
      showToast("Données importées ✓");
    }catch(err){
      window.alert("Impossible d'importer ce fichier.\n\n" + err.message);
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

  if(!activeProfile) return;
  const { xp, days, penalty } = computeRankXP();

  try{
    await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/leaderboard', {
      method:'POST',

        group_code: cfg.leaderboardCode,
        profile_key: cfg.syncCode,

        rank_name: current.name,

      })

function computeRankXPAsOf(dateISO){
  const sessionsUpTo = data.sessions.filter(s=>Object.keys(s.entries).length>0 && s.date<=dateISO);
  const sessionCount = sessionsUpTo.length;
  let totalVolume = 0;
  sessionsUpTo.forEach(s=>{
    for(const exoId in s.entries) s.entries[exoId].forEach(st=> totalVolume += (st.weight||0)*(st.reps||0));
  });
  const winBonus = (data.challengeWins||[]).filter(w=>w<=dateISO).length * 100;
  const rawXP = Math.round(sessionCount*15 + totalVolume/100 + winBonus);
  const lastDate = sessionsUpTo.length ? sessionsUpTo.map(s=>s.date).sort().slice(-1)[0] : null;
  let days = null;
  if(lastDate) days = Math.round((new Date(dateISO+"T12:00:00") - new Date(lastDate+"T12:00:00")) / 86400000);
  const rules = ACTIVITY_XP_RULES[data.profile.activityLevel] || { tolerance:2, rate:6 };
  let penalty = 0;
  if(days!==null && days > rules.tolerance) penalty = (days - rules.tolerance) * rules.rate;
  return Math.max(0, rawXP - penalty);
}
function computeXPTimeline(){
  const sessionDates = [...new Set(data.sessions.filter(s=>Object.keys(s.entries).length>0).map(s=>s.date))].sort();
  if(!sessionDates.length) return [];
  const today = todayISO();
  const sorted = [...sessionDates];
  if(!sorted.includes(today)) sorted.push(today);
  sorted.sort();
  const allDates = new Set(sorted);
  for(let i=0;i<sorted.length-1;i++){
    const d0 = new Date(sorted[i]+"T12:00:00");
    const d1 = new Date(sorted[i+1]+"T12:00:00");
    const gapDays = (d1-d0)/86400000;
    if(gapDays > 9){
      const steps = Math.floor(gapDays/7);
      for(let k=1;k<=steps;k++){
        const d = new Date(d0); d.setDate(d.getDate()+k*7);
        if(d < d1) allDates.add(toLocalISO(d));
      }
    }
  }
  return [...allDates].sort().map(d=>({ date:d, xp:computeRankXPAsOf(d) }));
}

function currentWeekStartISO(){
  const now = new Date();
  const day = now.getDay();
  const diff = (day===0 ? -6 : 1-day);
  const monday = new Date(now);
  monday.setDate(now.getDate()+diff);
  return toLocalISO(monday);
}

function volumeForWeekRange(weekStartISO){
  const endDate = new Date(weekStartISO+"T12:00:00"); endDate.setDate(endDate.getDate()+7);
  const end = toLocalISO(endDate);
  let vol = 0;
  data.sessions.forEach(s=>{
    if(s.date>=weekStartISO && s.date<end){
      for(const exoId in s.entries) s.entries[exoId].forEach(st=> vol += (st.weight||0)*(st.reps||0));
    }
  });
  return vol;
}
function computeWeeklyLoadAdvice(){
  const weekStarts = [];
  const now = new Date();
  for(let i=0;i<6;i++){
    const d = new Date(now); d.setDate(d.getDate() - i*7);
    const day = d.getDay(); const diff = (day===0?-6:1-day);
    const monday = new Date(d); monday.setDate(d.getDate()+diff);
    weekStarts.push(toLocalISO(monday));
  }
  const uniqueWeeks = [...new Set(weekStarts)].sort();
  const currentWeekStart = currentWeekStartISO();
  const idx = uniqueWeeks.indexOf(currentWeekStart);
  if(idx <= 1) return null;
  const lastCompleteWeek = uniqueWeeks[idx-1];
  const priorWeeks = uniqueWeeks.slice(0, idx-1);
  const lastVol = volumeForWeekRange(lastCompleteWeek);
  const priorVols = priorWeeks.map(volumeForWeekRange).filter(v=>v>0);
  if(priorVols.length===0 || lastVol===0) return null;
  const avgPrior = priorVols.reduce((a,b)=>a+b,0)/priorVols.length;
  const ratio = lastVol/avgPrior;
  const pct = Math.round(Math.abs(ratio-1)*100);
  if(ratio >= 1.25){
    return { type:'heavy', text:'💪 Semaine dernière plus lourde que d\u2019habitude (+' + pct + '% de volume par rapport à tes semaines précédentes). Pense à privilégier une semaine plus légère pour laisser la récupération suivre.' };
  }
  if(ratio <= 0.75){
    return { type:'light', text:'🌱 Semaine dernière plus légère que d\u2019habitude (-' + pct + '% de volume). Si tu te sens bien, c\u2019est le bon moment pour remettre de l\u2019intensité.' };
  }
  return null;
}

const CHALLENGE_TYPES = [
  { key:'volume', label:'Volume total soulevé', unit:'kg', compute: (sessions) => {
      let v=0; sessions.forEach(s=>{ for(const id in s.entries) s.entries[id].forEach(st=> v += setVolume(id, st)); });
      return Math.round(v);
    } },
  { key:'sessions', label:'Nombre de séances', unit:'séance(s)', compute: (sessions) => sessions.filter(s=>Object.keys(s.entries).length>0).length },
  { key:'sets', label:'Nombre de séries', unit:'série(s)', compute: (sessions) => {
      let c=0; sessions.forEach(s=>{ for(const id in s.entries) c += s.entries[id].length; });
      return c;
    } },
  { key:'exercises', label:'Exercices différents travaillés', unit:'exo(s)', compute: (sessions) => {
      const set = new Set(); sessions.forEach(s=>{ for(const id in s.entries) if(s.entries[id].length) set.add(id); });
      return set.size;
    } },
  { key:'maxlift', label:'Charge la plus lourde soulevée', unit:'kg', compute: (sessions) => {
      let m=0; sessions.forEach(s=>{ for(const id in s.entries) s.entries[id].forEach(st=>{ if(st.weight>m) m=st.weight; }); });
      return m;
    } },
  { key:'reps', label:'Répétitions totales', unit:'reps', compute: (sessions) => {
      let c=0; sessions.forEach(s=>{ for(const id in s.entries) s.entries[id].forEach(st=> c += st.reps); });
      return c;
    } }
];
function isoWeekNumber(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date-yearStart)/86400000)+1)/7);
}
function currentChallengeType(){
  const wn = isoWeekNumber(new Date());
  return CHALLENGE_TYPES[wn % CHALLENGE_TYPES.length];
}

async function sendFriendRequest(){
  const cfg = loadSyncConfig();
  const rawCode = document.getElementById('addFriendCodeInput').value.trim();
  if(!rawCode){ showToast("Entre le code ami de ton ami"); return; }
  if(rawCode.replace(/^#/,'').toUpperCase() === myFriendCode()){ showToast("C'est ton propre code !"); return; }
  try{
    const resolved = await resolveFriendCode(rawCode);
    if(!resolved){ showToast("Code introuvable — vérifie qu'il a bien ouvert l'onglet Amis au moins une fois"); return; }
    const headers = { apikey:cfg.anonKey, Authorization:'Bearer '+cfg.anonKey };

    // has this person already sent ME a request (in either direction)? avoid creating a duplicate row
    const existingRes = await fetch(cfg.url.replace(/\/$/,'')
      + '/rest/v1/friends?or=(and(requester_key.eq.' + encodeURIComponent(resolved.sync_key) + ',friend_key.eq.' + encodeURIComponent(cfg.syncCode) + '),and(requester_key.eq.' + encodeURIComponent(cfg.syncCode) + ',friend_key.eq.' + encodeURIComponent(resolved.sync_key) + '))&select=*',
      { headers });
    const existing = existingRes.ok ? await existingRes.json() : [];

    if(existing.length){
      const row = existing[0];
      if(row.status==='accepted'){ showToast("Vous êtes déjà amis"); openFriendsModal(); return; }
      // a request already exists between you two (whichever direction) — accept it instead of duplicating
      await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/friends?requester_key=eq.' + encodeURIComponent(row.requester_key) + '&friend_key=eq.' + encodeURIComponent(row.friend_key), {
        method:'PATCH',
        headers: Object.assign({'Content-Type':'application/json'}, headers),
        body: JSON.stringify({ status:'accepted' })
      });
      showToast("Vous êtes maintenant amis" + (resolved.name ? ' avec ' + resolved.name : ''));
      openFriendsModal();
      return;
    }

    const res = await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/friends', {
      method:'POST',
      headers: Object.assign({'Content-Type':'application/json', Prefer:'resolution=merge-duplicates'}, headers),
      body: JSON.stringify({ requester_key:cfg.syncCode, friend_key:resolved.sync_key, status:'pending' })
    });
    if(!res.ok){ const t = await res.text(); showToast("Erreur : " + t.slice(0,80)); return; }
    showToast("Demande envoyée" + (resolved.name ? ' à ' + resolved.name : ''));
    openFriendsModal();
  }catch(e){ showToast("Erreur : " + e.message); }
}

}

        + '<button class="btn btn-secondary" style="width:100%; margin-top:10px;" onclick="openFriendsModal()">← Retour</button>';
      return;
    }
    const friendData = rows[0].payload;
    const friendProfile = friendData._identity || {};
    const sessionsCount = (friendData.sessions||[]).filter(s=>Object.keys(s.entries||{}).length>0).length;
    let bestLift = null;
    (friendData.exercises||[]).forEach(exo=>{
      (friendData.sessions||[]).forEach(s=>{
        (s.entries[exo.id]||[]).forEach(st=>{
          if(!bestLift || st.weight > bestLift.weight) bestLift = { name:exo.name, weight:st.weight, reps:st.reps };
        });
      });
    });
    let html = leaderboardTabsHtml('friends');
    html += '<div style="display:flex; align-items:center; gap:12px; margin-bottom:14px;">'
      + avatarHtml({avatar:friendProfile.avatar, name:friendProfile.name||friendCode}, 48)
      + '<div><div style="font-size:16px; font-weight:600;">' + escapeHtml(friendProfile.name||friendCode) + '</div>'
      + '<div style="font-size:12px; color:var(--text-faint);">Dernière sync : ' + new Date(rows[0].updated_at).toLocaleDateString('fr-FR') + '</div></div>'
      + '</div>';
    html += '<div class="stat-row">'
      + '<div class="stat-box"><div class="v">' + sessionsCount + '</div><div class="l">séances</div></div>'
      + (bestLift ? '<div class="stat-box"><div class="v">' + bestLift.weight + 'kg</div><div class="l">' + escapeHtml(bestLift.name) + '</div></div>' : '')
      + '</div>';
    html += '<button class="btn btn-secondary" style="width:100%; margin-top:14px;" onclick="openFriendsModal()">← Retour</button>';
    content.innerHTML = html;
  }catch(e){
    content.innerHTML = leaderboardTabsHtml('friends') + '<div class="insight">Erreur : ' + escapeHtml(e.message) + '</div>';
  }
}

let lastWeeklyPush = 0;
async function pushWeeklyChallenge(){
  const cfg = loadSyncConfig();
  if(!cfg.url || !cfg.anonKey || !cfg.leaderboardCode || !cfg.syncCode) return;
  const now = Date.now();
  if(now - lastWeeklyPush < 15000) return;
  lastWeeklyPush = now;
  const activeProfile = getProfilesList().find(pr=>pr.id===ACTIVE_PROFILE_ID);
  if(!activeProfile) return;
  const weekStart = currentWeekStartISO();
  const weekSessions = data.sessions.filter(s=>s.date>=weekStart);
  const challenge = currentChallengeType();
  const value = challenge.compute(weekSessions);
  try{
    await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/weekly_challenge', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey': cfg.anonKey,
        'Authorization':'Bearer ' + cfg.anonKey,
        'Prefer':'resolution=merge-duplicates'
      },
      body: JSON.stringify({ group_code: cfg.leaderboardCode, profile_key: cfg.syncCode, week_start: weekStart, name: activeProfile.name, avatar: activeProfile.avatar||null, metric_type: challenge.key, metric_value: value, volume: challenge.key==='volume' ? value : 0, updated_at: new Date().toISOString() })
    });
  }catch(e){ /* best-effort */ }
}
async function checkAndClaimWeeklyWin(){
  const cfg = loadSyncConfig();
  if(!cfg.url || !cfg.anonKey || !cfg.leaderboardCode || !cfg.syncCode) return;
  const thisMonday = new Date(currentWeekStartISO()+"T12:00:00");
  const prevMonday = new Date(thisMonday); prevMonday.setDate(prevMonday.getDate()-7);
  const prevWeekStart = toLocalISO(prevMonday);
  if((data.challengeWins||[]).includes(prevWeekStart)) return;
  const prevChallenge = CHALLENGE_TYPES[isoWeekNumber(prevMonday) % CHALLENGE_TYPES.length];
  try{
    const res = await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/weekly_challenge?group_code=eq.' + encodeURIComponent(cfg.leaderboardCode) + '&week_start=eq.' + prevWeekStart + '&metric_type=eq.' + prevChallenge.key + '&select=*&order=metric_value.desc&limit=1', {
      headers:{ 'apikey': cfg.anonKey, 'Authorization':'Bearer ' + cfg.anonKey }
    });
    if(!res.ok) return;
    const rows = await res.json();
    if(rows.length && rows[0].profile_key === cfg.syncCode && rows[0].metric_value > 0){
      data.challengeWins.push(prevWeekStart);
      saveData();
      renderRankBadge();
      showToast('🏆 Défi de la semaine dernière remporté ! +100 XP');
    }
  }catch(e){ /* silent - best-effort */ }
}

function saveHeight(){

}

function logWeight(){
  const date = document.getElementById('weightDateInput').value || todayISO();
  const val = parseFloat(document.getElementById('weightInput').value);
  if(isNaN(val) || val<=0){ showToast("Entre un poids valide"); return; }
  const existing = data.profile.weightLog.find(e=>e.date===date);
  if(existing) existing.weight = val;
  else data.profile.weightLog.push({date, weight:val});
  saveData();
  justLoggedWeight = true;
  renderNutrition();
  justLoggedWeight = false;
  showToast("Pesée enregistrée");
}

function logMeasurement(){
  const date = document.getElementById('measureDateInput').value || todayISO();
  const values = {};
  let any = false;
  MEASUREMENT_POINTS.forEach(pt=>{
    const inp = document.getElementById('measure_' + slugifyId(pt));
    const v = parseFloat(inp.value);
    if(!isNaN(v) && v>0){ values[pt] = v; any = true; }
  });
  if(!any){ showToast("Renseigne au moins une mesure"); return; }
  const existing = data.profile.measurements.find(e=>e.date===date);
  if(existing) Object.assign(existing.values, values);
  else data.profile.measurements.push({date, values});
  saveData();
  renderNutrition();
  showToast("Mensurations enregistrées");
}

function renderMeasurementChart(){
  const sel = document.getElementById('measureChartSelect');
  const canvas = document.getElementById('measureCanvas');
  if(!sel || !canvas) return;
  const point = sel.value;
  const chrono = data.profile.measurements
    .filter(e=>e.values[point]!=null)
    .slice()
    .sort((a,b)=> a.date<b.date?-1:1);
  if(measureChart) measureChart.destroy();
  if(chrono.length < 2) return;
  measureChart = new Chart(canvas, {
    type:'line',
    data:{
      labels: chrono.map(e=>fmtShort(e.date)),
      datasets:[{
        label: point + ' (cm)',
        data: chrono.map(e=>e.values[point]),
        borderColor:themeColor('accent','#b39ddb'),
        backgroundColor:themeColor('accent','#b39ddb')+'26',
        tension:0.3,
        fill:true,
        pointBackgroundColor:themeColor('accent','#b39ddb'),
        pointRadius:4
      }]
    },
    options:{
      maintainAspectRatio:false,
      animation: LINE_DRAW_ANIMATION,
      transitions: { active: { animation: { duration: 0 } } },
      scales:{
        x:{ ticks:{ color:'#8f8c86', font:{size:10} }, grid:{ color:'#222327' } },
        y:{ ticks:{ color:'#8f8c86', font:{size:10} }, grid:{ color:'#222327' } }
      },
      plugins:{ legend:{ display:false } }
    }
  });
}

function switchTab(viewName){
  const buttons = [...document.querySelectorAll('nav.tabs button')];
  buttons.forEach(b=>b.classList.toggle('active', b.dataset.view===viewName));
  const idx = buttons.findIndex(b=>b.dataset.view===viewName);
  const underline = document.getElementById('tabUnderline');
  if(underline && idx>=0) underline.style.left = (idx*100/buttons.length) + '%';
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+viewName).classList.add('active');
  if(viewName==='stats') renderStats();
  if(viewName==='nutrition') renderNutrition();
}
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=> switchTab(btn.dataset.view));
});

document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.btn');
  if(!btn) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const r = document.createElement('span');
  r.className = 'ripple-effect';
  r.style.width = r.style.height = size + 'px';
  r.style.left = (e.clientX - rect.left - size/2) + 'px';
  r.style.top = (e.clientY - rect.top - size/2) + 'px';
  btn.appendChild(r);
  setTimeout(()=>r.remove(), 550);
});

boot();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').then(reg=>{
      reg.update();
      document.addEventListener('visibilitychange', ()=>{
        if(document.visibilityState==='visible') reg.update();
      });
      window.addEventListener('focus', ()=> reg.update());
      // A worker may already be sitting in "waiting" from a previous visit
      // (e.g. the page was open when an update landed) — surface it now too.
      if(reg.waiting && navigator.serviceWorker.controller){
        showUpdateBanner(reg.waiting);
      }
      reg.addEventListener('updatefound', ()=>{
        const newSW = reg.installing;
        if(!newSW) return;
        newSW.addEventListener('statechange', ()=>{
          if(newSW.state==='installed' && navigator.serviceWorker.controller){
            showUpdateBanner(newSW);
          }
        });
      });
    }).catch(()=>{});
  });
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(refreshing) return;
    refreshing = true;
    window.location.reload();
  });
}
function showUpdateBanner(waitingWorker){
  if(document.getElementById('updateBanner')) return;
  const bar = document.createElement('div');
  bar.id = 'updateBanner';
  bar.style.cssText = 'position:fixed; top:0; left:0; right:0; z-index:200; background:var(--accent); color:#141517; text-align:center; padding:10px; font-size:13px; font-weight:600; cursor:pointer;';
  bar.textContent = '🔄 Nouvelle version disponible — appuie pour mettre à jour';
  bar.onclick = ()=>{
    bar.textContent = '⏳ Mise à jour en cours...';
    bar.onclick = null;
    if(waitingWorker) waitingWorker.postMessage({type:'SKIP_WAITING'});
  };
  document.body.appendChild(bar);
}
