<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EthrNiity</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141517">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#141517;
    --surface:#1b1c1f;
    --surface-2:#222327;
    --surface-3:#2a2b2f;
    --text:#e2e0da;
    --text-dim:#8f8c86;
    --text-faint:#5a5854;
    --accent:#b39ddb;
    --accent-dim:#8874a8;
    --accent-rgb:179,157,219;
    --steel:#b39ddb;
    --gold:#e8d48a;
    --gold-rgb:232,212,138;
    --green:#8ec99b;
    --green-rgb:142,201,155;
    --terracotta:#e8d48a;
    --border:#2a2a28;
    --radius:10px;
  }
  body.light-theme{
    --bg:#f5f3ee;
    --surface:#ffffff;
    --surface-2:#f0eee8;
    --surface-3:#e7e4dc;
    --text:#292723;
    --text-dim:#6b675f;
    --text-faint:#9a958a;
    --accent:#8874a8;
    --accent-dim:#6f5d8c;
    --steel:#8874a8;
    --gold:#a8863a;
    --green:#6f5d8c;
    --terracotta:#a8863a;
    --border:#ded9cd;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(var(--accent-rgb),0.05), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(var(--green-rgb),0.04), transparent 40%);
    background-attachment:fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding-bottom:84px;
    animation:ambientShift 26s ease-in-out infinite alternate;
  }
  @keyframes ambientShift{
    0%{ background-position: 0% 0%, 0% 0%; }
    100%{ background-position: 3% 2%, -3% -2%; }
  }
  .mono{font-family:"SF Mono","Consolas","Menlo",monospace; letter-spacing:0.02em;}
  h1,h2,h3{
    font-family:Impact,"Haettenschweiler","Arial Narrow Bold",sans-serif;
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:0.03em;
    margin:0;
  }
  h2.section-title{font-size:15px; color:var(--text-dim); margin-bottom:10px; letter-spacing:0.06em;}
  header.top{
    padding:22px 18px 16px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#1a1b1f 0%, var(--bg) 100%);
    position:sticky; top:0; z-index:20;
    transition:box-shadow 0.25s ease, backdrop-filter 0.25s ease;
  }
  header.top.scrolled{
    box-shadow:0 8px 20px -8px rgba(0,0,0,0.45);
    backdrop-filter:blur(6px);
  }
  .header-row{display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:10px;}
  .logo-text{
    font-family:Optima, Candara, "Segoe UI", sans-serif;
    font-size:22px; font-weight:400; letter-spacing:0.04em; color:var(--text);
  }
  .logo-accent{color:var(--accent); font-weight:600;}
  .header-right{display:flex; align-items:center; gap:8px;}
  .rank-badge{
    display:flex; align-items:center; gap:6px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:20px; padding:5px 10px 5px 6px;
    font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em;
    cursor:default;
  }
  .rank-gem{width:10px; height:10px; border-radius:2px; transform:rotate(45deg); flex-shrink:0;}
  .profile-btn{
    width:32px; height:32px; border-radius:50%;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  }
  .profile-btn:active{background:var(--surface-3);}
  .subline{color:var(--text-dim); font-size:13px; margin-top:10px; font-family:"SF Mono",monospace;}
  main{max-width:720px; margin:0 auto; padding:16px;}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
    transition:border-color 0.25s ease, box-shadow 0.25s ease;
  }
  @media (hover:hover){
    .card:hover{ border-color:#3a3a38; box-shadow:0 4px 16px rgba(0,0,0,0.18); }
  }
  .exo-card{padding:0; overflow:hidden;}
  .exo-header{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; cursor:pointer;
    background:var(--surface);
    transition:background 0.2s ease, transform 0.15s ease;
  }
  .exo-header:active{background:var(--surface-2); transform:scale(0.99);}
  .exo-name-row{display:flex; align-items:center; gap:8px;}
  .exo-name{font-size:17px; font-weight:600;}
  .tag{
    font-size:10px; text-transform:uppercase; letter-spacing:0.04em;
    padding:2px 6px; border-radius:4px; font-weight:700;
  }
  .exo-hint{color:var(--text-faint); font-size:12px; font-family:"SF Mono",monospace; margin-top:4px;}
  .edit-btn{background:none; border:none; color:var(--text-faint); font-size:14px; cursor:pointer; padding:6px;}
  .done-check{
    flex-shrink:0; width:26px; height:26px; margin-top:1px; border-radius:50%;
    border:2px solid var(--text-faint); background:none; padding:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  .done-check svg{width:14px; height:14px; opacity:0; transform:scale(0.5); transition:opacity 0.2s ease, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);}
  .done-check.checked{background:var(--green); border-color:var(--green);}
  .done-check.checked svg{opacity:1; transform:scale(1);}
  .done-check.bounced{animation:checkBounce 0.4s cubic-bezier(0.34,1.56,0.64,1);}
  .drag-handle{
    touch-action:none; cursor:grab; color:var(--text-faint); font-size:18px;
    padding:6px 4px; letter-spacing:-2px; user-select:none;
  }
  .exo-card.dragging{position:relative; z-index:50; box-shadow:0 8px 24px rgba(0,0,0,0.35); opacity:0.95;}
  .exo-quick-actions{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .exo-quick-actions .edit-btn{
    background:var(--surface-3); border-radius:8px; padding:7px 10px; font-size:12px; color:var(--text-dim);
  }
  .exo-body{
    border-top:1px solid transparent;
    padding:0 16px;
    background:var(--surface-2);
    max-height:0; overflow:hidden;
    transition:max-height 0.35s cubic-bezier(0.2,0.8,0.3,1), padding 0.35s cubic-bezier(0.2,0.8,0.3,1);
  }
  .exo-body.open{max-height:900px; padding:14px 16px; border-top-color:var(--border);}
  .set-row{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px 0; border-bottom:1px dashed var(--border);
    font-family:"SF Mono",monospace; font-size:14px;
  }
  .set-row:last-of-type{border-bottom:none;}
  .set-num{color:var(--text-faint); width:20px;}
  .pr-badge{
    background:var(--gold); color:#1a1500; font-size:10px; font-weight:700;
    padding:2px 6px; border-radius:4px; letter-spacing:0.05em;
    animation:pop 0.4s ease;
  }
  @keyframes pop{0%{transform:scale(0.5);opacity:0;}70%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
  @keyframes rowFlash{0%{background:rgba(var(--gold-rgb),0.3);}100%{background:transparent;}}
  .set-row.flash{animation:rowFlash 0.8s ease;}
  @keyframes rowOut{to{opacity:0; transform:translateX(-16px); max-height:0; padding-top:0; padding-bottom:0; margin-bottom:0;}}
  .set-row.removing{animation:rowOut 0.24s ease forwards; overflow:hidden;}
  .btn{position:relative; overflow:hidden;}
  .ripple-effect{position:absolute; border-radius:50%; background:rgba(255,255,255,0.35); transform:scale(0); pointer-events:none; animation:rippleAnim 0.55s ease-out;}
  @keyframes rippleAnim{to{transform:scale(3); opacity:0;}}
  @keyframes cardIn{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:translateY(0);}}
  .exo-card.card-in{animation:cardIn 0.35s cubic-bezier(0.2,0.7,0.3,1) backwards;}
  @keyframes rankGlow{
    0%{ box-shadow:0 0 0 0 rgba(var(--gold-rgb),0); }
    30%{ box-shadow:0 0 0 6px rgba(var(--gold-rgb),0.35); transform:scale(1.08); }
    100%{ box-shadow:0 0 0 0 rgba(var(--gold-rgb),0); transform:scale(1); }
  }
  .rank-badge.levelup{animation:rankGlow 1.1s ease;}
  @keyframes checkBounce{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}
  .done-btn.bounced{animation:checkBounce 0.4s cubic-bezier(0.34,1.56,0.64,1);}
  @keyframes greenPulse{0%{box-shadow:0 0 0 0 rgba(var(--green-rgb),0.5);}70%{box-shadow:0 0 0 6px rgba(var(--green-rgb),0);}100%{box-shadow:0 0 0 0 rgba(var(--green-rgb),0);}}
  .tag.done-pulse{animation:greenPulse 0.9s ease;}
  @keyframes greenGlow{0%,100%{opacity:0.75;}50%{opacity:1; text-shadow:0 0 6px rgba(var(--green-rgb),0.5);}}
  .balanced-glow{animation:greenGlow 2.4s ease-in-out infinite;}
  @keyframes badgeReveal{0%{transform:scale(0.6); opacity:0;}100%{transform:scale(1); opacity:1;}}
  .badge-item.badge-new{animation:badgeReveal 0.5s cubic-bezier(0.34,1.56,0.64,1);}
  .del-btn{margin-left:auto; background:none; border:none; color:var(--text-faint); font-size:16px; cursor:pointer; padding:4px 8px;}
  .del-btn:hover{color:var(--accent);}
  .add-set-form{display:flex; gap:8px; margin-top:12px;}
  .add-set-form input{
    flex:1; background:var(--surface-3); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:10px; font-size:15px;
    font-family:"SF Mono",monospace; min-width:0;
  }
  .add-set-form input:focus{outline:none; border-color:var(--accent);}
  .btn{
    background:var(--accent); color:#fff; border:none; border-radius:8px;
    padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer;
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .btn:active{background:var(--accent-dim);}
  .btn-add{background:var(--green);}
  .btn-add:active{filter:brightness(0.85);}
  .measure-guide-dot{
    fill:var(--accent); fill-opacity:0.88; stroke:var(--bg); stroke-width:2.5;
    cursor:pointer; transition:r 0.15s ease, fill-opacity 0.15s ease;
  }
  .measure-guide-dot:hover, .measure-guide-dot:active{ fill-opacity:1; }
  input.measure-input-highlight{
    box-shadow:0 0 0 3px var(--accent);
    transition:box-shadow 0.3s ease;
  }
  .btn-secondary{background:var(--surface-3); color:var(--gold); border:1px solid rgba(var(--gold-rgb),0.28);}
  .btn-secondary:active{background:rgba(var(--gold-rgb),0.12);}
  .btn-ghost{background:none; border:1px dashed var(--text-faint); color:var(--text-dim); width:100%; padding:14px;}
  .empty{color:var(--text-faint); text-align:center; padding:30px 10px; font-size:14px;}
  @keyframes dumbbellRock{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}}
  .dumbbell-rock{display:inline-block; animation:dumbbellRock 1.8s ease-in-out infinite; transform-origin:center;}
  @keyframes emptyBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .empty-dumbbell{font-size:40px; margin-bottom:10px; animation:emptyBounce 2.2s ease-in-out infinite;}
  @keyframes timerPulse{0%,100%{opacity:1;}50%{opacity:0.55;}}
  .timer-pulsing{animation:timerPulse 1s ease-in-out infinite;}
  @keyframes flameFlicker{0%,100%{transform:scale(1) rotate(-2deg);}50%{transform:scale(1.15) rotate(2deg);}}
  .flame-flicker{display:inline-block; animation:flameFlicker 1.1s ease-in-out infinite;}
  .plate-spinner{animation:plateSpin 1.8s linear infinite;}
  @keyframes plateSpin{to{transform:rotate(360deg);}}
  .loading-row{display:flex; align-items:center; gap:10px; color:var(--text-dim); font-size:13px; padding:6px 0;}
  .record-top{position:relative; overflow:hidden;}
  .record-top .shine-sweep{position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(100deg, transparent, rgba(var(--gold-rgb),0.22), transparent); animation:shineSweep 1.3s ease 0.2s;}
  .podium-wrap{display:flex; align-items:flex-end; gap:8px; margin-bottom:16px; padding:0 2px;}
  .podium-slot{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center;}
  .podium-medal{font-size:22px; margin-bottom:4px;}
  .podium-name{
    font-size:11px; color:var(--text-dim); margin-bottom:6px; text-align:center;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;
  }
  .podium-bar{
    width:100%; border-radius:8px 8px 0 0; display:flex; align-items:flex-start;
    justify-content:center; padding-top:8px; animation:podiumRise 0.5s cubic-bezier(0.2,0.8,0.3,1) backwards;
  }
  @keyframes podiumRise{ from{ transform:scaleY(0); opacity:0; } to{ transform:scaleY(1); opacity:1; } }
  .podium-bar-1{background:var(--gold); transform-origin:bottom;}
  .podium-bar-2{background:#b0aca4; transform-origin:bottom; animation-delay:0.1s;}
  .podium-bar-3{background:#c9a88a; transform-origin:bottom; animation-delay:0.2s;}
  .podium-weight{font-family:"SF Mono",monospace; font-weight:700; font-size:13px; color:#141517;}
  @keyframes shineSweep{to{left:130%;}}
  .history-timeline{position:relative; padding-left:16px;}
  .history-timeline::before{content:''; position:absolute; left:4px; top:8px; bottom:8px; width:2px; background:linear-gradient(var(--accent), var(--border));}
  .hist-session{position:relative;}
  .hist-session::before{content:''; position:absolute; left:-16px; top:5px; width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--bg);}
  .hist-session.hist-latest::before{animation:histDotPulse 1.8s ease-in-out infinite;}
  @keyframes histDotPulse{0%,100%{box-shadow:0 0 0 3px var(--bg);}50%{box-shadow:0 0 0 6px rgba(var(--accent-rgb),0.28), 0 0 0 3px var(--bg);}}
  .float-icon{display:inline-block; animation:floatY 2.6s ease-in-out infinite;}
  @keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .body-dot{animation:bodyDotPulse 1.8s ease-in-out infinite;}
  @keyframes bodyDotPulse{0%,100%{opacity:1;}50%{opacity:0.45;}}
  @keyframes heatGrow{from{transform:scale(0.3); opacity:0;}to{transform:scale(1); opacity:1;}}
  .heat-grow{animation:heatGrow 0.3s ease backwards;}
  @keyframes prRibbonGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(var(--gold-rgb),0));}50%{filter:drop-shadow(0 0 4px rgba(var(--gold-rgb),0.7));}}
  .hist-pr-ribbon{display:inline-block; animation:prRibbonGlow 1.6s ease-in-out infinite;}
  .hist-session.hist-pr{border-left-color:var(--gold);}
  .empty b{color:var(--text-dim); display:block; margin-bottom:4px; font-size:16px;}
  nav.tabs{
    position:fixed; bottom:0; left:0; right:0;
    background:var(--surface); border-top:1px solid var(--border);
    display:flex; z-index:30; overflow:hidden;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--text-faint);
    padding:12px 4px 10px; font-size:11px; text-transform:uppercase;
    letter-spacing:0.04em; cursor:pointer; font-weight:600;
    transition:color 0.25s ease, transform 0.15s ease;
  }
  nav.tabs button.active{color:var(--accent);}
  nav.tabs button:active{transform:scale(0.92);}
  .tab-underline{position:absolute; top:0; left:0; height:2px; width:25%; background:var(--accent); transition:left 0.28s cubic-bezier(0.4,0,0.2,1);}
  .view{display:none;}
  @keyframes viewFadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .view.active{display:block; animation:viewFadeIn 0.32s cubic-bezier(0.2,0.8,0.3,1);}
  .hist-session{padding-left:12px; margin-bottom:16px;}
  .hist-date{font-family:"SF Mono",monospace; color:var(--steel); font-size:13px; margin-bottom:6px;}
  .hist-exo{font-size:14px; margin-bottom:3px;}
  .hist-exo .n{color:var(--text-dim); font-weight:600;}
  .hist-exo .s{color:var(--text-faint); font-family:"SF Mono",monospace; font-size:13px;}
  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:40;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.25s ease;
  }
  .modal-bg.open{opacity:1; pointer-events:auto;}
  .modal{
    background:var(--surface-2); border-radius:14px 14px 0 0; padding:20px;
    width:100%; max-width:480px; border-top:1px solid var(--border);
    max-height:88vh; overflow-y:auto;
    transform:translateY(100%);
    transition:transform 0.32s cubic-bezier(0.2,0.8,0.3,1);
  }
  .modal-bg.open .modal{transform:translateY(0);}
  .modal label{display:block; font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; margin:12px 0 6px;}
  .modal input, .modal select{
    width:100%; background:var(--surface-3); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:12px; font-size:16px;
  }
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal-actions .btn{flex:1;}
  .toast{
    position:fixed; top:0; left:50%; transform:translate(-50%,-46px);
    background:var(--surface-3); color:var(--text); padding:10px 18px;
    border-radius:20px; font-size:13px; z-index:50; border:1px solid var(--border);
    opacity:0; transition:opacity 0.28s ease, transform 0.28s cubic-bezier(0.2,0.8,0.3,1); pointer-events:none;
  }
  .toast.show{opacity:1; transform:translate(-50%,16px);}
  .toast.toast-success{border-color:var(--green); box-shadow:0 0 14px rgba(var(--green-rgb),0.28);}
  .day-scroll-wrap{margin-bottom:16px;}
  .day-scroll-header{
    font-size:15px; font-weight:600; color:var(--text); margin-bottom:12px; cursor:pointer;
    display:flex; align-items:center; gap:5px; text-transform:capitalize;
  }
  .day-scroll-chevron{font-size:11px; color:var(--text-faint); transform:translateY(1px);}
  .day-scroll{display:flex; justify-content:space-between; gap:4px; position:relative;}
  .day-scroll::before{
    content:''; position:absolute; left:7.5%; right:7.5%; top:27px; height:2px;
    background:var(--surface-3); z-index:0;
  }
  .day-dot-col{flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; position:relative; z-index:1;}
  .day-dot-label{
    position:relative; font-size:10px; white-space:nowrap; color:var(--text-faint);
    font-weight:600; line-height:1; height:12px;
  }
  .day-dot-pointer{position:absolute; top:-11px; left:50%; transform:translateX(-50%); font-size:10px; color:var(--accent); line-height:1;}
  .day-dot{
    width:15px; height:15px; border-radius:50%; background:var(--bg);
    border:2px solid var(--surface-3);
    transition:background 0.25s ease, border-color 0.25s ease, transform 0.15s ease;
  }
  .day-dot-col:active .day-dot{transform:scale(0.88);}
  .day-dot.filled{background:var(--gold); border-color:var(--gold);}
  .day-dot.active{background:var(--accent); border-color:var(--accent);}
  .finish-celebration{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:200; pointer-events:none;}
  .finish-check{
    width:64px; height:64px; border-radius:50%; background:var(--green);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 30px rgba(var(--green-rgb),0.5);
    transform:scale(0); opacity:0;
    transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
  }
  .finish-check.play{transform:scale(1); opacity:1;}
  .confetti-bit{position:absolute; width:8px; height:8px; border-radius:2px; top:50%; left:50%; opacity:0;}
  .confetti-bit.play{animation:confettiFly 1s ease-out forwards;}
  @keyframes confettiFly{
    0%{transform:translate(0,0) rotate(0deg); opacity:1;}
    100%{transform:translate(var(--dx),var(--dy)) rotate(360deg); opacity:0;}
  }
  .achievement-celebration{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:210; pointer-events:none; background:rgba(20,21,23,0); transition:background 0.3s ease;
  }
  .achievement-celebration:not(.fade-out){background:rgba(20,21,23,0.55);}
  .achievement-celebration.fade-out{opacity:0; transition:opacity 0.4s ease;}
  .achievement-badge-burst{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    transform:scale(0.4); opacity:0;
    transition:transform 0.55s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s ease;
  }
  .achievement-badge-burst.play{transform:scale(1); opacity:1;}
  .achievement-icon{
    font-size:52px; width:100px; height:100px; border-radius:50%;
    background:var(--surface-2); border:3px solid var(--green);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 40px rgba(var(--green-rgb),0.45); margin-bottom:14px;
  }
  .achievement-title{font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--green); font-weight:700;}
  .achievement-label{font-size:17px; color:var(--text); font-weight:700; margin-top:4px; max-width:260px;}
  select#progExoSelect{
    width:100%; background:var(--surface-3); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:10px; font-size:14px; margin-bottom:12px;
  }
  .chart-wrap{position:relative; height:220px;}
  .chart-wrap.tall{height:260px;}
  .stat-row{display:flex; gap:10px; margin-bottom:12px;}
  .stat-box{flex:1; background:var(--surface-3); border-radius:8px; padding:10px 12px; text-align:center;}
  .stat-box .v{font-family:"SF Mono",monospace; font-size:20px; color:var(--text); font-weight:700;}
  .stat-box .l{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.03em; margin-top:2px;}
  .heatmap{display:flex; gap:3px; overflow-x:auto; padding-bottom:4px;}
  .heat-col{display:flex; flex-direction:column; gap:3px;}
  .heat-cell{width:11px; height:11px; border-radius:2px; background:var(--surface-3);}
  .legend-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; justify-content:center;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim);}
  .legend-dot{width:9px; height:9px; border-radius:50%;}
  .insight{font-size:13px; color:var(--text-dim); background:var(--surface-3); border-radius:8px; padding:10px 12px; margin-top:12px; line-height:1.5;}
  .profile-form{display:flex; gap:8px; align-items:flex-end;}
  .profile-form .field{flex:1;}
  .profile-form label{display:block; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:6px;}
  .profile-form input{
    width:100%; background:var(--surface-3); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:10px; font-size:15px; font-family:"SF Mono",monospace;
  }
  .weight-log-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:7px 0; border-bottom:1px dashed var(--border); font-size:13px;
    font-family:"SF Mono",monospace;
  }
  .weight-log-row:last-child{border-bottom:none;}
  .weight-log-row .d{color:var(--text-faint); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .weight-log-row .w{color:var(--text); font-weight:600; flex-shrink:0;}
  .log-dropdown{ font-size:13px; }
  .log-dropdown summary{
    cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between;
    padding:6px 2px; color:var(--text-dim); font-weight:600; font-size:12px;
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .log-dropdown summary::-webkit-details-marker{ display:none; }
  .log-dropdown summary::after{
    content:'▾'; color:var(--text-faint); font-size:11px; transition:transform 0.2s ease; margin-left:8px;
  }
  .log-dropdown[open] summary::after{ transform:rotate(180deg); }
  .log-dropdown[open] summary{ border-bottom:1px solid var(--border); margin-bottom:4px; padding-bottom:10px; }
  #librarySearchInput{
    width:100%; background:var(--surface-3); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:12px; font-size:16px;
  }
  .lib-group-title{
    font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em;
    margin:14px 0 4px; padding-left:2px;
  }
  .lib-item{
    display:flex; align-items:center; gap:10px; padding:10px 4px;
    border-bottom:1px dashed var(--border); cursor:pointer; background:none; border-left:none; border-right:none; border-top:none;
    width:100%; text-align:left;
  }
  .lib-item:active{background:var(--surface-3);}
  .lib-icon{flex-shrink:0; width:20px; height:20px;}
  .lib-name{flex:1; font-size:14px; color:var(--text);}
  .lib-empty{color:var(--text-faint); font-size:13px; text-align:center; padding:20px 0;}
  #app-root{display:none;}
  @keyframes appBootIn{ from{opacity:0; transform:translateY(10px) scale(0.995);} to{opacity:1; transform:translateY(0) scale(1);} }
  #app-root.boot-in{animation:appBootIn 0.5s cubic-bezier(0.2,0.8,0.3,1);}
  #profile-picker{
    display:none; position:fixed; inset:0; background:var(--bg); z-index:100;
    align-items:center; justify-content:center; padding:20px;
  }
  .picker-box{width:100%; max-width:360px;}
  .picker-box label{display:block; font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px;}
  .picker-box input{
    width:100%; background:var(--surface-3); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:12px; font-size:16px;
  }
  .picker-profile-row{display:flex; align-items:center; gap:6px; margin-bottom:8px;}
  .picker-profile-btn{
    flex:1; text-align:left; background:var(--surface); border:1px solid var(--border);
    color:var(--text); border-radius:10px; padding:14px 16px; font-size:15px; cursor:pointer;
  }
  .picker-profile-btn:active{background:var(--surface-2);}
  @media (min-width:700px){
    main{padding:24px;}
    .logo-text{font-size:26px;}
    nav.tabs{max-width:520px; left:50%; transform:translateX(-50%); border:1px solid var(--border); border-radius:14px; bottom:16px;}
  }
</style>
</head>
<body>

<div id="profile-picker"></div>

<div id="app-root">
<header class="top">
  <div class="header-row">
    <div class="brand">
      <span class="logo-text" id="headerLogoText"><span class="logo-accent">E</span>thr<span class="logo-accent">N</span>iity</span>
    </div>
    <div class="header-right">
      <div class="rank-badge" id="rankBadge" onclick="openXPProgressModal()" style="cursor:pointer;"></div>
      <button class="profile-btn" id="profileBtn" onclick="openProfileModal()" aria-label="Profil"></button>
    </div>
  </div>
  <div class="subline" id="todayLabel">—</div>
</header>

<main>
  <div id="view-seance" class="view active"></div>
  <div id="view-stats" class="view"></div>
  <div id="view-nutrition" class="view"></div>
  <div id="view-histo" class="view"></div>
</main>

<nav class="tabs">
  <button data-view="seance" class="active">Séance</button>
  <button data-view="stats">Stats</button>
  <button data-view="nutrition">Nutrition</button>
  <button data-view="histo">Historique</button>
  <div class="tab-underline" id="tabUnderline" style="left:0%;"></div>
</nav>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle" style="font-size:18px;">Nouvel exercice</h3>
    <label>Nom</label>
    <input type="text" id="newExoInput" placeholder="Ex : Développé couché" autocomplete="off">
    <label>Groupe musculaire</label>
    <select id="newExoGroup"></select>
    <label>Type d'effort</label>
    <select id="newExoType"></select>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-add" onclick="confirmAddExo()">Enregistrer</button>
    </div>
    <button class="btn btn-secondary" id="deleteExoBtn" style="width:100%; margin-top:10px; display:none; color:var(--accent);" onclick="confirmDeleteExercise()">🗑 Supprimer définitivement de ma liste</button>
  </div>
</div>

<div class="modal-bg" id="libraryModalBg" onclick="if(event.target===this) closeLibraryModal()">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="font-size:18px;">Ajouter un exercice</h3>
      <button class="del-btn" style="font-size:20px;" onclick="closeLibraryModal()">✕</button>
    </div>
    <input type="text" id="librarySearchInput" placeholder="Rechercher un exercice..." autocomplete="off" style="margin-top:10px;">
    <div id="libraryResults" style="margin-top:10px;"></div>
    <button class="btn btn-add" style="width:100%; margin-top:8px;" onclick="closeLibraryModal(); openAddModal();">+ Créer un exercice personnalisé</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="customConfirmModalBg" onclick="if(event.target===this) closeCustomConfirm(false)">
  <div class="modal">
    <div id="customConfirmMessage" style="font-size:14px; line-height:1.6; margin-bottom:4px;"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeCustomConfirm(false)">Annuler</button>
      <button class="btn" id="customConfirmOkBtn" style="background:#c77b6b;" onclick="closeCustomConfirm(true)">Confirmer</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="photoComparatorModalBg" onclick="if(event.target===this) closePhotoComparator()">
  <div class="modal" id="photoComparatorModalContent"></div>
</div>

<div class="modal-bg" id="onboardingModalBg">
  <div class="modal" id="onboardingModalContent"></div>
</div>

<div class="modal-bg" id="profileModalBg" onclick="if(event.target===this) closeProfileModal()">
  <div class="modal" id="profileModalContent"></div>
</div>

<div class="modal-bg" id="leaderboardModalBg" onclick="if(event.target===this) closeLeaderboardModal()">
  <div class="modal" id="leaderboardModalContent"></div>
</div>

<div class="modal-bg" id="templateBuilderModalBg" onclick="if(event.target===this) closeTemplateBuilderModal()">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 id="templateBuilderTitle" style="font-size:18px;">Nouveau modèle</h3>
      <button class="del-btn" style="font-size:20px;" onclick="closeTemplateBuilderModal()">✕</button>
    </div>
    <label>Nom du modèle</label>
    <input type="text" id="templateNameInput" placeholder="Ex : Séance Push" autocomplete="off">
    <div id="templateDraftRows" style="margin-top:14px;"></div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-add" style="flex:1;" onclick="openMultiSelectExoModal()">+ Ajouter des exercices</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeTemplateBuilderModal()">Annuler</button>
      <button class="btn btn-add" onclick="saveTemplate()">Enregistrer le modèle</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="multiSelectExoModalBg" onclick="if(event.target===this) closeMultiSelectExoModal()">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="font-size:18px;">Sélectionner des exercices</h3>
      <button class="del-btn" style="font-size:20px;" onclick="closeMultiSelectExoModal()">✕</button>
    </div>
    <input type="text" id="multiSelectSearchInput" placeholder="Rechercher un exercice..." autocomplete="off" style="margin-top:10px;" oninput="renderMultiSelectExoList()">
    <div id="multiSelectExoList" style="margin-top:10px; max-height:50vh; overflow-y:auto;"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeMultiSelectExoModal()">Annuler</button>
      <button class="btn btn-add" onclick="confirmMultiSelectExo()">Ajouter la sélection</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="toolsModalBg" onclick="if(event.target===this) closeToolsModal()">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="font-size:18px;">Outils</h3>
      <button class="del-btn" style="font-size:20px;" onclick="closeToolsModal()">✕</button>
    </div>

    <h2 class="section-title" style="margin-top:16px;">Calculateur de charge de barre</h2>
    <div class="profile-form">
      <div class="field"><label>Poids visé (kg)</label><input type="number" step="0.5" id="plateTargetInput" placeholder="100" oninput="renderPlateResult()"></div>
      <div class="field"><label>Poids de la barre (kg)</label><input type="number" step="0.5" id="plateBarInput" value="20" oninput="renderPlateResult()"></div>
    </div>
    <div id="plateResult" style="margin-top:10px;"></div>

    <h2 class="section-title" style="margin-top:22px;">1RM estimé</h2>
    <div class="profile-form">
      <div class="field"><label>Poids soulevé (kg)</label><input type="number" step="0.5" id="rmWeightInput" placeholder="80" oninput="render1RMResult()"></div>
      <div class="field"><label>Répétitions</label><input type="number" id="rmRepsInput" placeholder="8" oninput="render1RMResult()"></div>
    </div>
    <div id="rmResult" style="margin-top:10px;"></div>
  </div>
</div>

<div class="modal-bg" id="supersetModalBg" onclick="if(event.target===this) closeSupersetModal()">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="font-size:18px;">Créer un superset</h3>
      <button class="del-btn" style="font-size:20px;" onclick="closeSupersetModal()">✕</button>
    </div>
    <div style="font-size:12px; color:var(--text-dim); margin:6px 0 12px;">Sélectionne 2 exercices (ou plus) de ta séance du jour à enchaîner sans repos entre eux.</div>
    <div id="supersetPicker"></div>
    <button class="btn" style="width:100%; margin-top:14px;" onclick="confirmCreateSuperset()">Lier ces exercices</button>
  </div>
</div>
</div>

  if(/\bvelo\b|cyclisme|spinning|bike/.test(norm)) return ['speed','duration'];
  if(/rameur|aviron|rowing/.test(norm)) return ['speed','duration'];
  if(/corde|jump\s?rope/.test(norm)) return ['duration'];
  return ['speed','incline','duration'];
}
function formatCardioSet(exo, s){
  const fields = cardioFieldsFor(exo);
  const parts = [];
  if(fields.includes('speed')) parts.push(s.speed + 'km/h');
  if(fields.includes('incline')) parts.push(s.incline + '% incl.');
  if(fields.includes('duration')) parts.push(s.duration + 'min');
  return parts.join(' · ');
}

function normalizeStr(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

function dumbbellMultiplier(exoName){
  if(!exoName) return 1;
  const norm = normalizeStr(exoName);
  if(/\bhalteres\b/.test(norm)) return 2;
  return 1;
}

  return (st.weight||0) * (st.reps||0) * mult;
}

if(typeof Chart !== 'undefined'){
  Chart.register({
    id: 'lineDrawReveal',
    beforeDatasetsDraw(chart){
      if(chart._lineRevealDone) return;
      const progress = chart._lineRevealProgress;
      if(progress===undefined) return;
      if(progress>=1){ chart._lineRevealDone = true; return; }
      const {ctx, chartArea} = chart;
      ctx.save();
      ctx.beginPath();
      ctx.rect(chartArea.left, chartArea.top - 4, chartArea.width * progress, chartArea.height + 8);
      ctx.clip();
    },
    afterDatasetsDraw(chart){
      if(chart._lineRevealDone) return;
      const progress = chart._lineRevealProgress;
      if(progress===undefined || progress>=1) return;
      chart.ctx.restore();
    }
  });
  Chart.register({
    id: 'rankBands',
    beforeDatasetsDraw(chart){
      if(chart.canvas.id !== 'xpProgressCanvas') return;
      const {ctx, chartArea, scales} = chart;
      const yScale = scales.y;
      ctx.save();
      RANK_TIERS.forEach((tier,i)=>{
        const nextMin = (i < RANK_TIERS.length-1) ? RANK_TIERS[i+1].min : tier.min + (tier.min - (RANK_TIERS[i-1]?RANK_TIERS[i-1].min:0) || 2000);
        let yTop = yScale.getPixelForValue(nextMin);
        let yBottom = yScale.getPixelForValue(tier.min);
        yTop = Math.max(yTop, chartArea.top);
        yBottom = Math.min(yBottom, chartArea.bottom);
        if(yBottom <= chartArea.top || yTop >= chartArea.bottom || yBottom<=yTop) return;
        ctx.fillStyle = tier.color + (i%2===0 ? '29' : '1c');
        ctx.fillRect(chartArea.left, yTop, chartArea.width, yBottom-yTop);
        if(yBottom-yTop > 11){
          ctx.fillStyle = tier.color;
          ctx.font = '10px -apple-system, sans-serif';
          ctx.textBaseline = 'middle';
          ctx.fillText(tier.name, chartArea.left+6, (yTop+yBottom)/2);
        }
      });
      ctx.restore();
    }
  });
}

function generateFriendCode(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O/1/I/L, avoids confusion
  let code = '';
  for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}
function myFriendCode(){
  const key = friendCodeStorageKey(ACTIVE_PROFILE_ID);
  let code = localStorage.getItem(key);
  if(!code){
    code = generateFriendCode();
    localStorage.setItem(key, code);
  }
  return code;
}
async function ensureFriendCodeRegistered(){
  const cfg = loadSyncConfig();
  if(!cfg.url || !cfg.anonKey || !cfg.syncCode) return;
  const activeProfile = getProfilesList().find(pr=>pr.id===ACTIVE_PROFILE_ID);
  const code = myFriendCode();
  try{
    await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/profile_codes', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey:cfg.anonKey, Authorization:'Bearer '+cfg.anonKey, Prefer:'resolution=merge-duplicates' },
      body: JSON.stringify({ friend_code:code, sync_key:cfg.syncCode, name: activeProfile ? activeProfile.name : null, avatar: activeProfile ? (activeProfile.avatar||null) : null, updated_at: new Date().toISOString() })
    });
  }catch(e){ /* best-effort */ }
}
async function resolveFriendCode(code){
  const cfg = loadSyncConfig();
  const cleaned = code.trim().replace(/^#/,'').toUpperCase();
  const res = await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/profile_codes?friend_code=eq.' + encodeURIComponent(cleaned) + '&select=sync_key,name', {
    headers:{ apikey:cfg.anonKey, Authorization:'Bearer '+cfg.anonKey }
  });
  if(!res.ok) return null;
  const rows = await res.json();
  return rows[0] || null;
}

function resizeImageToDataURL(file, callback){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const size = 160;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const minSide = Math.min(img.width, img.height);
      const sx = (img.width - minSide) / 2, sy = (img.height - minSide) / 2;
      ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function resizeImageToDataURLFit(file, maxDim, callback){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w >= h && w > maxDim){ h = Math.round(h*(maxDim/w)); w = maxDim; }
      else if(h > w && h > maxDim){ w = Math.round(w*(maxDim/h)); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.8));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function hexToRgba(hex, alpha){
  const h = (hex||'').replace('#','');
  if(h.length!==6) return 'rgba(179,157,219,'+alpha+')';
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}
function hexToRgbChannels(hex){
  const h = (hex||'').replace('#','');
  if(h.length!==6) return '179,157,219';
  return parseInt(h.slice(0,2),16) + ',' + parseInt(h.slice(2,4),16) + ',' + parseInt(h.slice(4,6),16);
}

}

function normalizeData(){
  if(!Array.isArray(data.exercises)) data.exercises = [];
  if(!Array.isArray(data.sessions)) data.sessions = [];
  data.exercises.forEach(e=>{
    if(!ALL_GROUPS.includes(e.muscleGroup)) e.muscleGroup = MUSCLE_GROUPS[0];
    if(!EFFORT_TYPES.some(t=>t.key===e.type)) e.type = 'Volume';
    if(e.archived===undefined) e.archived = false;
  });
  data.sessions.forEach(s=>{
    if(!s.entries) s.entries = {};
    if(!s.done) s.done = {};
    if(!Array.isArray(s.activeExercises)){
      const ids = new Set([...Object.keys(s.entries||{}), ...Object.keys(s.done||{})]);
      s.activeExercises = [...ids];
    }
    if(!s.supersets || typeof s.supersets !== 'object') s.supersets = {};
  });
  if(!data.profile) data.profile = { heightCm:null, weightLog:[] };
  if(data.profile.age===undefined) data.profile.age = null;
  if(data.profile.sex===undefined) data.profile.sex = null;
  if(data.profile.activityLevel===undefined) data.profile.activityLevel = null;
  if(data.profile.goal===undefined) data.profile.goal = null;
  if(!Array.isArray(data.profile.weightLog)) data.profile.weightLog = [];
  if(!Array.isArray(data.profile.measurements)) data.profile.measurements = [];
  if(!Array.isArray(data.profile.foodEntries)) data.profile.foodEntries = [];
  if(!Array.isArray(data.profile.customFoods)) data.profile.customFoods = [];
  if(!Array.isArray(data.profile.progressPhotos)) data.profile.progressPhotos = [];
  if(!Array.isArray(data.profile.progressPhotos)) data.profile.progressPhotos = [];
  if(!Array.isArray(data.templates)) data.templates = [];
  if(!Array.isArray(data.unlockedAchievements)) data.unlockedAchievements = [];
  if(!Array.isArray(data.challengeWins)) data.challengeWins = [];
}

function allSetsForExercise(exoId, excludeSessionId){
  const out = [];
  for(const s of data.sessions){
    if(s.id===excludeSessionId) continue;
    const sets = s.entries[exoId];
    if(sets) sets.forEach(st=>out.push(Object.assign({}, st, {date:s.date})));
  }
  return out;
}
function bestWeight(exoId, excludeSessionId){
  const sets = allSetsForExercise(exoId, excludeSessionId);
  if(!sets.length) return null;
  return sets.reduce((m,s)=> s.weight>m ? s.weight : m, 0);
}
function lastPerformance(exoId, excludeSessionId){
  const sets = allSetsForExercise(exoId, excludeSessionId);
  if(!sets.length) return null;
  sets.sort((a,b)=> a.date < b.date ? 1 : -1);
  const lastDate = sets[0].date;
  return sets.filter(s=>s.date===lastDate);
}

function daysSinceLastSession(){
  const dates = data.sessions.filter(s=>Object.keys(s.entries).length>0).map(s=>s.date);
  if(!dates.length) return null;
  const latest = dates.slice().sort().slice(-1)[0];
  const dt = new Date(latest+"T12:00:00");
  const today = new Date(); today.setHours(12,0,0,0);
  return Math.floor((today-dt)/86400000);
}

function colorizeUppercase(name){
  let html = '';

  let inUpper = false;
  for(const ch of name){
    const isUpper = ch !== ch.toLowerCase() && ch === ch.toUpperCase();
    if(isUpper !== inUpper){
      if(buffer) html += inUpper ? '<span class="logo-accent">'+escapeHtml(buffer)+'</span>' : escapeHtml(buffer);
      buffer = '';
      inUpper = isUpper;
    }
    buffer += ch;
  }
  if(buffer) html += inUpper ? '<span class="logo-accent">'+escapeHtml(buffer)+'</span>' : escapeHtml(buffer);
  return html;
}

const ACTIVITY_XP_RULES = {
  sedentaire: { tolerance:5, rate:3 },
  leger:      { tolerance:3, rate:5 },
  modere:     { tolerance:2, rate:6 },
  actif:      { tolerance:1, rate:7 },
  tresactif:  { tolerance:1, rate:8 }
};
function computeRankXP(){
  const sessionCount = data.sessions.filter(s=>Object.keys(s.entries).length>0).length;
  let totalVolume = 0;
  data.sessions.forEach(s=>{
    for(const exoId in s.entries) s.entries[exoId].forEach(st=> totalVolume += setVolume(exoId, st));
  });
  const winBonus = (data.challengeWins||[]).length * 100;
  const rawXP = Math.round(sessionCount*15 + totalVolume/100 + winBonus);
  const days = daysSinceLastSession();
  const rules = ACTIVITY_XP_RULES[data.profile.activityLevel] || { tolerance:2, rate:6 };
  let penalty = 0;
  if(days!==null && days > rules.tolerance) penalty = (days - rules.tolerance) * rules.rate;
  return { xp: Math.max(0, rawXP - penalty), rawXP, penalty, days, winBonus };
}

function renderRankBadge(){
  const el = document.getElementById('rankBadge');
  if(!el) return;
  const { xp, penalty, days, winBonus } = computeRankXP();
  let current = RANK_TIERS[0], next = RANK_TIERS[1];
  for(let i=0;i<RANK_TIERS.length;i++){
    if(xp >= RANK_TIERS[i].min){ current = RANK_TIERS[i]; next = RANK_TIERS[i+1] || null; }
  }
  let title = "XP : " + xp;
  if(next) title += " (encore " + (next.min - xp) + " pour " + next.name + ")";
  if(winBonus>0) title += " · dont " + winBonus + " XP de défis hebdo remportés (" + (data.challengeWins||[]).length + ")";
  if(penalty>0) title += " — inactif depuis " + days + "j, -" + penalty + " XP";
  el.title = title;
  el.innerHTML = '<span class="rank-gem" style="background:' + current.color + '"></span>' + current.name
    + (penalty>0 ? '<span style="color:var(--text-faint); margin-left:2px;">⚠</span>' : '');
  const currentIdx = RANK_TIERS.indexOf(current);
  if(lastKnownRank!==null && lastKnownRank!==current.name && currentIdx > lastKnownRankIdx){
    el.classList.remove('levelup');
    void el.offsetWidth;
    el.classList.add('levelup');
    playRankUpCelebration(current.name, current.color);
  }
  lastKnownRank = current.name;
  lastKnownRankIdx = currentIdx;
}

function formatTime(s){

}

function tickTimer(){
  timerSeconds--;
  if(timerSeconds<=0){
    clearInterval(timerInterval); timerInterval=null; timerRunning=false; timerSeconds=0;
    updateTimerUI();
    playBeep();
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    showToast("⏱️ Repos terminé !");
    return;
  }
  updateTimerUI();
}
function startTimer(sec){

  timerSeconds = sec; timerTotal = sec; timerRunning = true;
  updateTimerUI();
  timerInterval = setInterval(tickTimer, 1000);
}
function toggleTimer(){
  if(timerRunning){
    clearInterval(timerInterval); timerInterval=null; timerRunning=false; updateTimerUI();
  } else {
    if(timerSeconds<=0) return;
    timerRunning = true; updateTimerUI();
    timerInterval = setInterval(tickTimer, 1000);
  }
}
function resetTimer(){
  clearInterval(timerInterval); timerInterval=null; timerRunning=false; timerSeconds=0; timerTotal=0;
  updateTimerUI();
}
function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.35);
    o.start();
    o.stop(ctx.currentTime+0.35);
  }catch(e){}
}

function sessionMuscleGroups(session){

  const exoIds = new Set([...Object.keys(session.entries||{}).filter(id=>session.entries[id] && session.entries[id].length), ...Object.keys(session.done||{}).filter(id=>session.done[id])]);
  exoIds.forEach(exoId=>{
    const exo = data.exercises.find(e=>e.id===exoId);
    if(exo && !groups.includes(exo.muscleGroup)) groups.push(exo.muscleGroup);
  });
  return groups;
}

function getOneYearAgoInsight(){
  const today = new Date(); today.setHours(12,0,0,0);
  const oneYearAgo = new Date(today); oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);
  let best = null, bestDiff = Infinity;
  data.sessions.forEach(s=>{
    if(!Object.keys(s.entries).length) return;
    const sDate = new Date(s.date+"T12:00:00");
    const diff = Math.abs(sDate - oneYearAgo) / 86400000;
    if(diff <= 3 && diff < bestDiff){ bestDiff = diff; best = s; }
  });
  if(!best) return null;
  let topExo = null, topWeight = -1;
  for(const exoId in best.entries){
    best.entries[exoId].forEach(st=>{
      if(st.weight > topWeight){ topWeight = st.weight; topExo = exoId; }
    });
  }
  const exo = data.exercises.find(e=>e.id===topExo);
  const groups = sessionMuscleGroups(best);
  const label = best.customName || (groups.length ? ('Séance ' + groups.join(', ')) : 'Séance');
  let msg = '📆 Il y a un an (' + fmtDate(best.date) + '), tu faisais : <b>' + escapeHtml(label) + '</b>.';
  if(exo) msg += ' Le plus lourd ce jour-là : ' + escapeHtml(exo.name) + ' à ' + topWeight + ' kg.';
  return msg;
}

function daySummaryHtml(session){

           : '<div style="margin-top:10px; font-size:11px; color:var(--text-faint);">Renseigne ton poids (onglet Nutrition) pour estimer les calories brûlées.</div>')

  customConfirm('Démarrer "' + t.name + '" ? Ça ajoute ' + t.exercises.length + ' exercice(s) planifié(s) à la séance d\u2019aujourd\u2019hui (modifiables ensuite).', ()=>{

function startTemplate(t){
  const session = getOrCreateTodaySession();
  let addedCount = 0;
  t.exercises.forEach(te=>{
    const exo = data.exercises.find(e=>e.id===te.exoId);
    if(!exo) return;
    if(!session.activeExercises.includes(exo.id)) session.activeExercises.push(exo.id);
    if(!session.entries[exo.id]) session.entries[exo.id] = [];
    if(isCardioExo(exo)){
      const set = { weight:0, reps:0, ts:Date.now() };
      cardioFieldsFor(exo).forEach(f=> set[f] = te[f]||0);
      session.entries[exo.id].push(set);
    } else {
      for(let i=0;i<te.sets;i++){
        session.entries[exo.id].push({ weight: te.weight||0, reps: te.reps||0, ts: Date.now()+i });
      }
    }
    addedCount++;
  });
  saveData();
  renderSeance();
  renderStats();
  if(addedCount < t.exercises.length){
    showToast(t.name + " démarrée (" + (t.exercises.length-addedCount) + " exo(s) manquant(s), supprimés depuis)");
  } else {
    showToast(t.name + " démarrée — ajuste les poids/reps réels si besoin");
  }
}

let templateDraftRows = [];

function openTemplateBuilderModal(templateId){
  if(data.exercises.length===0){ showToast("Ajoute d'abord des exercices à ta liste"); return; }
  editingTemplateId = templateId || null;
  templateDraftRowSeq = 0;
  const existing = editingTemplateId ? (data.templates||[]).find(t=>t.id===editingTemplateId) : null;
  if(existing){
    document.getElementById('templateNameInput').value = existing.name;
    templateDraftRows = existing.exercises
      .filter(te => data.exercises.some(e=>e.id===te.exoId))
      .map(te => Object.assign({ rowId:'row_'+(templateDraftRowSeq++), exoId:te.exoId, sets:te.sets, reps:te.reps, weight:te.weight }, te));
    document.getElementById('templateBuilderTitle').textContent = 'Modifier le modèle';
  } else {
    document.getElementById('templateNameInput').value = '';
    templateDraftRows = [];
    document.getElementById('templateBuilderTitle').textContent = 'Nouveau modèle';
  }
  document.getElementById('templateBuilderModalBg').classList.add('open');
  renderTemplateDraftRows();

function createTemplateFromSession(sessionId){
  const session = data.sessions.find(s=>s.id===sessionId);
  if(!session) return;
  const exercises = [];
  Object.keys(session.entries).forEach(exoId=>{
    const exo = data.exercises.find(e=>e.id===exoId);
    if(!exo || exo.archived) return;
    const sets = session.entries[exoId];
    if(!sets.length) return;
    const last = sets[sets.length-1];
    if(isCardioExo(exo)){
      const row = { exoId };
      cardioFieldsFor(exo).forEach(f=> row[f] = last[f]||0);
      exercises.push(row);
    } else {
      exercises.push({ exoId, sets: sets.length, reps: last.reps||10, weight: last.weight||0 });
    }
  });
  if(!exercises.length){ showToast("Cette séance n'a pas d'exercice à reprendre"); return; }
  const newId = 'tpl_'+Date.now();
  const label = session.customName || fmtDate(session.date);
  data.templates = data.templates || [];
  data.templates.push({ id:newId, name:'Modèle — ' + label, exercises });
  saveData();
  openTemplateBuilderModal(newId);
  showToast("Modèle créé — modifie-le si besoin puis enregistre");
}

  editingTemplateId = null;
  document.getElementById('templateBuilderModalBg').classList.remove('open');
}

let multiSelectChecked = new Set();
function openMultiSelectExoModal(){
  syncTemplateDraftFromDOM();
  multiSelectChecked = new Set();
  document.getElementById('multiSelectSearchInput').value = '';
  document.getElementById('multiSelectExoModalBg').classList.add('open');

function closeMultiSelectExoModal(){
  document.getElementById('multiSelectExoModalBg').classList.remove('open');
}
function renderMultiSelectExoList(){
  const el = document.getElementById('multiSelectExoList');
  const q = normalizeStr(document.getElementById('multiSelectSearchInput').value || '');
  const already = new Set(templateDraftRows.map(r=>r.exoId));

  // Combine the user's personal exercises with the full catalog, de-duplicated by name
  const combined = [];
  const seenNames = new Set();
  data.exercises.filter(e=>!e.archived).forEach(e=>{
    combined.push({ key:'own_'+e.id, name:e.name, group:e.muscleGroup, type:e.type, existingId:e.id });
    seenNames.add(normalizeStr(e.name));
  });
  EXERCISE_LIBRARY.forEach((ex,idx)=>{
    if(seenNames.has(normalizeStr(ex.name))) return;
    combined.push({ key:'cat_'+idx, name:ex.name, group:ex.group, type:ex.type, catalogIdx:idx });
    seenNames.add(normalizeStr(ex.name));
  });

  const list = combined.filter(e=> !q || normalizeStr(e.name).includes(q));
  if(!list.length){
    el.innerHTML = '<div style="color:var(--text-faint); font-size:13px; padding:8px 0;">Aucun résultat</div>';
    return;
  }
  const byGroup = {};
  list.forEach(e=>{ (byGroup[e.group] = byGroup[e.group] || []).push(e); });
  let html = '<div style="font-size:11px; color:var(--text-faint); margin-bottom:8px;">' + list.length + ' exercice(s)</div>';
  ALL_GROUPS.forEach(group=>{
    const items = byGroup[group];
    if(!items || !items.length) return;
    html += '<div style="font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.03em; margin:10px 0 4px;">' + escapeHtml(group) + '</div>';
    items.forEach(e=>{
      const inTemplate = e.existingId && already.has(e.existingId);
      const checked = multiSelectChecked.has(e.key);
      html += '<label style="display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border); ' + (inTemplate ? 'opacity:0.45;' : 'cursor:pointer;') + '">'
        + '<input type="checkbox" ' + (checked?'checked':'') + (inTemplate?' disabled':'') + ' onchange="toggleMultiSelectExo(\'' + e.key + '\', this.checked)" style="width:18px; height:18px; flex-shrink:0;">'
        + '<span style="font-size:14px;">' + escapeHtml(e.name) + (inTemplate ? ' <span style="color:var(--text-faint); font-size:11px;">(déjà dans le modèle)</span>' : '') + '</span>'
        + '</label>';
    });
  });
  el.innerHTML = html;
}
function toggleMultiSelectExo(key, checked){
  if(checked) multiSelectChecked.add(key);
  else multiSelectChecked.delete(key);
}
function confirmMultiSelectExo(){
  if(multiSelectChecked.size===0){ showToast("Sélectionne au moins un exercice"); return; }
  let added = 0;
  multiSelectChecked.forEach(key=>{
    let exoId;
    if(key.startsWith('own_')){
      exoId = key.slice(4);
    } else {
      const idx = parseInt(key.slice(4));
      const ex = EXERCISE_LIBRARY[idx];
      if(!ex) return;
      let existing = data.exercises.find(e => normalizeStr(e.name) === normalizeStr(ex.name));
      if(!existing){
        existing = {id:'exo_'+Date.now()+'_'+idx, name:ex.name, muscleGroup:ex.group, type:ex.type};
        data.exercises.push(existing);
      }
      exoId = existing.id;
    }
    if(templateDraftRows.some(r=>r.exoId===exoId)) return;
    templateDraftRows.push({ rowId:'row_'+(templateDraftRowSeq++), exoId, sets:3, reps:10, weight:'' });
    added++;
  });
  saveData();
  closeMultiSelectExoModal();
  renderTemplateDraftRows();
  showToast(added + " exercice(s) ajouté(s)");
}
function removeTemplateDraftRow(rowId){
  syncTemplateDraftFromDOM();
  templateDraftRows = templateDraftRows.filter(r=>r.rowId!==rowId);
  renderTemplateDraftRows();
}
function syncTemplateDraftFromDOM(){
  templateDraftRows.forEach(r=>{
    const exoSel = document.getElementById('tplExo_'+r.rowId);
    if(exoSel) r.exoId = exoSel.value;
    const exo = data.exercises.find(e=>e.id===r.exoId);
    if(isCardioExo(exo)){
      cardioFieldsFor(exo).forEach(f=>{
        const inp = document.getElementById('tplCardio_'+f+'_'+r.rowId);
        if(inp) r[f] = f==='duration' ? (parseInt(inp.value)||0) : (parseFloat(inp.value)||0);
      });
    } else {
      const setsInp = document.getElementById('tplSets_'+r.rowId);
      const repsInp = document.getElementById('tplReps_'+r.rowId);
      const wInp = document.getElementById('tplWeight_'+r.rowId);
      if(setsInp) r.sets = parseInt(setsInp.value)||1;
      if(repsInp) r.reps = parseInt(repsInp.value)||1;
      if(wInp) r.weight = parseFloat(wInp.value)||0;
    }
  });
}
function renderTemplateDraftRows(){
  const el = document.getElementById('templateDraftRows');
  if(templateDraftRows.length===0){
    el.innerHTML = '<div style="color:var(--text-faint); font-size:13px; padding:8px 0;">Aucun exercice ajouté</div>';
    return;
  }
  const inputStyle = 'flex:1; background:var(--surface-3); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:8px; font-size:13px; min-width:0;';
  el.innerHTML = templateDraftRows.map(r=>{
    const exo = data.exercises.find(e=>e.id===r.exoId);
    const cardio = isCardioExo(exo);
    let fieldsHtml;
    if(cardio){
      fieldsHtml = cardioFieldsFor(exo).map(f=>{
        const ph = { speed:'km/h', incline:'% incl.', duration:'min' }[f];
        const val = r[f]!=null ? r[f] : '';
        return '<input type="number" id="tplCardio_' + f + '_' + r.rowId + '" value="' + val + '" placeholder="' + ph + '" step="' + (f==='duration'?'1':'0.5') + '" style="' + inputStyle + '">';
      }).join('');
    } else {
      fieldsHtml = '<input type="number" id="tplSets_' + r.rowId + '" value="' + r.sets + '" placeholder="séries" style="' + inputStyle + '">'
        + '<input type="number" id="tplReps_' + r.rowId + '" value="' + r.reps + '" placeholder="reps" style="' + inputStyle + '">'
        + '<input type="number" id="tplWeight_' + r.rowId + '" value="' + (r.weight||'') + '" placeholder="kg" step="0.5" style="' + inputStyle + '">';
    }
    return '<div style="border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:8px;">'
      + '<div style="display:flex; gap:6px; align-items:center;">'
      + '<select id="tplExo_' + r.rowId + '" style="' + inputStyle + '" onchange="onTemplateRowExoChange(\'' + r.rowId + '\')">'
      + data.exercises.map(e=>'<option value="' + e.id + '"' + (e.id===r.exoId?' selected':'') + '>' + escapeHtml(e.name) + '</option>').join('')
      + '</select>'
      + '<button class="del-btn" onclick="removeTemplateDraftRow(\'' + r.rowId + '\')">✕</button>'
      + '</div>'
      + '<div style="display:flex; gap:6px; margin-top:8px;">' + fieldsHtml + '</div></div>';
  }).join('');
}
function onTemplateRowExoChange(rowId){
  syncTemplateDraftFromDOM();
  const row = templateDraftRows.find(r=>r.rowId===rowId);
  const sel = document.getElementById('tplExo_'+rowId);
  if(row && sel) row.exoId = sel.value;
  renderTemplateDraftRows();
}
function saveTemplate(){
  syncTemplateDraftFromDOM();
  const name = document.getElementById('templateNameInput').value.trim();
  if(!name){ showToast("Donne un nom à ce modèle"); return; }
  if(templateDraftRows.length===0){ showToast("Ajoute au moins un exercice"); return; }
  const exercises = templateDraftRows.map(r=>{
    const exo = data.exercises.find(e=>e.id===r.exoId);
    if(isCardioExo(exo)){
      const row = { exoId:r.exoId };
      cardioFieldsFor(exo).forEach(f=> row[f] = r[f]||0);
      return row;
    }
    return {exoId:r.exoId, sets:r.sets, reps:r.reps, weight:r.weight};
  });
  if(editingTemplateId){
    const existing = data.templates.find(t=>t.id===editingTemplateId);
    if(existing){ existing.name = name; existing.exercises = exercises; }
    editingTemplateId = null;
  } else {
    data.templates.push({ id:'tpl_'+Date.now(), name:name, exercises: exercises });
  }
  saveData();
  closeTemplateBuilderModal();
  renderSeance();
  showToast("Modèle enregistré");
}

function removeFromTodaySession(sessionId, exoId){
  const session = data.sessions.find(s=>s.id===sessionId);
  if(!session) return;
  const hasSets = session.entries[exoId] && session.entries[exoId].length > 0;
  const doRemove = ()=>{
    session.activeExercises = (session.activeExercises||[]).filter(id=>id!==exoId);
    delete session.entries[exoId];
    if(session.done) delete session.done[exoId];
    if(session.supersets){
      for(const gid in session.supersets){
        session.supersets[gid] = session.supersets[gid].filter(id=>id!==exoId);
        if(session.supersets[gid].length < 2) delete session.supersets[gid];
      }
    }
    if(editingSet && editingSet.sessionId===sessionId && editingSet.exoId===exoId) editingSet = null;
    if(expandedExo===exoId) expandedExo = null;
    saveData();
    renderSeance();
    showToast("Exercice retiré de la séance");
  };
  if(hasSets){
    customConfirm("Retirer cet exercice de la séance ? Les séries déjà loggées aujourd'hui pour cet exercice seront supprimées.", doRemove);
  } else {
    doRemove();
  }
}

function finishSession(){
  const session = getOrCreateTodaySession();
  if((session.activeExercises||[]).length===0){ showToast("Ajoute au moins un exercice avant de terminer"); return; }
  const groups = sessionMuscleGroups(session);
  const suggested = groups.length ? ('Séance ' + groups.join(', ')) : 'Séance';
  const name = window.prompt("Nom de cette séance :", session.customName || suggested);
  session.customName = (name && name.trim()) ? name.trim() : suggested;
  session.activeExercises = [];
  expandedExo = null;
  editingSet = null;
  saveData();
  renderSeance();
  renderHisto();
  renderStats();
  showToast("Séance enregistrée 💪");
  playFinishCelebration();
}
function playFinishCelebration(){
  const overlay = document.createElement('div');
  overlay.className = 'finish-celebration';
  overlay.innerHTML = '<div class="finish-check"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#141517" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>';
  document.body.appendChild(overlay);
  const colors = ['var(--accent)','var(--gold)','var(--green)','#c77b6b'];
  for(let i=0;i<16;i++){
    const bit = document.createElement('span');
    bit.className = 'confetti-bit';
    bit.style.background = colors[i%colors.length];
    const angle = (Math.PI*2*i)/16;
    const dist = 70 + Math.random()*30;
    bit.style.setProperty('--dx', Math.cos(angle)*dist+'px');
    bit.style.setProperty('--dy', Math.sin(angle)*dist+'px');
    overlay.appendChild(bit);
  }
  requestAnimationFrame(()=>{
    overlay.querySelector('.finish-check').classList.add('play');
    overlay.querySelectorAll('.confetti-bit').forEach(b=>b.classList.add('play'));
  });
  setTimeout(()=>overlay.remove(), 1300);
}

let exoDragInfo = null;
function startExoDrag(e, exoId){
  e.preventDefault();
  e.stopPropagation();
  const card = document.querySelector('.exo-card[data-exo-id="'+exoId+'"]');
  if(!card) return;
  const container = card.parentElement;
  const cards = [...container.querySelectorAll('.exo-card')];
  exoDragInfo = {
    exoId, card,
    startY: e.clientY,
    currentDy: 0,
    order: cards.map(c=>c.dataset.exoId),
    rects: cards.map(c=>({ id:c.dataset.exoId, top:c.offsetTop, height:c.offsetHeight }))
  };
  card.classList.add('dragging');
  document.addEventListener('pointermove', onExoDragMove);
  document.addEventListener('pointerup', onExoDragEnd);
}
function onExoDragMove(e){
  if(!exoDragInfo) return;
  exoDragInfo.currentDy = e.clientY - exoDragInfo.startY;
  exoDragInfo.card.style.transform = 'translateY(' + exoDragInfo.currentDy + 'px)';
}
// Pure, independently-testable: given the original rects, the dragged id, and the vertical
// offset released at, returns the new ordering of ids.
function computeReorderedIds(rects, draggedId, dy){
  const draggedRect = rects.find(r=>r.id===draggedId);
  if(!draggedRect) return rects.map(r=>r.id);
  const draggedMid = draggedRect.top + draggedRect.height/2 + dy;
  const others = rects.filter(r=>r.id!==draggedId);
  let insertIdx = others.length;
  for(let i=0;i<others.length;i++){
    const mid = others[i].top + others[i].height/2;
    if(draggedMid < mid){ insertIdx = i; break; }
  }
  const newOrder = others.map(r=>r.id);
  newOrder.splice(insertIdx, 0, draggedId);
  return newOrder;
}
function onExoDragEnd(){
  if(!exoDragInfo) return;
  const info = exoDragInfo;
  document.removeEventListener('pointermove', onExoDragMove);
  document.removeEventListener('pointerup', onExoDragEnd);
  info.card.classList.remove('dragging');
  info.card.style.transform = '';
  exoDragInfo = null;

  const newOrder = computeReorderedIds(info.rects, info.exoId, info.currentDy);
  const session = getOrCreateTodaySession();
  session.activeExercises = newOrder;
  saveData();
  renderSeance();
}
function moveExercise(exoId, direction){
  const session = getOrCreateTodaySession();
  const arr = session.activeExercises;
  const idx = arr.indexOf(exoId);
  const newIdx = idx + direction;
  if(idx===-1 || newIdx<0 || newIdx>=arr.length) return;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
  saveData();
  renderSeance();
}

function fillLastPerformance(exoId){
  const session = getOrCreateTodaySession();
  const last = lastPerformance(exoId, session.id);
  if(!last || !last.length) return;
  const exo = data.exercises.find(e=>e.id===exoId);
  if(isCardioExo(exo)){
    const fields = cardioFieldsFor(exo);
    let firstEl = null;
    fields.forEach(f=>{
      const el = document.getElementById('cardio_' + f + '_' + exoId);
      if(el){ el.value = last[0][f]; if(!firstEl) firstEl = el; }
    });
    if(firstEl) firstEl.focus();
  } else {
    const w = document.getElementById('w_'+exoId);
    const r = document.getElementById('r_'+exoId);
    if(w) w.value = last[0].weight;
    if(r) r.value = last[0].reps;
    if(w) w.focus();
  }
}

const AVAILABLE_PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
function renderPlateResult(){
  const target = parseFloat(document.getElementById('plateTargetInput').value);
  const bar = parseFloat(document.getElementById('plateBarInput').value) || 0;
  const el = document.getElementById('plateResult');
  if(isNaN(target) || target<=0){ el.innerHTML = ''; return; }
  if(target < bar){ el.innerHTML = '<div class="insight">Le poids visé est inférieur à la barre seule.</div>'; return; }
  let perSide = (target - bar) / 2;
  if(perSide < 0){ el.innerHTML = '<div class="insight">Poids invalide.</div>'; return; }
  const used = [];
  let remaining = perSide;
  AVAILABLE_PLATES.forEach(p=>{
    while(remaining + 1e-6 >= p){ used.push(p); remaining -= p; }
  });
  const achieved = bar + used.reduce((a,b)=>a+b,0)*2;
  let html = '<div class="stat-row"><div class="stat-box"><div class="v">' + achieved + ' kg</div><div class="l">poids réel obtenu</div></div></div>';
  if(used.length===0){
    html += '<div class="insight">Barre seule, aucune plaque à ajouter.</div>';
  } else {
    html += '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;">' + used.map(p=>'<span class="tag" style="background:var(--surface-3); color:var(--text); font-size:12px; padding:5px 10px;">' + p + ' kg</span>').join('') + '</div>';
    html += '<div style="font-size:11px; color:var(--text-faint); margin-top:8px;">Par côté, de la plus grosse à la plus petite. ' + (Math.abs(remaining)>0.01 ? 'Reste ' + remaining.toFixed(2) + ' kg impossible à charger avec ce jeu de plaques.' : '') + '</div>';
  }
  el.innerHTML = html;
}
function render1RMResult(){
  const w = parseFloat(document.getElementById('rmWeightInput').value);
  const r = parseInt(document.getElementById('rmRepsInput').value);
  const el = document.getElementById('rmResult');
  if(isNaN(w) || isNaN(r) || w<=0 || r<=0){ el.innerHTML = ''; return; }
  if(r===1){ el.innerHTML = '<div class="stat-row"><div class="stat-box"><div class="v">' + w + ' kg</div><div class="l">1RM (déjà à 1 rep)</div></div></div>'; return; }
  const epley = w * (1 + r/30);
  const brzycki = w * (36 / (37 - r));
  const avg = Math.round((epley+brzycki)/2 * 2)/2;
  el.innerHTML = '<div class="stat-row">'
    + '<div class="stat-box"><div class="v">' + avg + ' kg</div><div class="l">estimation moyenne</div></div>'
    + '</div><div class="insight">Epley : ' + Math.round(epley*2)/2 + ' kg · Brzycki : ' + Math.round(brzycki*2)/2 + ' kg. Ces formules perdent en précision au-delà de 10-12 reps.</div>';
}

let editingSet = null;
let animatedInExoIds = new Set();
let lastKnownRank = null, lastKnownRankIdx = -1;
let justToggledDoneExoId = null;

function editSet(sessionId, exoId, idx){
  const session = data.sessions.find(s=>s.id===sessionId);
  const s = session.entries[exoId][idx];
  const exo = data.exercises.find(e=>e.id===exoId);
  editingSet = { sessionId, exoId, idx, weight:s.weight, reps:s.reps, speed:s.speed, incline:s.incline, duration:s.duration };
  expandedExo = exoId;
  renderSeance();
  const focusId = isCardioExo(exo) ? 'cardio_' + cardioFieldsFor(exo)[0] + '_' + exoId : 'w_'+exoId;
  setTimeout(()=>{ const inp = document.getElementById(focusId); if(inp) inp.focus(); }, 50);
}
function cancelEditSet(){
  editingSet = null;
  renderSeance();
}
function addSet(sessionId, exoId){
  const exo = data.exercises.find(e=>e.id===exoId);
  const session = data.sessions.find(s=>s.id===sessionId);
  if(isCardioExo(exo)){
    const fields = cardioFieldsFor(exo);
    const values = {};
    let valid = true;
    fields.forEach(f=>{
      const el = document.getElementById('cardio_' + f + '_' + exoId);
      const v = f==='duration' ? parseInt(el ? el.value : NaN) : parseFloat(el ? el.value : NaN);
      if(isNaN(v) || v<0) valid = false;
      values[f] = v;
    });
    if(!valid){ showToast("Entre des valeurs valides pour " + fields.join(', ')); return; }
    if(editingSet && editingSet.sessionId===sessionId && editingSet.exoId===exoId){
      Object.assign(session.entries[exoId][editingSet.idx], values);
      editingSet = null;
      saveData();
      renderSeance();
      showToast("Série modifiée");
      return;
    }
    if(!session.entries[exoId]) session.entries[exoId]=[];
    session.entries[exoId].push(Object.assign({weight:0, reps:0, ts:Date.now()}, values));
    saveData();
    renderSeance();
    return;
  }
  const w = parseFloat(document.getElementById('w_'+exoId).value);
  const r = parseInt(document.getElementById('r_'+exoId).value);
  if(isNaN(w) || isNaN(r) || w<0 || r<0){ showToast("Entre un poids et des reps valides"); return; }
  if(editingSet && editingSet.sessionId===sessionId && editingSet.exoId===exoId){
    session.entries[exoId][editingSet.idx].weight = w;
    session.entries[exoId][editingSet.idx].reps = r;
    editingSet = null;
    saveData();
    renderSeance();
    showToast("Série modifiée");
    return;
  }
  if(!session.entries[exoId]) session.entries[exoId]=[];
  const prevBest = bestWeight(exoId, sessionId);
  session.entries[exoId].push({weight:w, reps:r, ts:Date.now()});
  saveData();
  renderSeance();
  if(prevBest!==null && w>prevBest){
    const exo = data.exercises.find(x=>x.id===exoId);
    showPRSharePrompt(exo ? exo.name : 'Exercice', w, r);
    const allRows = document.querySelectorAll('.set-row[data-exo-id="' + exoId + '"]');
    if(allRows.length) allRows[allRows.length-1].classList.add('flash');
  }
}

function deleteSet(sessionId, exoId, idx){
  const row = document.querySelector('.set-row[data-exo-id="' + exoId + '"][data-set-idx="' + idx + '"]');
  const doDelete = () => {
    const session = data.sessions.find(s=>s.id===sessionId);
    session.entries[exoId].splice(idx,1);
    if(session.entries[exoId].length===0) delete session.entries[exoId];
    if(editingSet && editingSet.sessionId===sessionId && editingSet.exoId===exoId) editingSet = null;
    saveData();
    renderSeance();
  };
  if(row){
    row.classList.add('removing');
    setTimeout(doDelete, 240);
  } else {
    doDelete();
  }
}

function renderLibraryList(filterText){

function addFromLibrary(idx){
  const ex = EXERCISE_LIBRARY[idx];
  const session = getOrCreateTodaySession();
  let existing = data.exercises.find(e => normalizeStr(e.name) === normalizeStr(ex.name));
  if(!existing){
    existing = {id:'exo_'+Date.now(), name:ex.name, muscleGroup:ex.group, type:ex.type};
    data.exercises.push(existing);
  }
  if(session.activeExercises.includes(existing.id)){
    showToast("Déjà dans ta séance du jour");
    closeLibraryModal();
    return;
  }
  session.activeExercises.push(existing.id);
  saveData();
  closeLibraryModal();
  renderSeance();
  renderStats();
  showToast(ex.name + " ajouté à la séance");
}
function confirmAddExo(){
  const val = document.getElementById('newExoInput').value.trim();
  if(!val){ showToast("Entre un nom d'exercice"); return; }
  const group = document.getElementById('newExoGroup').value;
  const type = document.getElementById('newExoType').value;
  if(editingExoId){
    const exo = data.exercises.find(e=>e.id===editingExoId);
    exo.name = val; exo.muscleGroup = group; exo.type = type;
  } else {
    const newExo = {id:'exo_'+Date.now(), name:val, muscleGroup:group, type:type};
    data.exercises.push(newExo);
    const session = getOrCreateTodaySession();
    if(!session.activeExercises.includes(newExo.id)) session.activeExercises.push(newExo.id);

  closeModal();
  renderSeance();

function jumpToHistoryDate(iso){
