<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EthrNiity</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141517">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#141517;
    --surface:#1b1c1f;
    --surface-2:#222327;
    --surface-3:#2a2b2f;
    --text:#e2e0da;
    --text-dim:#8f8c86;
    --text-faint:#5a5854;
    --accent:#b39ddb;
    --accent-dim:#8874a8;
    --steel:#b39ddb;
    --gold:#e8d48a;
    --green:#8874a8;
    --terracotta:#e8d48a;
    --border:#2a2a28;
    --radius:10px;
  }
  body.light-theme{
    --bg:#f5f3ee;
    --surface:#ffffff;
    --surface-2:#f0eee8;
    --surface-3:#e7e4dc;
    --text:#292723;
    --text-dim:#6b675f;
    --text-faint:#9a958a;
    --accent:#8874a8;
    --accent-dim:#6f5d8c;
    --steel:#8874a8;
    --gold:#a8863a;
    --green:#6f5d8c;
    --terracotta:#a8863a;
    --border:#ded9cd;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding-bottom:84px;
  }
  .mono{font-family:"SF Mono","Consolas","Menlo",monospace; letter-spacing:0.02em;}
  h1,h2,h3{
    font-family:Impact,"Haettenschweiler","Arial Narrow Bold",sans-serif;
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:0.03em;
    margin:0;
  }
  h2.section-title{font-size:15px; color:var(--text-dim); margin-bottom:10px; letter-spacing:0.06em;}
  header.top{
    padding:22px 18px 16px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#1a1b1f 0%, var(--bg) 100%);
    position:sticky; top:0; z-index:20;
  }
  .header-row{display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:10px;}
  .logo-text{
    font-family:Optima, Candara, "Segoe UI", sans-serif;
    font-size:22px; font-weight:400; letter-spacing:0.04em; color:var(--text);
  }
  .logo-accent{color:var(--accent); font-weight:600;}
  .header-right{display:flex; align-items:center; gap:8px;}
  .rank-badge{
    display:flex; align-items:center; gap:6px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:20px; padding:5px 10px 5px 6px;
    font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em;
    cursor:default;
  }
  .rank-gem{width:10px; height:10px; border-radius:2px; transform:rotate(45deg); flex-shrink:0;}
  .profile-btn{
    width:32px; height:32px; border-radius:50%;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  }
  .profile-btn:active{background:var(--surface-3);}
  .subline{color:var(--text-dim); font-size:13px; margin-top:10px; font-family:"SF Mono",monospace;}
  main{max-width:720px; margin:0 auto; padding:16px;}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .exo-card{padding:0; overflow:hidden;}
  .exo-header{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; cursor:pointer;
    background:var(--surface);
  }
  .exo-header:active{background:var(--surface-2);}
  .exo-name-row{display:flex; align-items:center; gap:8px;}
  .exo-name{font-size:17px; font-weight:600;}
  .tag{
    font-size:10px; text-transform:uppercase; letter-spacing:0.04em;
    padding:2px 6px; border-radius:4px; font-weight:700;
  }
  .exo-hint{color:var(--text-faint); font-size:12px; font-family:"SF Mono",monospace; margin-top:4px;}
  .edit-btn{background:none; border:none; color:var(--text-faint); font-size:14px; cursor:pointer; padding:6px;}
  .exo-body{
    border-top:1px solid var(--border);
    padding:14px 16px;
    background:var(--surface-2);
    display:none;
  }
  .exo-body.open{display:block;}
  .set-row{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px 0; border-bottom:1px dashed var(--border);
    font-family:"SF Mono",monospace; font-size:14px;
  }
  .set-row:last-of-type{border-bottom:none;}
  .set-num{color:var(--text-faint); width:20px;}
  .pr-badge{
    background:var(--gold); color:#1a1500; font-size:10px; font-weight:700;
    padding:2px 6px; border-radius:4px; letter-spacing:0.05em;
    animation:pop 0.4s ease;
  }
  @keyframes pop{0%{transform:scale(0.5);opacity:0;}70%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
  @keyframes rowFlash{0%{background:rgba(232,212,138,0.3);}100%{background:transparent;}}
  .set-row.flash{animation:rowFlash 0.8s ease;}
  @keyframes rowOut{to{opacity:0; transform:translateX(-16px); max-height:0; padding-top:0; padding-bottom:0; margin-bottom:0;}}
  .set-row.removing{animation:rowOut 0.24s ease forwards; overflow:hidden;}
  .btn{position:relative; overflow:hidden;}
  .ripple-effect{position:absolute; border-radius:50%; background:rgba(255,255,255,0.35); transform:scale(0); pointer-events:none; animation:rippleAnim 0.55s ease-out;}
  @keyframes rippleAnim{to{transform:scale(3); opacity:0;}}
  @keyframes cardIn{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:translateY(0);}}
  .exo-card.card-in{animation:cardIn 0.35s cubic-bezier(0.2,0.7,0.3,1) backwards;}
  @keyframes rankGlow{
    0%{ box-shadow:0 0 0 0 rgba(232,212,138,0); }
    30%{ box-shadow:0 0 0 6px rgba(232,212,138,0.35); transform:scale(1.08); }
    100%{ box-shadow:0 0 0 0 rgba(232,212,138,0); transform:scale(1); }
  }
  .rank-badge.levelup{animation:rankGlow 1.1s ease;}
  @keyframes checkBounce{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}
  .done-btn.bounced{animation:checkBounce 0.4s cubic-bezier(0.34,1.56,0.64,1);}
  @keyframes badgeReveal{0%{transform:scale(0.6); opacity:0;}100%{transform:scale(1); opacity:1;}}
  .badge-item.badge-new{animation:badgeReveal 0.5s cubic-bezier(0.34,1.56,0.64,1);}
  .del-btn{margin-left:auto; background:none; border:none; color:var(--text-faint); font-size:16px; cursor:pointer; padding:4px 8px;}
  .del-btn:hover{color:var(--accent);}
  .add-set-form{display:flex; gap:8px; margin-top:12px;}
  .add-set-form input{
    flex:1; background:var(--surface-3); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:10px; font-size:15px;
    font-family:"SF Mono",monospace; min-width:0;
  }
  .add-set-form input:focus{outline:none; border-color:var(--accent);}
  .btn{
    background:var(--accent); color:#fff; border:none; border-radius:8px;
    padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer;
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .btn:active{background:var(--accent-dim);}
  .btn-secondary{background:var(--surface-3); color:var(--gold); border:1px solid rgba(232,212,138,0.28);}
  .btn-secondary:active{background:rgba(232,212,138,0.12);}
  .btn-ghost{background:none; border:1px dashed var(--text-faint); color:var(--text-dim); width:100%; padding:14px;}
  .empty{color:var(--text-faint); text-align:center; padding:30px 10px; font-size:14px;}
  @keyframes dumbbellRock{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}}
  .dumbbell-rock{display:inline-block; animation:dumbbellRock 1.8s ease-in-out infinite; transform-origin:center;}
  @keyframes emptyBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .empty-dumbbell{font-size:40px; margin-bottom:10px; animation:emptyBounce 2.2s ease-in-out infinite;}
  @keyframes timerPulse{0%,100%{opacity:1;}50%{opacity:0.55;}}
  .timer-pulsing{animation:timerPulse 1s ease-in-out infinite;}
  @keyframes flameFlicker{0%,100%{transform:scale(1) rotate(-2deg);}50%{transform:scale(1.15) rotate(2deg);}}
  .flame-flicker{display:inline-block; animation:flameFlicker 1.1s ease-in-out infinite;}
  .plate-spinner{animation:plateSpin 1.8s linear infinite;}
  @keyframes plateSpin{to{transform:rotate(360deg);}}
  .loading-row{display:flex; align-items:center; gap:10px; color:var(--text-dim); font-size:13px; padding:6px 0;}
  .record-top{position:relative; overflow:hidden;}
  .record-top .shine-sweep{position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(100deg, transparent, rgba(232,212,138,0.22), transparent); animation:shineSweep 1.3s ease 0.2s;}
  @keyframes shineSweep{to{left:130%;}}
  .history-timeline{position:relative; padding-left:16px;}
  .history-timeline::before{content:''; position:absolute; left:4px; top:8px; bottom:8px; width:2px; background:linear-gradient(var(--accent), var(--border));}
  .hist-session{position:relative;}
  .hist-session::before{content:''; position:absolute; left:-16px; top:5px; width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--bg);}
  .hist-session.hist-latest::before{animation:histDotPulse 1.8s ease-in-out infinite;}
  @keyframes histDotPulse{0%,100%{box-shadow:0 0 0 3px var(--bg);}50%{box-shadow:0 0 0 6px rgba(179,157,219,0.28), 0 0 0 3px var(--bg);}}
  .float-icon{display:inline-block; animation:floatY 2.6s ease-in-out infinite;}
  @keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .body-dot{animation:bodyDotPulse 1.8s ease-in-out infinite;}
  @keyframes bodyDotPulse{0%,100%{opacity:1;}50%{opacity:0.45;}}
  @keyframes heatGrow{from{transform:scale(0.3); opacity:0;}to{transform:scale(1); opacity:1;}}
  .heat-grow{animation:heatGrow 0.3s ease backwards;}
  @keyframes prRibbonGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(232,212,138,0));}50%{filter:drop-shadow(0 0 4px rgba(232,212,138,0.7));}}
  .hist-pr-ribbon{display:inline-block; animation:prRibbonGlow 1.6s ease-in-out infinite;}
  .hist-session.hist-pr{border-left-color:var(--gold);}
  .empty b{color:var(--text-dim); display:block; margin-bottom:4px; font-size:16px;}
  nav.tabs{
    position:fixed; bottom:0; left:0; right:0;
    background:var(--surface); border-top:1px solid var(--border);
    display:flex; z-index:30; overflow:hidden;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--text-faint);
    padding:12px 4px 10px; font-size:11px; text-transform:uppercase;
    letter-spacing:0.04em; cursor:pointer; font-weight:600;
  }
  nav.tabs button.active{color:var(--accent);}
  .tab-underline{position:absolute; top:0; left:0; height:2px; width:25%; background:var(--accent); transition:left 0.28s cubic-bezier(0.4,0,0.2,1);}
  .view{display:none;}
  .view.active{display:block;}
  .hist-session{padding-left:12px; margin-bottom:16px;}
  .hist-date{font-family:"SF Mono",monospace; color:var(--steel); font-size:13px; margin-bottom:6px;}
  .hist-exo{font-size:14px; margin-bottom:3px;}
  .hist-exo .n{color:var(--text-dim); font-weight:600;}
  .hist-exo .s{color:var(--text-faint); font-family:"SF Mono",monospace; font-size:13px;}
  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:40;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.25s ease;
  }
  .modal-bg.open{opacity:1; pointer-events:auto;}
  .modal{
    background:var(--surface-2); border-radius:14px 14px 0 0; padding:20px;
    width:100%; max-width:480px; border-top:1px solid var(--border);
    max-height:88vh; overflow-y:auto;
    transform:translateY(100%);
    transition:transform 0.32s cubic-bezier(0.2,0.8,0.3,1);
  }
  .modal-bg.open .modal{transform:translateY(0);}
  .modal label{display:block; font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; margin:12px 0 6px;}
  .modal input, .modal select{
    width:100%; background:var(--surface-3); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:12px; font-size:16px;
  }
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal-actions .btn{flex:1;}
  .toast{
    position:fixed; top:0; left:50%; transform:translate(-50%,-46px);
    background:var(--surface-3); color:var(--text); padding:10px 18px;
    border-radius:20px; font-size:13px; z-index:50; border:1px solid var(--border);
    opacity:0; transition:opacity 0.28s ease, transform 0.28s cubic-bezier(0.2,0.8,0.3,1); pointer-events:none;
  }
  .toast.show{opacity:1; transform:translate(-50%,16px);}
  select#progExoSelect{
    width:100%; background:var(--surface-3); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:10px; font-size:14px; margin-bottom:12px;
  }
  .chart-wrap{position:relative; height:220px;}
  .chart-wrap.tall{height:260px;}
  .stat-row{display:flex; gap:10px; margin-bottom:12px;}
  .stat-box{flex:1; background:var(--surface-3); border-radius:8px; padding:10px 12px; text-align:center;}
  .stat-box .v{font-family:"SF Mono",monospace; font-size:20px; color:var(--text); font-weight:700;}
  .stat-box .l{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.03em; margin-top:2px;}
  .heatmap{display:flex; gap:3px; overflow-x:auto; padding-bottom:4px;}
  .heat-col{display:flex; flex-direction:column; gap:3px;}
  .heat-cell{width:11px; height:11px; border-radius:2px; background:var(--surface-3);}
  .legend-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; justify-content:center;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim);}
  .legend-dot{width:9px; height:9px; border-radius:50%;}
  .insight{font-size:13px; color:var(--text-dim); background:var(--surface-3); border-radius:8px; padding:10px 12px; margin-top:12px; line-height:1.5;}
  .profile-form{display:flex; gap:8px; align-items:flex-end;}
  .profile-form .field{flex:1;}
  .profile-form label{display:block; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:6px;}
  .profile-form input{
    width:100%; background:var(--surface-3); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:10px; font-size:15px; font-family:"SF Mono",monospace;
  }
  .weight-log-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:7px 0; border-bottom:1px dashed var(--border); font-size:13px;
    font-family:"SF Mono",monospace;
  }
  .weight-log-row:last-child{border-bottom:none;}
  .weight-log-row .d{color:var(--text-faint); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .weight-log-row .w{color:var(--text); font-weight:600; flex-shrink:0;}
  #librarySearchInput{
    width:100%; background:var(--surface-3); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:12px; font-size:16px;
  }
  .lib-group-title{
    font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em;
    margin:14px 0 4px; padding-left:2px;
  }
  .lib-item{
    display:flex; align-items:center; gap:10px; padding:10px 4px;
    border-bottom:1px dashed var(--border); cursor:pointer; background:none; border-left:none; border-right:none; border-top:none;
    width:100%; text-align:left;
  }
  .lib-item:active{background:var(--surface-3);}
  .lib-icon{flex-shrink:0; width:20px; height:20px;}
  .lib-name{flex:1; font-size:14px; color:var(--text);}
  .lib-empty{color:var(--text-faint); font-size:13px; text-align:center; padding:20px 0;}
  #app-root{display:none;}
  #profile-picker{
    display:none; position:fixed; inset:0; background:var(--bg); z-index:100;
    align-items:center; justify-content:center; padding:20px;
  }
  .picker-box{width:100%; max-width:360px;}
  .picker-box label{display:block; font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px;}
  .picker-box input{
    width:100%; background:var(--surface-3); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:12px; font-size:16px;
  }
  .picker-profile-row{display:flex; align-items:center; gap:6px; margin-bottom:8px;}
  .picker-profile-btn{
    flex:1; text-align:left; background:var(--surface); border:1px solid var(--border);
    color:var(--text); border-radius:10px; padding:14px 16px; font-size:15px; cursor:pointer;
  }
  .picker-profile-btn:active{background:var(--surface-2);}
  @media (min-width:700px){
    main{padding:24px;}
    .logo-text{font-size:26px;}
    nav.tabs{max-width:520px; left:50%; transform:translateX(-50%); border:1px solid var(--border); border-radius:14px; bottom:16px;}
  }
</style>
</head>
<body>

<div id="profile-picker"></div>

<div id="app-root">
<header class="top">
  <div class="header-row">
    <div class="brand">
      <span class="logo-text"><span class="logo-accent">E</span>thr<span class="logo-accent">N</span>iity</span>
    </div>
    <div class="header-right">
      <div class="rank-badge" id="rankBadge" onclick="openLeaderboardModal()" style="cursor:pointer;"></div>
      <button class="profile-btn" id="profileBtn" onclick="openProfileModal()" aria-label="Profil"></button>
    </div>
  </div>
  <div class="subline" id="todayLabel">—</div>
</header>

<main>
  <div id="view-seance" class="view active"></div>
  <div id="view-stats" class="view"></div>
  <div id="view-nutrition" class="view"></div>
  <div id="view-histo" class="view"></div>
</main>

<nav class="tabs">
  <button data-view="seance" class="active">Séance</button>
  <button data-view="stats">Stats</button>
  <button data-view="nutrition">Nutrition</button>
  <button data-view="histo">Historique</button>
  <div class="tab-underline" id="tabUnderline" style="left:0%;"></div>
</nav>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle" style="font-size:18px;">Nouvel exercice</h3>
    <label>Nom</label>
    <input type="text" id="newExoInput" placeholder="Ex : Développé couché" autocomplete="off">
    <label>Groupe musculaire</label>
    <select id="newExoGroup"></select>
    <label>Type d'effort</label>
    <select id="newExoType"></select>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn" onclick="confirmAddExo()">Enregistrer</button>
    </div>
    <button class="btn btn-secondary" id="deleteExoBtn" style="width:100%; margin-top:10px; display:none; color:var(--accent);" onclick="confirmDeleteExercise()">🗑 Supprimer définitivement de ma liste</button>
  </div>
</div>

<div class="modal-bg" id="libraryModalBg" onclick="if(event.target===this) closeLibraryModal()">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="font-size:18px;">Ajouter un exercice</h3>
      <button class="del-btn" style="font-size:20px;" onclick="closeLibraryModal()">✕</button>
    </div>
    <input type="text" id="librarySearchInput" placeholder="Rechercher un exercice..." autocomplete="off" style="margin-top:10px;">
    <div id="libraryResults" style="margin-top:10px;"></div>
    <button class="btn btn-secondary" style="width:100%; margin-top:8px;" onclick="closeLibraryModal(); openAddModal();">+ Créer un exercice personnalisé</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="profileModalBg" onclick="if(event.target===this) closeProfileModal()">
  <div class="modal" id="profileModalContent"></div>
</div>

<div class="modal-bg" id="leaderboardModalBg" onclick="if(event.target===this) closeLeaderboardModal()">
  <div class="modal" id="leaderboardModalContent"></div>
</div>

<div class="modal-bg" id="templateBuilderModalBg" onclick="if(event.target===this) closeTemplateBuilderModal()">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 id="templateBuilderTitle" style="font-size:18px;">Nouveau modèle</h3>
      <button class="del-btn" style="font-size:20px;" onclick="closeTemplateBuilderModal()">✕</button>
    </div>
    <label>Nom du modèle</label>
    <input type="text" id="templateNameInput" placeholder="Ex : Séance Push" autocomplete="off">
    <div id="templateDraftRows" style="margin-top:14px;"></div>
    <button class="btn btn-secondary" style="width:100%;" onclick="addTemplateDraftRow()">+ Ajouter un exercice</button>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeTemplateBuilderModal()">Annuler</button>

function resizeImageToDataURL(file, callback){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const size = 160;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const minSide = Math.min(img.width, img.height);
      const sx = (img.width - minSide) / 2, sy = (img.height - minSide) / 2;
      ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function toLocalISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}

function normalizeData(){
  if(!Array.isArray(data.exercises)) data.exercises = [];
  if(!Array.isArray(data.sessions)) data.sessions = [];
  data.exercises.forEach(e=>{
    if(!ALL_GROUPS.includes(e.muscleGroup)) e.muscleGroup = MUSCLE_GROUPS[0];
    if(!EFFORT_TYPES.some(t=>t.key===e.type)) e.type = 'Volume';
    if(e.archived===undefined) e.archived = false;
  });
  data.sessions.forEach(s=>{
    if(!s.entries) s.entries = {};
    if(!s.done) s.done = {};
    if(!Array.isArray(s.activeExercises)){
      const ids = new Set([...Object.keys(s.entries||{}), ...Object.keys(s.done||{})]);
      s.activeExercises = [...ids];
    }
    if(!s.supersets || typeof s.supersets !== 'object') s.supersets = {};
  });
  if(!data.profile) data.profile = { heightCm:null, weightLog:[] };
  if(data.profile.age===undefined) data.profile.age = null;
  if(data.profile.sex===undefined) data.profile.sex = null;
  if(data.profile.activityLevel===undefined) data.profile.activityLevel = null;
  if(data.profile.goal===undefined) data.profile.goal = null;
  if(!Array.isArray(data.profile.weightLog)) data.profile.weightLog = [];
  if(!Array.isArray(data.profile.measurements)) data.profile.measurements = [];
  if(!Array.isArray(data.templates)) data.templates = [];
  if(!Array.isArray(data.unlockedAchievements)) data.unlockedAchievements = [];
  if(!Array.isArray(data.challengeWins)) data.challengeWins = [];
}

function getOrCreateTodaySession(){
  const iso = todayISO();
  let s = data.sessions.find(s=>s.date===iso);
  if(!s){ s = {id:'sess_'+Date.now(), date: iso, entries:{}, done:{}, activeExercises:[], supersets:{}}; data.sessions.push(s); }
  if(!s.done) s.done = {};
  if(!Array.isArray(s.activeExercises)) s.activeExercises = [];
  if(!s.supersets || typeof s.supersets !== 'object') s.supersets = {};
  return s;
}

function allSetsForExercise(exoId, excludeSessionId){
  const out = [];
  for(const s of data.sessions){
    if(s.id===excludeSessionId) continue;
    const sets = s.entries[exoId];
    if(sets) sets.forEach(st=>out.push(Object.assign({}, st, {date:s.date})));
  }
  return out;
}
function bestWeight(exoId, excludeSessionId){
  const sets = allSetsForExercise(exoId, excludeSessionId);
  if(!sets.length) return null;
  return sets.reduce((m,s)=> s.weight>m ? s.weight : m, 0);
}
function lastPerformance(exoId, excludeSessionId){
  const sets = allSetsForExercise(exoId, excludeSessionId);
  if(!sets.length) return null;
  sets.sort((a,b)=> a.date < b.date ? 1 : -1);
  const lastDate = sets[0].date;
  return sets.filter(s=>s.date===lastDate);
}

function daysSinceLastSession(){
  const dates = data.sessions.filter(s=>Object.keys(s.entries).length>0).map(s=>s.date);
  if(!dates.length) return null;
  const latest = dates.slice().sort().slice(-1)[0];
  const dt = new Date(latest+"T12:00:00");
  const today = new Date(); today.setHours(12,0,0,0);
  return Math.floor((today-dt)/86400000);
}

const ACTIVITY_XP_RULES = {
  sedentaire: { tolerance:5, rate:3 },
  leger:      { tolerance:3, rate:5 },
  modere:     { tolerance:2, rate:6 },
  actif:      { tolerance:1, rate:7 },
  tresactif:  { tolerance:1, rate:8 }
};
function computeRankXP(){
  const sessionCount = data.sessions.filter(s=>Object.keys(s.entries).length>0).length;
  let totalVolume = 0;
  data.sessions.forEach(s=>{
    for(const exoId in s.entries) s.entries[exoId].forEach(st=> totalVolume += st.weight*st.reps);
  });
  const winBonus = (data.challengeWins||[]).length * 100;
  const rawXP = Math.round(sessionCount*15 + totalVolume/100 + winBonus);
  const days = daysSinceLastSession();
  const rules = ACTIVITY_XP_RULES[data.profile.activityLevel] || { tolerance:2, rate:6 };
  let penalty = 0;
  if(days!==null && days > rules.tolerance) penalty = (days - rules.tolerance) * rules.rate;
  return { xp: Math.max(0, rawXP - penalty), rawXP, penalty, days, winBonus };
}

function renderRankBadge(){
  const el = document.getElementById('rankBadge');
  if(!el) return;
  const { xp, penalty, days, winBonus } = computeRankXP();
  let current = RANK_TIERS[0], next = RANK_TIERS[1];
  for(let i=0;i<RANK_TIERS.length;i++){
    if(xp >= RANK_TIERS[i].min){ current = RANK_TIERS[i]; next = RANK_TIERS[i+1] || null; }
  }
  let title = "XP : " + xp;
  if(next) title += " (encore " + (next.min - xp) + " pour " + next.name + ")";
  if(winBonus>0) title += " · dont " + winBonus + " XP de défis hebdo remportés (" + (data.challengeWins||[]).length + ")";
  if(penalty>0) title += " — inactif depuis " + days + "j, -" + penalty + " XP";
  el.title = title;
  el.innerHTML = '<span class="rank-gem" style="background:' + current.color + '"></span>' + current.name
    + (penalty>0 ? '<span style="color:var(--text-faint); margin-left:2px;">⚠</span>' : '');
  if(lastKnownRank!==null && lastKnownRank!==current.name){
    el.classList.remove('levelup');
    void el.offsetWidth;
    el.classList.add('levelup');
  }
  lastKnownRank = current.name;
}

function formatTime(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function updateTimerUI(){
  const disp = document.getElementById('timerDisplay');
  if(disp){
    disp.textContent = formatTime(timerSeconds);
    disp.classList.toggle('timer-pulsing', timerRunning);
  }
  const btn = document.getElementById('timerToggleBtn');
  if(btn) btn.textContent = timerRunning ? 'Pause' : (timerSeconds>0 ? 'Reprendre' : 'Départ');
}
function tickTimer(){
  timerSeconds--;
  if(timerSeconds<=0){
    clearInterval(timerInterval); timerInterval=null; timerRunning=false; timerSeconds=0;
    updateTimerUI();
    playBeep();
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    showToast("⏱️ Repos terminé !");
    return;
  }
  updateTimerUI();
}
function startTimer(sec){
  clearInterval(timerInterval);
  timerSeconds = sec; timerTotal = sec; timerRunning = true;
  updateTimerUI();
  timerInterval = setInterval(tickTimer, 1000);
}
function toggleTimer(){
  if(timerRunning){
    clearInterval(timerInterval); timerInterval=null; timerRunning=false; updateTimerUI();
  } else {
    if(timerSeconds<=0) return;
    timerRunning = true; updateTimerUI();
    timerInterval = setInterval(tickTimer, 1000);
  }
}
function resetTimer(){
  clearInterval(timerInterval); timerInterval=null; timerRunning=false; timerSeconds=0; timerTotal=0;
  updateTimerUI();
}
function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.35);
    o.start();
    o.stop(ctx.currentTime+0.35);
  }catch(e){}
}

function sessionMuscleGroups(session){
  const groups = [];
  const exoIds = new Set([...Object.keys(session.entries||{}).filter(id=>session.entries[id] && session.entries[id].length), ...Object.keys(session.done||{}).filter(id=>session.done[id])]);
  exoIds.forEach(exoId=>{
    const exo = data.exercises.find(e=>e.id===exoId);
    if(exo && !groups.includes(exo.muscleGroup)) groups.push(exo.muscleGroup);
  });
  return groups;
}

function getOneYearAgoInsight(){
  const today = new Date(); today.setHours(12,0,0,0);
  const oneYearAgo = new Date(today); oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);
  let best = null, bestDiff = Infinity;
  data.sessions.forEach(s=>{
    if(!Object.keys(s.entries).length) return;
    const sDate = new Date(s.date+"T12:00:00");
    const diff = Math.abs(sDate - oneYearAgo) / 86400000;
    if(diff <= 3 && diff < bestDiff){ bestDiff = diff; best = s; }
  });
  if(!best) return null;
  let topExo = null, topWeight = -1;
  for(const exoId in best.entries){
    best.entries[exoId].forEach(st=>{
      if(st.weight > topWeight){ topWeight = st.weight; topExo = exoId; }
    });
  }
  const exo = data.exercises.find(e=>e.id===topExo);
  const groups = sessionMuscleGroups(best);
  const label = best.customName || (groups.length ? ('Séance ' + groups.join(', ')) : 'Séance');
  let msg = '📆 Il y a un an (' + fmtDate(best.date) + '), tu faisais : <b>' + escapeHtml(label) + '</b>.';
  if(exo) msg += ' Le plus lourd ce jour-là : ' + escapeHtml(exo.name) + ' à ' + topWeight + ' kg.';
  return msg;
}

    }
    addedCount++;

  renderSeance();

function removeFromTodaySession(sessionId, exoId){
  const session = data.sessions.find(s=>s.id===sessionId);
  if(!session) return;
  const hasSets = session.entries[exoId] && session.entries[exoId].length > 0;
  if(hasSets && !window.confirm("Retirer cet exercice de la séance ? Les séries déjà loggées aujourd'hui pour cet exercice seront supprimées.")) return;
  session.activeExercises = (session.activeExercises||[]).filter(id=>id!==exoId);
  delete session.entries[exoId];
  if(session.done) delete session.done[exoId];
  if(session.supersets){
    for(const gid in session.supersets){
      session.supersets[gid] = session.supersets[gid].filter(id=>id!==exoId);
      if(session.supersets[gid].length < 2) delete session.supersets[gid];
    }
  }
  if(editingSet && editingSet.sessionId===sessionId && editingSet.exoId===exoId) editingSet = null;
  if(expandedExo===exoId) expandedExo = null;
  saveData();
  renderSeance();
  showToast("Exercice retiré de la séance");
}

function finishSession(){
  const session = getOrCreateTodaySession();
  if((session.activeExercises||[]).length===0){ showToast("Ajoute au moins un exercice avant de terminer"); return; }
  const groups = sessionMuscleGroups(session);
  const suggested = groups.length ? ('Séance ' + groups.join(', ')) : 'Séance';
  const name = window.prompt("Nom de cette séance :", session.customName || suggested);
  session.customName = (name && name.trim()) ? name.trim() : suggested;
  session.activeExercises = [];
  expandedExo = null;
  editingSet = null;
  saveData();
  renderSeance();
  renderHisto();
  renderStats();
  showToast("Séance enregistrée 💪");
  playFinishCelebration();
}
function playFinishCelebration(){
  const overlay = document.createElement('div');
  overlay.className = 'finish-celebration';
  overlay.innerHTML = '<div class="finish-check"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#141517" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>';
  document.body.appendChild(overlay);
  const colors = ['#b39ddb','#e8d48a','#7fb37f','#c77b6b'];
  for(let i=0;i<16;i++){
    const bit = document.createElement('span');
    bit.className = 'confetti-bit';
    bit.style.background = colors[i%colors.length];
    const angle = (Math.PI*2*i)/16;
    const dist = 70 + Math.random()*30;
    bit.style.setProperty('--dx', Math.cos(angle)*dist+'px');
    bit.style.setProperty('--dy', Math.sin(angle)*dist+'px');
    overlay.appendChild(bit);
  }
  requestAnimationFrame(()=>{
    overlay.querySelector('.finish-check').classList.add('play');
    overlay.querySelectorAll('.confetti-bit').forEach(b=>b.classList.add('play'));
  });
  setTimeout(()=>overlay.remove(), 1300);
}

const AVAILABLE_PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
function renderPlateResult(){
  const target = parseFloat(document.getElementById('plateTargetInput').value);
  const bar = parseFloat(document.getElementById('plateBarInput').value) || 0;
  const el = document.getElementById('plateResult');
  if(isNaN(target) || target<=0){ el.innerHTML = ''; return; }
  if(target < bar){ el.innerHTML = '<div class="insight">Le poids visé est inférieur à la barre seule.</div>'; return; }
  let perSide = (target - bar) / 2;
  if(perSide < 0){ el.innerHTML = '<div class="insight">Poids invalide.</div>'; return; }
  const used = [];
  let remaining = perSide;
  AVAILABLE_PLATES.forEach(p=>{
    while(remaining + 1e-6 >= p){ used.push(p); remaining -= p; }
  });
  const achieved = bar + used.reduce((a,b)=>a+b,0)*2;
  let html = '<div class="stat-row"><div class="stat-box"><div class="v">' + achieved + ' kg</div><div class="l">poids réel obtenu</div></div></div>';
  if(used.length===0){
    html += '<div class="insight">Barre seule, aucune plaque à ajouter.</div>';
  } else {
    html += '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;">' + used.map(p=>'<span class="tag" style="background:var(--surface-3); color:var(--text); font-size:12px; padding:5px 10px;">' + p + ' kg</span>').join('') + '</div>';
    html += '<div style="font-size:11px; color:var(--text-faint); margin-top:8px;">Par côté, de la plus grosse à la plus petite. ' + (Math.abs(remaining)>0.01 ? 'Reste ' + remaining.toFixed(2) + ' kg impossible à charger avec ce jeu de plaques.' : '') + '</div>';
  }
  el.innerHTML = html;
}
function render1RMResult(){
  const w = parseFloat(document.getElementById('rmWeightInput').value);
  const r = parseInt(document.getElementById('rmRepsInput').value);
  const el = document.getElementById('rmResult');
  if(isNaN(w) || isNaN(r) || w<=0 || r<=0){ el.innerHTML = ''; return; }
  if(r===1){ el.innerHTML = '<div class="stat-row"><div class="stat-box"><div class="v">' + w + ' kg</div><div class="l">1RM (déjà à 1 rep)</div></div></div>'; return; }
  const epley = w * (1 + r/30);
  const brzycki = w * (36 / (37 - r));
  const avg = Math.round((epley+brzycki)/2 * 2)/2;
  el.innerHTML = '<div class="stat-row">'
    + '<div class="stat-box"><div class="v">' + avg + ' kg</div><div class="l">estimation moyenne</div></div>'
    + '</div><div class="insight">Epley : ' + Math.round(epley*2)/2 + ' kg · Brzycki : ' + Math.round(brzycki*2)/2 + ' kg. Ces formules perdent en précision au-delà de 10-12 reps.</div>';
}

function editSet(sessionId, exoId, idx){
  const session = data.sessions.find(s=>s.id===sessionId);
  const s = session.entries[exoId][idx];
  editingSet = { sessionId, exoId, idx, weight:s.weight, reps:s.reps };
  expandedExo = exoId;
  renderSeance();
  setTimeout(()=>{ const inp = document.getElementById('w_'+exoId); if(inp) inp.focus(); }, 50);
}
function cancelEditSet(){
  editingSet = null;
  renderSeance();
}
function addSet(sessionId, exoId){
  const w = parseFloat(document.getElementById('w_'+exoId).value);
  const r = parseInt(document.getElementById('r_'+exoId).value);
  if(isNaN(w) || isNaN(r) || w<0 || r<0){ showToast("Entre un poids et des reps valides"); return; }
  const session = data.sessions.find(s=>s.id===sessionId);
  if(editingSet && editingSet.sessionId===sessionId && editingSet.exoId===exoId){
    session.entries[exoId][editingSet.idx].weight = w;
    session.entries[exoId][editingSet.idx].reps = r;
    editingSet = null;
    saveData();
    renderSeance();
    showToast("Série modifiée");
    return;
  }
  if(!session.entries[exoId]) session.entries[exoId]=[];
  const prevBest = bestWeight(exoId, sessionId);
  session.entries[exoId].push({weight:w, reps:r, ts:Date.now()});
  saveData();
  renderSeance();
  if(prevBest!==null && w>prevBest){
    showToast("🏆 Nouveau record : " + w + " kg !");
    const allRows = document.querySelectorAll('.set-row[data-exo-id="' + exoId + '"]');
    if(allRows.length) allRows[allRows.length-1].classList.add('flash');
  }
}

function deleteSet(sessionId, exoId, idx){
  const row = document.querySelector('.set-row[data-exo-id="' + exoId + '"][data-set-idx="' + idx + '"]');
  const doDelete = () => {
    const session = data.sessions.find(s=>s.id===sessionId);
    session.entries[exoId].splice(idx,1);
    if(session.entries[exoId].length===0) delete session.entries[exoId];
    if(editingSet && editingSet.sessionId===sessionId && editingSet.exoId===exoId) editingSet = null;
    saveData();
    renderSeance();
  };
  if(row){
    row.classList.add('removing');
    setTimeout(doDelete, 240);
  } else {
    doDelete();
  }
}

function renderLibraryList(filterText){
  const q = normalizeStr(filterText||'');
  let matches = EXERCISE_LIBRARY.filter(ex => normalizeStr(ex.name).includes(q));
  if(libraryGroupFilter) matches = matches.filter(ex => ex.group===libraryGroupFilter);
  const el = document.getElementById('libraryResults');
  const filterChip = libraryGroupFilter
    ? '<div style="display:flex; align-items:center; gap:6px; margin-bottom:10px;"><span class="tag" style="background:var(--surface-3); color:var(--text);">Filtré : ' + libraryGroupFilter + '</span><button class="del-btn" onclick="clearLibraryGroupFilter()" title="Retirer le filtre">✕</button></div>'
    : '';
  if(matches.length===0){
    el.innerHTML = filterChip + '<div class="lib-empty">Aucun résultat. Tu peux créer ton propre exercice ci-dessous.</div>';
    return;
  }
  const groups = ALL_GROUPS.filter(g => matches.some(m=>m.group===g));
  let html = filterChip;
  groups.forEach(g=>{
    html += '<div class="lib-group-title">' + g + '</div>';

      const idx = EXERCISE_LIBRARY.indexOf(ex);

        + '<span class="lib-name">' + escapeHtml(ex.name) + '</span>'
        + '<span class="tag" style="background:' + EFFORT_TYPES.find(t=>t.key===ex.type).color + '22; color:' + EFFORT_TYPES.find(t=>t.key===ex.type).color + '">' + ex.type + '</span>'
        + '</button>';
    });
  });
  el.innerHTML = html;
}
function addFromLibrary(idx){
  const ex = EXERCISE_LIBRARY[idx];
  const session = getOrCreateTodaySession();
  let existing = data.exercises.find(e => normalizeStr(e.name) === normalizeStr(ex.name));
  if(!existing){
    existing = {id:'exo_'+Date.now(), name:ex.name, muscleGroup:ex.group, type:ex.type};
    data.exercises.push(existing);
  }
  if(session.activeExercises.includes(existing.id)){
    showToast("Déjà dans ta séance du jour");
    closeLibraryModal();
    return;
  }
  session.activeExercises.push(existing.id);
  saveData();
  closeLibraryModal();
  renderSeance();
  renderStats();
  showToast(ex.name + " ajouté à la séance");

function renderCalendarView(){
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + calendarMonthOffset);
  const year = base.getFullYear(), month = base.getMonth();
  const monthLabel = base.toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // Monday=0
  const daysInMonth = new Date(year, month+1, 0).getDate();

  const sessionsByDate = {};
  data.sessions.forEach(s=>{
    if(Object.keys(s.entries).length>0 || Object.keys(s.done||{}).length>0 || s.customName) sessionsByDate[s.date] = s;
  });

  let html = '<div class="card">'
    + '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">'
    + '<button class="btn btn-secondary" style="padding:6px 12px;" onclick="shiftCalendarMonth(-1)">‹</button>'
    + '<b style="text-transform:capitalize;">' + monthLabel + '</b>'
    + '<button class="btn btn-secondary" style="padding:6px 12px;" onclick="shiftCalendarMonth(1)">›</button>'
    + '</div>'

  for(let i=0;i<firstDow;i++) html += '<div></div>';
  for(let d=1; d<=daysInMonth; d++){
    const iso = toLocalISO(new Date(year, month, d));

function renderHisto(){
  const el = document.getElementById('view-histo');
  const sorted = data.sessions.filter(s=> Object.keys(s.entries).length>0 || Object.keys(s.done||{}).length>0 || s.customName).slice().sort((a,b)=> a.date<b.date?1:-1);
  const toggleBtn = '<button class="btn btn-ghost" style="margin-bottom:10px;" onclick="toggleHistoView()">' + (historoView==='list' ? '📅 Vue calendrier' : '📋 Vue liste') + '</button>';
  if(sorted.length===0){
    el.innerHTML = toggleBtn + '<div class="card empty"><b>Pas encore d\u2019historique</b>Tes séances passées apparaîtront ici — termine ta première séance depuis l\u2019onglet Séance.</div>';
    return;
  }
  if(historoView==='calendar'){
    el.innerHTML = toggleBtn + renderCalendarView();
    return;
  }
  let html = toggleBtn + '<div class="history-timeline">';
  if(sorted.length > 3){
    html += '<input type="text" id="historySearchInput" placeholder="Rechercher un exercice, une date..." autocomplete="off" oninput="filterHistory(this.value)" style="width:100%; background:var(--surface-3); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:12px; font-size:15px; margin-bottom:12px;">';
  }
  sorted.forEach((s, sIdx) => {
    const groups = sessionMuscleGroups(s);
    const displayName = s.customName || (groups.length ? ('Séance ' + groups.join(', ')) : 'Séance');
    const isOpen = expandedHistorySessions.has(s.id);
    const exoIds = new Set([...Object.keys(s.entries), ...Object.keys(s.done||{})]);
    const exoNames = [...exoIds].map(id=>{ const e = data.exercises.find(x=>x.id===id); return e ? e.name : ''; });
    const hasPR = [...exoIds].some(exoId=>{
      const setList = s.entries[exoId] || [];
      if(!setList.length) return false;
      const best = bestWeight(exoId, s.id);
      return best!==null && setList.some(st=>st.weight>best);
    });
    const blob = normalizeStr(displayName + ' ' + fmtDate(s.date) + ' ' + exoNames.join(' '));
    html += '<div class="hist-session' + (hasPR ? ' hist-pr' : '') + (sIdx===0 ? ' hist-latest' : '') + '" data-search-blob="' + blob + '">'
      + '<div class="hist-date" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleHistorySession(\'' + s.id + '\')">'
      + '<span><b style="color:var(--text); font-family:-apple-system,sans-serif;">' + escapeHtml(displayName) + '</b>' + (hasPR ? ' <span class="hist-pr-ribbon" title="Record battu">🏆</span>' : '') + '<br><span style="color:var(--text-faint);">' + fmtDate(s.date) + ' · ' + exoIds.size + ' exo(s)</span></span>'
      + '<span style="display:flex; align-items:center; gap:6px;">'
      + '<button class="edit-btn" onclick="event.stopPropagation(); renameSession(\'' + s.id + '\')" title="Renommer">✎</button>'
      + '<button class="del-btn" onclick="event.stopPropagation(); deleteSession(\'' + s.id + '\')" title="Supprimer cette séance">✕</button>'
      + '<span style="color:var(--text-faint); font-size:16px;">' + (isOpen?'−':'+') + '</span>'
      + '</span></div>';
    if(isOpen){
      exoIds.forEach(exoId=>{
        const exo = data.exercises.find(e=>e.id===exoId);
        const name = exo ? exo.name : '(exercice supprimé)';
        const setList = s.entries[exoId] || [];
        if(setList.length){
          const best = bestWeight(exoId, s.id);
          const sets = setList.map(st=>{
            const isPR = best!==null && st.weight > best;
            return st.weight + "kg×" + st.reps + (isPR ? ' <span style="color:var(--gold);" title="Record à cette date">★</span>' : '');
          }).join(', ');
          html += '<div class="hist-exo" style="margin-top:8px;"><span class="n">' + escapeHtml(name) + '</span> — <span class="s">' + sets + '</span></div>';
        } else if(s.done && s.done[exoId]){
          html += '<div class="hist-exo" style="margin-top:8px;"><span class="n">' + escapeHtml(name) + '</span> — <span class="s">✓ fait (sans détail)</span></div>';
        }
      });
      if(s.note){
        html += '<div class="insight" style="margin-top:10px;">📝 ' + escapeHtml(s.note) + '</div>';
      }
    }
    html += '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
}
function filterHistory(query){
  const q = normalizeStr(query||'');
  document.querySelectorAll('#view-histo .hist-session').forEach(card=>{
    const blob = card.getAttribute('data-search-blob') || '';
    card.style.display = blob.includes(q) ? '' : 'none';
  });
}
function renameSession(sessionId){
  const s = data.sessions.find(x=>x.id===sessionId);

  const groups = sessionMuscleGroups(s);

  saveData();
  renderHisto();
}

function ancienneteJours(){
  const dates = data.sessions.filter(s=>Object.keys(s.entries).length>0).map(s=>s.date).sort();
  if(!dates.length) return 0;
  const first = new Date(dates[0]+"T12:00:00");
  return (new Date() - first) / 86400000;
}
function totalVolumeAllTime(){
  let v = 0;
  data.sessions.forEach(s=>{ for(const id in s.entries) s.entries[id].forEach(st=> v += st.weight*st.reps); });
  return v;
}
function countAllTimePRs(){
  let count = 0;
  data.exercises.forEach(exo=>{
    const sets = allSetsForExercise(exo.id, null).slice().sort((a,b)=> a.date<b.date?-1:1);
    let best = -1;
    sets.forEach(s=>{ if(s.weight > best){ best = s.weight; count++; } });
  });
  return count;
}
function longestStreak(){
  const dates = [...new Set(data.sessions.filter(s=>Object.keys(s.entries).length>0).map(s=>s.date))].sort();
  if(!dates.length) return 0;
  let max=1, cur=1;
  for(let i=1;i<dates.length;i++){
    const prev = new Date(dates[i-1]+"T12:00:00");
    const curD = new Date(dates[i]+"T12:00:00");
    if((curD-prev)/86400000 === 1){ cur++; max=Math.max(max,cur); } else { cur=1; }
  }
  return max;
}

function animateCounter(el, target, suffix){
  if(!el) return;
  suffix = suffix || '';
  const dur = 650;
  const start = performance.now();
  function step(now){
    const p = Math.min(1, (now-start)/dur);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(eased*target).toLocaleString('fr-FR') + suffix;
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderRegularity(){
  const days = 91;
  const today = new Date();
  today.setHours(12,0,0,0);
  const volumeByDate = {};
  data.sessions.forEach(s=>{
    let vol = 0;
    for(const exoId in s.entries) s.entries[exoId].forEach(st=> vol += st.weight*st.reps);
    if(vol>0) volumeByDate[s.date] = vol;
  });

  // stats
  const last30 = Object.keys(volumeByDate).filter(d=>{
    const dt = new Date(d+"T12:00:00");
    return (today - dt) / 86400000 <= 30;
  }).length;
  let streak = 0;
  for(let i=0;i<days;i++){
    const dt = new Date(today); dt.setDate(dt.getDate()-i);
    const iso = toLocalISO(dt);
    if(volumeByDate[iso]) streak++;
    else if(i>0 || !volumeByDate[todayISO()]) break;
  }
  document.getElementById('statBoxes').innerHTML =
    '<div class="stat-row">'
    + '<div class="stat-box"><div class="v" id="statLast30">0</div><div class="l">séances / 30j</div></div>'
    + '<div class="stat-box"><div class="v" id="statStreak">0</div><div class="l">jours de suite ' + (streak>0 ? '<span class="flame-flicker">🔥</span>' : '') + '</div></div>'
    + '<div class="stat-box"><div class="v" id="statTotalSessions">0</div><div class="l">séances au total</div></div>'
    + '</div>';
  animateCounter(document.getElementById('statLast30'), last30);
  animateCounter(document.getElementById('statStreak'), streak);
  animateCounter(document.getElementById('statTotalSessions'), data.sessions.filter(s=>Object.keys(s.entries).length>0).length);

  // heatmap: 13 weeks columns, 7 rows, oldest to newest
  const start = new Date(today); start.setDate(start.getDate()-(days-1));
  const dow = start.getDay(); // 0=Sun
  const offset = (dow===0)?6:dow-1; // align to Monday start
  const cells = [];
  for(let i=0;i<offset;i++) cells.push(null);
  for(let i=0;i<days;i++){
    const dt = new Date(start); dt.setDate(dt.getDate()+i);
    cells.push(toLocalISO(dt));
  }
  while(cells.length % 7 !== 0) cells.push(null);
  const cols = [];
  for(let c=0;c<cells.length/7;c++) cols.push(cells.slice(c*7,c*7+7));

  let maxVol = 0;
  Object.values(volumeByDate).forEach(v=>{ if(v>maxVol) maxVol=v; });

  let html = '<div class="heatmap">';
  cols.forEach((col,colIdx)=>{
    html += '<div class="heat-col">';
    col.forEach(iso=>{
      if(!iso){ html += '<div class="heat-cell"></div>'; return; }
      const v = volumeByDate[iso];
      let bg = 'var(--surface-3)';
      if(v){
        const ratio = maxVol>0 ? v/maxVol : 0;

  });

}

// ---------- Nutrition ----------
const ACTIVITY_LEVELS = [
  {key:'sedentaire', label:'Sédentaire (peu ou pas de sport)', mult:1.2},
  {key:'leger', label:'Léger (1-3 séances/sem.)', mult:1.375},
  {key:'modere', label:'Modéré (3-5 séances/sem.)', mult:1.55},
  {key:'actif', label:'Actif (6-7 séances/sem.)', mult:1.725},
  {key:'tresactif', label:'Très actif (sport intense + travail physique)', mult:1.9}
];
const GOALS = [
  {key:'perte', label:'Perte de poids'},
  {key:'maintien', label:'Maintien'},
  {key:'prise', label:'Prise de masse'}
];

function renderMacroPlate(nutri){
  const C = 2*Math.PI*15.5;
  const p = document.getElementById('segProtein'), c = document.getElementById('segCarb'), f = document.getElementById('segFat');
  if(!p || !c || !f) return;
  const proteinFrac = nutri.proteinPct/100, carbFrac = nutri.carbPct/100, fatFrac = nutri.fatPct/100;
  c.style.strokeDashoffset = -(proteinFrac*C);
  f.style.strokeDashoffset = -((proteinFrac+carbFrac)*C);
  requestAnimationFrame(()=>{
    p.setAttribute('stroke-dasharray', (proteinFrac*C)+' '+C);
    c.setAttribute('stroke-dasharray', (carbFrac*C)+' '+C);
    f.setAttribute('stroke-dasharray', (fatFrac*C)+' '+C);
  });
}

function computeNutrition(){
  const w = latestWeight();
  const h = data.profile.heightCm;
  const age = data.profile.age;
  const sex = data.profile.sex;
  const activity = ACTIVITY_LEVELS.find(a=>a.key===data.profile.activityLevel);
  const goal = data.profile.goal;
  if(!w || !h || !age || !sex || !activity || !goal) return null;

  const bmr = sex==='H' ? (10*w + 6.25*h - 5*age + 5) : (10*w + 6.25*h - 5*age - 161);
  const tdee = bmr * activity.mult;
  let target = tdee;
  if(goal==='perte') target = tdee - 500;
  else if(goal==='prise') target = tdee + 300;
  target = Math.max(1200, target);

  const proteinG = Math.round(w * 1.6);
  const proteinKcal = proteinG * 4;
  const fatKcal = target * 0.25;
  const fatG = Math.round(fatKcal / 9);
  const carbKcal = Math.max(0, target - proteinKcal - fatKcal);
  const carbG = Math.round(carbKcal / 4);

  return {
    bmr: Math.round(bmr), tdee: Math.round(tdee), target: Math.round(target),
    proteinG, fatG, carbG,
    proteinPct: Math.round(proteinKcal/target*100),
    fatPct: Math.round(fatKcal/target*100),
    carbPct: Math.round(carbKcal/target*100)
  };
}

function computeGoalCoherenceInsight(log){
  const goal = data.profile.goal;
  if(!goal || goal==='maintien') return null;
  if(!log || log.length < 2) return null;
  const sorted = log.slice().sort((a,b)=> a.date<b.date?1:-1); // newest first
  const latest = sorted[0];
  const latestDate = new Date(latest.date+"T12:00:00");
  // find an entry roughly 14-21 days before the latest one
  let reference = null;
  for(const e of sorted){
    if(e.date===latest.date) continue;
    const diffDays = (latestDate - new Date(e.date+"T12:00:00")) / 86400000;
    if(diffDays >= 10){ reference = e; break; }
  }
  if(!reference) return null;
  const diffDays = Math.round((latestDate - new Date(reference.date+"T12:00:00")) / 86400000);
  const change = latest.weight - reference.weight;
  const goalLabel = GOALS.find(g=>g.key===goal) ? GOALS.find(g=>g.key===goal).label.toLowerCase() : goal;

  if(goal==='prise' && change <= 0.2){
    return "Ton objectif est la <b>" + goalLabel + "</b>, mais ton poids a " + (change<0?"baissé":"stagné") + " (" + change.toFixed(1) + " kg) sur les " + diffDays + " derniers jours. Si c'est voulu tant mieux, sinon vérifie ton apport calorique dans la section \u00ab Besoins estimés \u00bb ci-dessous.";
  }
  if(goal==='perte' && change >= -0.2){
    return "Ton objectif est la <b>" + goalLabel + "</b>, mais ton poids a " + (change>0?"augmenté":"stagné") + " (+" + change.toFixed(1) + " kg) sur les " + diffDays + " derniers jours. Si c'est voulu tant mieux, sinon vérifie ton apport calorique dans la section \u00ab Besoins estimés \u00bb ci-dessous.";
  }
  return null;
}

function latestValueFor(label){
  const entries = data.profile.measurements.filter(e=>e.values[label]!=null).slice().sort((a,b)=> a.date<b.date?1:-1);
  return entries.length ? { value: entries[0].values[label], date: entries[0].date } : null;
}

function renderSymmetry(){
  const el = document.getElementById('symmetryWrap');
  if(!el) return;

  const results = MEASUREMENT_PAIRS.map(pair=>{
    const l = latestValueFor(pair.left);
    const r = latestValueFor(pair.right);
    if(!l || !r) return { pair, l, r, diff:null };
    const diff = r.value - l.value;
    const pct = ((diff) / ((l.value+r.value)/2) * 100);
    return { pair, l, r, diff, pct };
  });

  const armRes = results.find(x=>x.pair.label==='Bras');
  const legRes = results.find(x=>x.pair.label==='Cuisse');

  function sideColor(res, side){
    if(!res || res.diff===null || Math.abs(res.diff) < 0.3) return '#5a5854';
    const strongerIsRight = res.diff > 0;
    if(side==='right') return strongerIsRight ? '#b39ddb' : '#3a3936';
    return strongerIsRight ? '#3a3936' : '#e8d48a';
  }

  const armLeftColor = sideColor(armRes,'left'), armRightColor = sideColor(armRes,'right');
  const legLeftColor = sideColor(legRes,'left'), legRightColor = sideColor(legRes,'right');

  let html = '<div style="display:flex; gap:18px; align-items:center;">';
  html += '<svg width="110" height="180" viewBox="0 0 110 180" style="flex-shrink:0;">'

    + '<rect x="16" y="36" width="16" height="52" rx="7" fill="' + armRightColor + '"/>'

    + '<text x="47" y="115" font-size="8" fill="#141517" text-anchor="middle" font-weight="700">D</text>'
    + '<text x="63" y="115" font-size="8" fill="#141517" text-anchor="middle" font-weight="700">G</text>'
    + '</svg>';

  html += '<div style="flex:1;">';
  results.forEach(res=>{
    if(!res.l || !res.r){
      html += '<div style="font-size:12px; color:var(--text-faint); margin-bottom:8px;">' + escapeHtml(res.pair.label) + ' : pas assez de données</div>';
      return;
    }
    const bigger = res.diff===0 ? null : (res.diff>0 ? 'droit' : 'gauche');
    html += '<div style="margin-bottom:8px;">'
      + '<div style="font-size:12px; color:var(--text-dim);">' + escapeHtml(res.pair.label) + '</div>'
      + '<div style="font-family:\'SF Mono\',monospace; font-size:13px;">G ' + res.l.value + 'cm — D ' + res.r.value + 'cm'
      + (bigger ? '<span style="color:var(--gold); margin-left:6px;">' + (Math.abs(res.diff)).toFixed(1) + 'cm de plus à ' + bigger + '</span>' : '<span style="color:var(--green); margin-left:6px;">équilibré</span>')
      + '</div></div>';
  });
  html += '</div></div>';
  html += '<div class="insight" style="margin-top:10px;">Vue de face : les côtés G/D sur le corps correspondent à ton côté gauche et droit réel (comme si tu te regardais dans un miroir). Un écart de plus de 1-2 cm entre les deux côtés est courant (bras dominant, etc.) — ce qui compte, c\u2019est de suivre si l\u2019écart se creuse ou se réduit dans le temps.</div>';

  el.innerHTML = html;
}

const SIDE_PAIRS = [
  { label:'Bras', left:'Bras gauche', right:'Bras droit' },
  { label:'Avant-bras', left:'Avant-bras gauche', right:'Avant-bras droit' },
  { label:'Cuisse', left:'Cuisse gauche', right:'Cuisse droite' },

function latestMeasurementValue(point){
  const entries = data.profile.measurements.filter(e=>e.values[point]!=null).slice().sort((a,b)=> a.date<b.date?1:-1);
  return entries.length ? entries[0].values[point] : null;
}
function biggestAsymmetryInsight(){
  let worst = null;
  SIDE_PAIRS.forEach(p=>{
    const l = latestMeasurementValue(p.left), r = latestMeasurementValue(p.right);
    if(l==null || r==null) return;
    const diff = Math.abs(l-r);
    if(!worst || diff > worst.diff) worst = { label:p.label, diff, bigger: l>r ? 'gauche' : (r>l ? 'droit' : null) };
  });
  if(!worst || worst.diff < 0.5) return null;
  return 'Écart le plus marqué : <b>' + escapeHtml(worst.label) + '</b> — côté ' + worst.bigger + ' plus développé de ' + worst.diff.toFixed(1) + ' cm.';
}

async function uploadToCloud(){
  const cfg = loadSyncConfig();
  if(!cfg.url || !cfg.anonKey || !cfg.syncCode){ showToast("Renseigne d'abord tes identifiants cloud"); return; }
  showToast("Envoi en cours...");
  try{
    const activeProfile = getProfilesList().find(pr=>pr.id===ACTIVE_PROFILE_ID);
    const payload = Object.assign({}, data, { _identity: activeProfile ? { name: activeProfile.name, avatar: activeProfile.avatar || null } : null });
    const res = await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/backups', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey': cfg.anonKey,
        'Authorization':'Bearer ' + cfg.anonKey,
        'Prefer':'resolution=merge-duplicates'
      },
      body: JSON.stringify({ sync_key: cfg.syncCode, payload: payload, updated_at: new Date().toISOString() })
    });
    if(!res.ok){
      const errText = await res.text();
      window.alert("Erreur d'envoi cloud (HTTP " + res.status + ")\n\n" + errText);
      return;
    }
    const sessCount = data.sessions.filter(s=>Object.keys(s.entries).length>0).length;
    showToast("Envoyé vers le cloud ✓ (" + sessCount + " séance(s))");
  }catch(e){
    window.alert("Erreur d'envoi cloud (réseau)\n\n" + e.message);
  }
}
async function downloadFromCloud(){
  const cfg = loadSyncConfig();
  if(!cfg.url || !cfg.anonKey || !cfg.syncCode){ showToast("Renseigne d'abord tes identifiants cloud"); return; }
  if(!window.confirm("Ça va remplacer tes données locales par celles du cloud. Continuer ?")) return;
  showToast("Récupération...");
  try{
    const res = await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/backups?sync_key=eq.' + encodeURIComponent(cfg.syncCode) + '&select=payload,updated_at', {
      headers:{ 'apikey': cfg.anonKey, 'Authorization':'Bearer ' + cfg.anonKey }
    });
    if(!res.ok){
      const errText = await res.text();
      window.alert("Erreur de récupération cloud (HTTP " + res.status + ")\n\n" + errText);
      return;
    }
    const rows = await res.json();
    if(!rows.length){ showToast("Aucune sauvegarde trouvée pour ce code"); return; }
    const payload = rows[0].payload;
    const identity = payload._identity;
    delete payload._identity;
    data = payload;
    normalizeData();
    if(identity){
      const list = getProfilesList();
      const p = list.find(pr=>pr.id===ACTIVE_PROFILE_ID);
      if(p){
        if(identity.name) p.name = identity.name;
        if(identity.avatar) p.avatar = identity.avatar;
        saveProfilesList(list);
      }
    }
    saveData();
    render();
    renderProfil();
    const sessCount = data.sessions.filter(s=>Object.keys(s.entries).length>0).length;
    const lastDate = data.sessions.filter(s=>Object.keys(s.entries).length>0).map(s=>s.date).sort().slice(-1)[0];
    window.alert("✅ Données récupérées du cloud\n\n" + sessCount + " séance(s) au total" + (lastDate ? "\nDernière séance : " + fmtDate(lastDate) : "") + "\n" + data.exercises.length + " exercice(s) dans la bibliothèque\n\nSauvegardée le : " + (rows[0].updated_at ? new Date(rows[0].updated_at).toLocaleString('fr-FR', { timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone }) : '—'));
  }catch(e){
    window.alert("Erreur de récupération cloud (réseau)\n\n" + e.message);
  }
}

function exportData(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const activeProfile = getProfilesList().find(p=>p.id===ACTIVE_PROFILE_ID);
  const label = activeProfile ? normalizeStr(activeProfile.name).replace(/\s+/g,'-') : 'export';
  a.href = url;
  a.download = 'ethrniity-' + label + '-' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Export téléchargé");
}
function importDataFile(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!window.confirm("Importer ce fichier va remplacer toutes tes données actuelles sur ce profil. Continuer ?")){
    event.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const imported = JSON.parse(e.target.result);
      if(!imported || typeof imported !== 'object' || !Array.isArray(imported.exercises) || !Array.isArray(imported.sessions)){
        throw new Error('Format de fichier invalide');
      }
      data = imported;
      normalizeData();
      saveData();
      render();
      renderProfil();
      showToast("Données importées ✓");
    }catch(err){
      window.alert("Impossible d'importer ce fichier.\n\n" + err.message);
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}
async function testCloudConnection(){
  const cfg = loadSyncConfig();
  if(!cfg.url || !cfg.anonKey){ showToast("Renseigne d'abord l'URL et la clé"); return; }
  showToast("Test en cours...");

function currentWeekStartISO(){
  const now = new Date();
  const day = now.getDay();
  const diff = (day===0 ? -6 : 1-day);
  const monday = new Date(now);
  monday.setDate(now.getDate()+diff);
  return toLocalISO(monday);
}

const CHALLENGE_TYPES = [
  { key:'volume', label:'Volume total soulevé', unit:'kg', compute: (sessions) => {
      let v=0; sessions.forEach(s=>{ for(const id in s.entries) s.entries[id].forEach(st=> v += st.weight*st.reps); });
      return Math.round(v);
    } },
  { key:'sessions', label:'Nombre de séances', unit:'séance(s)', compute: (sessions) => sessions.filter(s=>Object.keys(s.entries).length>0).length },
  { key:'sets', label:'Nombre de séries', unit:'série(s)', compute: (sessions) => {
      let c=0; sessions.forEach(s=>{ for(const id in s.entries) c += s.entries[id].length; });
      return c;
    } },
  { key:'exercises', label:'Exercices différents travaillés', unit:'exo(s)', compute: (sessions) => {
      const set = new Set(); sessions.forEach(s=>{ for(const id in s.entries) if(s.entries[id].length) set.add(id); });
      return set.size;
    } },
  { key:'maxlift', label:'Charge la plus lourde soulevée', unit:'kg', compute: (sessions) => {
      let m=0; sessions.forEach(s=>{ for(const id in s.entries) s.entries[id].forEach(st=>{ if(st.weight>m) m=st.weight; }); });
      return m;
    } },
  { key:'reps', label:'Répétitions totales', unit:'reps', compute: (sessions) => {
      let c=0; sessions.forEach(s=>{ for(const id in s.entries) s.entries[id].forEach(st=> c += st.reps); });
      return c;
    } }
];
function isoWeekNumber(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date-yearStart)/86400000)+1)/7);
}
function currentChallengeType(){
  const wn = isoWeekNumber(new Date());
  return CHALLENGE_TYPES[wn % CHALLENGE_TYPES.length];
}

async function checkAndClaimWeeklyWin(){
  const cfg = loadSyncConfig();
  if(!cfg.url || !cfg.anonKey || !cfg.leaderboardCode || !cfg.syncCode) return;
  const thisMonday = new Date(currentWeekStartISO()+"T12:00:00");
  const prevMonday = new Date(thisMonday); prevMonday.setDate(prevMonday.getDate()-7);
  const prevWeekStart = toLocalISO(prevMonday);
  if((data.challengeWins||[]).includes(prevWeekStart)) return;
  const prevChallenge = CHALLENGE_TYPES[isoWeekNumber(prevMonday) % CHALLENGE_TYPES.length];
  try{
    const res = await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/weekly_challenge?group_code=eq.' + encodeURIComponent(cfg.leaderboardCode) + '&week_start=eq.' + prevWeekStart + '&metric_type=eq.' + prevChallenge.key + '&select=*&order=metric_value.desc&limit=1', {
      headers:{ 'apikey': cfg.anonKey, 'Authorization':'Bearer ' + cfg.anonKey }
    });
    if(!res.ok) return;
    const rows = await res.json();
    if(rows.length && rows[0].profile_key === cfg.syncCode && rows[0].metric_value > 0){
      data.challengeWins.push(prevWeekStart);
      saveData();
      renderRankBadge();

        y:{ ticks:{ color:'#8f8c86', font:{size:10} }, grid:{ color:'#222327' } }
      },
      plugins:{ legend:{ position:'bottom', labels:{ color:'#8f8c86', boxWidth:10, font:{size:11} } } }
    }
  });
}

function switchTab(viewName){
  const buttons = [...document.querySelectorAll('nav.tabs button')];
  buttons.forEach(b=>b.classList.toggle('active', b.dataset.view===viewName));
  const idx = buttons.findIndex(b=>b.dataset.view===viewName);
  const underline = document.getElementById('tabUnderline');
  if(underline && idx>=0) underline.style.left = (idx*100/buttons.length) + '%';
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+viewName).classList.add('active');
  if(viewName==='stats') renderStats();
  if(viewName==='nutrition') renderNutrition();
}
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=> switchTab(btn.dataset.view));
});

function viewProgressionFor(exoId){
  switchTab('stats');
  setTimeout(()=>{
    const sel = document.getElementById('progExoSelect');
    if(sel && [...sel.options].some(o=>o.value===exoId)){
      sel.value = exoId;
      renderProgressionChart();
      if(sel.scrollIntoView) sel.scrollIntoView({behavior:'smooth', block:'center'});
    } else {
      showToast("Pas encore de données pour cet exercice");
    }
  }, 50);
}

document.getElementById('newExoInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') confirmAddExo();
});
document.getElementById('librarySearchInput').addEventListener('input', e=>{
  renderLibraryList(e.target.value);
});

document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.btn');
  if(!btn) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const r = document.createElement('span');
  r.className = 'ripple-effect';
  r.style.width = r.style.height = size + 'px';
  r.style.left = (e.clientX - rect.left - size/2) + 'px';
  r.style.top = (e.clientY - rect.top - size/2) + 'px';
  btn.appendChild(r);
  setTimeout(()=>r.remove(), 550);
});

boot();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').then(reg=>{
      reg.update();
      document.addEventListener('visibilitychange', ()=>{
        if(document.visibilityState==='visible') reg.update();
      });
      window.addEventListener('focus', ()=> reg.update());
      reg.addEventListener('updatefound', ()=>{
        const newSW = reg.installing;
        if(!newSW) return;
        newSW.addEventListener('statechange', ()=>{
          if(newSW.state==='installed' && navigator.serviceWorker.controller){
            showUpdateBanner();
          }
        });
      });
    }).catch(()=>{});
  });
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(refreshing) return;
    refreshing = true;
    window.location.reload();
  });
}
function showUpdateBanner(){
  if(document.getElementById('updateBanner')) return;
  const bar = document.createElement('div');
  bar.id = 'updateBanner';
  bar.style.cssText = 'position:fixed; top:0; left:0; right:0; z-index:200; background:var(--accent); color:#141517; text-align:center; padding:10px; font-size:13px; font-weight:600; cursor:pointer;';
  bar.textContent = '🔄 Nouvelle version disponible — appuie pour mettre à jour';
  bar.onclick = ()=>{ window.location.reload(); };
  document.body.appendChild(bar);
}
</script>
</body>
</html>
