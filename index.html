function computeRankXPAsOf(dateISO){
  const sessionsUpTo = data.sessions.filter(s=>Object.keys(s.entries).length>0 && s.date<=dateISO);
  const sessionCount = sessionsUpTo.length;
  let totalVolume = 0;
  sessionsUpTo.forEach(s=>{
    for(const exoId in s.entries) s.entries[exoId].forEach(st=> totalVolume += (st.weight||0)*(st.reps||0));
  });
  const winBonus = (data.challengeWins||[]).filter(w=>w<=dateISO).length * 100;
  const rawXP = Math.round(sessionCount*15 + totalVolume/100 + winBonus);
  const lastDate = sessionsUpTo.length ? sessionsUpTo.map(s=>s.date).sort().slice(-1)[0] : null;
  let days = null;
  if(lastDate) days = Math.round((new Date(dateISO+"T12:00:00") - new Date(lastDate+"T12:00:00")) / 86400000);
  const rules = ACTIVITY_XP_RULES[data.profile.activityLevel] || { tolerance:2, rate:6 };
  let penalty = 0;
  if(days!==null && days > rules.tolerance) penalty = (days - rules.tolerance) * rules.rate;
  return Math.max(0, rawXP - penalty);
}
function computeXPTimeline(){
  const sessionDates = [...new Set(data.sessions.filter(s=>Object.keys(s.entries).length>0).map(s=>s.date))].sort();
  if(!sessionDates.length) return [];
  const today = todayISO();
  const sorted = [...sessionDates];
  if(!sorted.includes(today)) sorted.push(today);
  sorted.sort();
  const allDates = new Set(sorted);
  for(let i=0;i<sorted.length-1;i++){
    const d0 = new Date(sorted[i]+"T12:00:00");
    const d1 = new Date(sorted[i+1]+"T12:00:00");
    const gapDays = (d1-d0)/86400000;
    if(gapDays > 9){
      const steps = Math.floor(gapDays/7);
      for(let k=1;k<=steps;k++){
        const d = new Date(d0); d.setDate(d.getDate()+k*7);
        if(d < d1) allDates.add(toLocalISO(d));
      }
    }
  }
  return [...allDates].sort().map(d=>({ date:d, xp:computeRankXPAsOf(d) }));
}
function openXPProgressModal(){
  const bg = document.getElementById('leaderboardModalBg');
  const content = document.getElementById('leaderboardModalContent');
  bg.classList.add('open');
  content.innerHTML = leaderboardTabsHtml('progress') + '<div class="chart-wrap" style="height:280px;"><canvas id="xpProgressCanvas"></canvas></div><div id="xpProgressInsight"></div>';
  const timeline = computeXPTimeline();
  if(timeline.length < 2){
    document.getElementById('xpProgressInsight').innerHTML = '<div class="insight">Pas encore assez d\u2019historique pour tracer ta courbe — reviens après quelques séances.</div>';
    return;
  }
  const ctx = document.getElementById('xpProgressCanvas');
  if(xpProgressChart) xpProgressChart.destroy();
  const xpValues = timeline.map(p=>p.xp);
  const maxXP = Math.max(...xpValues, 100);
  const minXP = Math.min(...xpValues, 0);
  function tierIndexForXP(xp){
    let idx = 0;
    for(let i=0;i<RANK_TIERS.length;i++) if(xp>=RANK_TIERS[i].min) idx=i;
    return idx;
  }
  const minTierIdx = Math.max(0, tierIndexForXP(minXP)-1);
  const maxTierIdx = Math.min(RANK_TIERS.length-1, tierIndexForXP(maxXP)+1);

  const yAxisMax = (maxTierIdx < RANK_TIERS.length-1) ? RANK_TIERS[maxTierIdx+1].min : RANK_TIERS[maxTierIdx].min + 3000;
  xpProgressChart = new Chart(ctx, {
    type:'line',
    data:{
      labels: timeline.map(p=>fmtShort(p.date)),

        label:'XP',

        pointBackgroundColor:themeColor('gold','#e8d48a')

    options:{
      maintainAspectRatio:false,
      animation: LINE_DRAW_ANIMATION,
      scales:{
        x:{ ticks:{ color:'#8f8c86', font:{size:10}, maxRotation:0, autoSkip:true, maxTicksLimit:6 }, grid:{ display:false } },
        y:{ min:yAxisMin, max:yAxisMax, ticks:{ display:false }, grid:{ color:'rgba(255,255,255,0.06)' } }
      },

    }
  });
  const first = timeline[0].xp, last = timeline[timeline.length-1].xp;
  const diff = last - first;
  document.getElementById('xpProgressInsight').innerHTML = '<div class="insight">Depuis le début du suivi : <b>' + (diff>=0?'+':'') + diff + ' XP</b> (' + first + ' → ' + last + '). Chaque creux correspond à une période d\u2019inactivité, chaque montée à une séance loggée.</div>';
}

function currentWeekStartISO(){
  const now = new Date();
  const day = now.getDay();
  const diff = (day===0 ? -6 : 1-day);
  const monday = new Date(now);
  monday.setDate(now.getDate()+diff);
  return toLocalISO(monday);
}

function volumeForWeekRange(weekStartISO){
  const endDate = new Date(weekStartISO+"T12:00:00"); endDate.setDate(endDate.getDate()+7);
  const end = toLocalISO(endDate);
  let vol = 0;
  data.sessions.forEach(s=>{
    if(s.date>=weekStartISO && s.date<end){
      for(const exoId in s.entries) s.entries[exoId].forEach(st=> vol += (st.weight||0)*(st.reps||0));
    }
  });
  return vol;
}
function computeWeeklyLoadAdvice(){
  const weekStarts = [];
  const now = new Date();
  for(let i=0;i<6;i++){
    const d = new Date(now); d.setDate(d.getDate() - i*7);
    const day = d.getDay(); const diff = (day===0?-6:1-day);
    const monday = new Date(d); monday.setDate(d.getDate()+diff);
    weekStarts.push(toLocalISO(monday));
  }
  const uniqueWeeks = [...new Set(weekStarts)].sort();
  const currentWeekStart = currentWeekStartISO();
  const idx = uniqueWeeks.indexOf(currentWeekStart);
  if(idx <= 1) return null;
  const lastCompleteWeek = uniqueWeeks[idx-1];
  const priorWeeks = uniqueWeeks.slice(0, idx-1);
  const lastVol = volumeForWeekRange(lastCompleteWeek);
  const priorVols = priorWeeks.map(volumeForWeekRange).filter(v=>v>0);
  if(priorVols.length===0 || lastVol===0) return null;
  const avgPrior = priorVols.reduce((a,b)=>a+b,0)/priorVols.length;
  const ratio = lastVol/avgPrior;
  const pct = Math.round(Math.abs(ratio-1)*100);
  if(ratio >= 1.25){
    return { type:'heavy', text:'💪 Semaine dernière plus lourde que d\u2019habitude (+' + pct + '% de volume par rapport à tes semaines précédentes). Pense à privilégier une semaine plus légère pour laisser la récupération suivre.' };
  }
  if(ratio <= 0.75){
    return { type:'light', text:'🌱 Semaine dernière plus légère que d\u2019habitude (-' + pct + '% de volume). Si tu te sens bien, c\u2019est le bon moment pour remettre de l\u2019intensité.' };
  }
  return null;
}

const CHALLENGE_TYPES = [
  { key:'volume', label:'Volume total soulevé', unit:'kg', compute: (sessions) => {
      let v=0; sessions.forEach(s=>{ for(const id in s.entries) s.entries[id].forEach(st=> v += st.weight*st.reps); });
      return Math.round(v);
    } },
  { key:'sessions', label:'Nombre de séances', unit:'séance(s)', compute: (sessions) => sessions.filter(s=>Object.keys(s.entries).length>0).length },
  { key:'sets', label:'Nombre de séries', unit:'série(s)', compute: (sessions) => {
      let c=0; sessions.forEach(s=>{ for(const id in s.entries) c += s.entries[id].length; });
      return c;
    } },
  { key:'exercises', label:'Exercices différents travaillés', unit:'exo(s)', compute: (sessions) => {
      const set = new Set(); sessions.forEach(s=>{ for(const id in s.entries) if(s.entries[id].length) set.add(id); });
      return set.size;
    } },
  { key:'maxlift', label:'Charge la plus lourde soulevée', unit:'kg', compute: (sessions) => {
      let m=0; sessions.forEach(s=>{ for(const id in s.entries) s.entries[id].forEach(st=>{ if(st.weight>m) m=st.weight; }); });
      return m;
    } },
  { key:'reps', label:'Répétitions totales', unit:'reps', compute: (sessions) => {
      let c=0; sessions.forEach(s=>{ for(const id in s.entries) s.entries[id].forEach(st=> c += st.reps); });
      return c;
    } }
];
function isoWeekNumber(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date-yearStart)/86400000)+1)/7);
}
function currentChallengeType(){
  const wn = isoWeekNumber(new Date());
  return CHALLENGE_TYPES[wn % CHALLENGE_TYPES.length];
}

let lastWeeklyPush = 0;
async function pushWeeklyChallenge(){
  const cfg = loadSyncConfig();
  if(!cfg.url || !cfg.anonKey || !cfg.leaderboardCode || !cfg.syncCode) return;
  const now = Date.now();
  if(now - lastWeeklyPush < 15000) return;
  lastWeeklyPush = now;
  const activeProfile = getProfilesList().find(pr=>pr.id===ACTIVE_PROFILE_ID);
  if(!activeProfile) return;
  const weekStart = currentWeekStartISO();
  const weekSessions = data.sessions.filter(s=>s.date>=weekStart);
  const challenge = currentChallengeType();
  const value = challenge.compute(weekSessions);
  try{
    await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/weekly_challenge', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey': cfg.anonKey,
        'Authorization':'Bearer ' + cfg.anonKey,
        'Prefer':'resolution=merge-duplicates'
      },
      body: JSON.stringify({ group_code: cfg.leaderboardCode, profile_key: cfg.syncCode, week_start: weekStart, name: activeProfile.name, avatar: activeProfile.avatar||null, metric_type: challenge.key, metric_value: value, volume: challenge.key==='volume' ? value : 0, updated_at: new Date().toISOString() })
    });
  }catch(e){ /* best-effort */ }
}
async function checkAndClaimWeeklyWin(){
  const cfg = loadSyncConfig();
  if(!cfg.url || !cfg.anonKey || !cfg.leaderboardCode || !cfg.syncCode) return;
  const thisMonday = new Date(currentWeekStartISO()+"T12:00:00");
  const prevMonday = new Date(thisMonday); prevMonday.setDate(prevMonday.getDate()-7);
  const prevWeekStart = toLocalISO(prevMonday);
  if((data.challengeWins||[]).includes(prevWeekStart)) return;
  const prevChallenge = CHALLENGE_TYPES[isoWeekNumber(prevMonday) % CHALLENGE_TYPES.length];
  try{
    const res = await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/weekly_challenge?group_code=eq.' + encodeURIComponent(cfg.leaderboardCode) + '&week_start=eq.' + prevWeekStart + '&metric_type=eq.' + prevChallenge.key + '&select=*&order=metric_value.desc&limit=1', {
      headers:{ 'apikey': cfg.anonKey, 'Authorization':'Bearer ' + cfg.anonKey }
    });
    if(!res.ok) return;
    const rows = await res.json();
    if(rows.length && rows[0].profile_key === cfg.syncCode && rows[0].metric_value > 0){
      data.challengeWins.push(prevWeekStart);
      saveData();
      renderRankBadge();
      showToast('🏆 Défi de la semaine dernière remporté ! +100 XP');
    }
  }catch(e){ /* silent - best-effort */ }
}

  const date = document.getElementById('measureDateInput').value || todayISO();

  MEASUREMENT_POINTS.forEach(pt=>{
    const inp = document.getElementById('measure_' + slugifyId(pt));

    if(!isNaN(v) && v>0){ values[pt] = v; any = true; }

  const existing = data.profile.measurements.find(e=>e.date===date);

  else data.profile.measurements.push({date, values});
  saveData();
  renderNutrition();
  showToast("Mensurations enregistrées");

function switchTab(viewName){
  const buttons = [...document.querySelectorAll('nav.tabs button')];
  buttons.forEach(b=>b.classList.toggle('active', b.dataset.view===viewName));
  const idx = buttons.findIndex(b=>b.dataset.view===viewName);
  const underline = document.getElementById('tabUnderline');
  if(underline && idx>=0) underline.style.left = (idx*100/buttons.length) + '%';
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+viewName).classList.add('active');
  if(viewName==='stats') renderStats();
  if(viewName==='nutrition') renderNutrition();
}

  const r = document.createElement('span');
  r.className = 'ripple-effect';
  r.style.width = r.style.height = size + 'px';
  r.style.left = (e.clientX - rect.left - size/2) + 'px';

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').then(reg=>{
      reg.update();
      document.addEventListener('visibilitychange', ()=>{
        if(document.visibilityState==='visible') reg.update();
      });
      window.addEventListener('focus', ()=> reg.update());
      reg.addEventListener('updatefound', ()=>{
        const newSW = reg.installing;
        if(!newSW) return;
        newSW.addEventListener('statechange', ()=>{
          if(newSW.state==='installed' && navigator.serviceWorker.controller){
            showUpdateBanner();
          }
        });
      });
    }).catch(()=>{});
  });
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(refreshing) return;
    refreshing = true;
    window.location.reload();
  });
}
function showUpdateBanner(){

  bar.textContent = '🔄 Nouvelle version disponible — appuie pour mettre à jour';
  bar.onclick = ()=>{ window.location.reload(); };
  document.body.appendChild(bar);
}
